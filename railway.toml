# Configuração do deploy no Railway (lida automaticamente pelo `railway up`).
# Só o que está aqui é sobrescrito; build e comando de start continuam os do serviço.

[deploy]
# Deploy sem derrubar o site: o Railway só passa o tráfego pra versão nova depois que ela
# responder neste endpoint (a aplicação já subiu, conectou no banco e rodou as migrações).
# Até lá, a versão antiga continua atendendo quem está usando.
healthcheckPath = "/api/versao"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
