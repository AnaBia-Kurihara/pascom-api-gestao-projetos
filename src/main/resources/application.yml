server:
  port: ${PORT:8080}

spring:
  application:
    name: pascom-fatima-api
  datasource:
    url: jdbc:h2:file:./data/pascomdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # O Flyway só roda no perfil "prod" (Postgres) — localmente o H2 continua no ddl-auto:update
  # de sempre, sem migração nenhuma. Ver o bloco do perfil prod, mais embaixo, pro porquê.
  flyway:
    enabled: false

api:
  resend:
    # E-mail transacional via API HTTPS (não SMTP — o Railway bloqueia as portas de SMTP de saída).
    # Chave gerada em resend.com; "from" precisa ser um remetente autorizado na conta Resend.
    chave: ${RESEND_API_KEY:}
    remetente: ${RESEND_FROM:onboarding@resend.dev}
  security:
    token:
      # Em produção, defina a variável de ambiente JWT_SECRET com um valor forte e secreto.
      secret: ${JWT_SECRET:pascom-fatima-chave-secreta-de-desenvolvimento-trocar-em-producao}
    instagram:
      # Chave usada para criptografar o access token do Instagram no banco.
      # Em produção, defina a variável de ambiente INSTAGRAM_TOKEN_KEY com um valor forte e secreto.
      chave: ${INSTAGRAM_TOKEN_KEY:pascom-fatima-chave-de-criptografia-dev-trocar-em-producao}
    google:
      # ID do cliente OAuth do Google (não é secreto — o mesmo valor também fica hardcoded no front-end).
      client-id: ${GOOGLE_CLIENT_ID:}
  gemini:
    # Chave da API do Gemini (aistudio.google.com/apikey) — "cérebro" do assistente de IA da equipe.
    chave: ${GEMINI_API_KEY:}

app:
  # URL pública onde o front-end está servido — usada para montar o link de redefinição de senha no e-mail.
  base-url: ${APP_BASE_URL:http://localhost:8080}

---
# Perfil de produção (ativado com SPRING_PROFILES_ACTIVE=prod): usa Postgres de verdade
# em vez do arquivo H2 local, e desliga o console do H2.
# PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD são as variáveis que Railway (e a maioria dos
# provedores) já injeta automaticamente quando você conecta um banco Postgres ao serviço.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  # Adota o Flyway numa base que o Hibernate ddl-auto:update já vinha mantendo sozinho até aqui.
  # baseline-on-migrate faz o Flyway aceitar esse schema existente como ponto de partida (marca
  # a versão 1 como "já aplicada" sem rodar nada) em vez de tentar recriar tudo do zero — por
  # isso não existe um V1 em db/migration, só V2 em diante. O ddl-auto continua em "update" por
  # enquanto (o Hibernate segue ajustando o schema como sempre); só depois de confirmar que o
  # Flyway subiu limpo em produção é que ele passa pra "validate" e o Flyway vira o dono de
  # verdade das mudanças de schema.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: "Schema existente, mantido pelo Hibernate ddl-auto antes do Flyway entrar"

