<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Músicas da missa – Pascom Fátima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4FA;--panel:#fff;--tint:#E8EDF7;--ink:#14203D;--ink2:#465273;--ink3:#77829F;--line:#DBE2F0;--brand:#2B57B8;--brand-ink:#fff;--gold:#C79A2E;--gold-soft:#F8EED2;--green:#2C7A57;--green-soft:#DCF0E5;--rose:#B4404A}
@media (prefers-color-scheme: dark){:root{--bg:#0E1424;--panel:#161E36;--tint:#1D2745;--ink:#EBF0FF;--ink2:#B3BDDA;--ink3:#8792B2;--line:#28335A;--brand:#7FA4F2;--brand-ink:#0E1424;--gold:#E2BA5C;--gold-soft:#3A311A;--green:#6FCBA0;--green-soft:#1C3A2E;--rose:#F08C94}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 120px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:26px;margin:4px 0 2px}
.sub{color:var(--ink2);font-size:14.5px;margin:0 0 18px}
.k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.missas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.missa{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 10px;text-align:left;font:inherit;cursor:pointer}
.missa b{display:block;font-size:15px}
.missa small{font-size:12.5px;color:var(--ink3)}
.missa.ok small{color:var(--green)}
.missa.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);margin-bottom:12px}
input,select,textarea{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px}
textarea{resize:vertical;min-height:110px}
.linha{border-top:1px solid var(--line);padding:12px 0}
.linha:first-of-type{border-top:0}
.linha-top{display:flex;gap:8px;align-items:center}
.linha-top select{flex:0 0 42%}
.letra-btn{background:none;border:0;color:var(--brand);font:inherit;font-size:13.5px;padding:6px 0;cursor:pointer}
.rem{background:none;border:0;color:var(--ink3);font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.rodape .btn{flex:1;max-width:320px}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.msg.ok{background:var(--green-soft);color:var(--green)}
.msg.erro{background:#FAE3E5;color:#B4404A}
.vazio{text-align:center;color:var(--ink2);padding:40px 10px}
.dica{font-size:13px;color:var(--ink3);margin:4px 0 0}
</style>
</head>
<body>
<main id="app"><p class="vazio">Carregando…</p></main>
<div class="rodape" id="rodape" hidden><button class="btn primary" id="salvar">Enviar músicas</button></div>
<script>
(function(){
const API='/api/publico/musicos/';
const token=new URLSearchParams(location.search).get('t')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let dados=null, missaSel=null, linhas=[], msg=null;
const NOME_KEY='pascom-musico-nome';
let nome=''; try{ nome=localStorage.getItem(NOME_KEY)||''; }catch(e){}

function fmt(iso){ const [a,m,d]=iso.split('-'); return d+'/'+m; }
async function carregar(){
  try{
    const r=await fetch(API+encodeURIComponent(token)); const b=await r.json();
    if(!r.ok) throw new Error(b.erro||'Link inválido.');
    dados=b;
    if(!missaSel){ const pend=dados.missas.find(m=>!m.musicas.length); missaSel=(pend||dados.missas[0]).chave; }
    prepararLinhas(); render();
  }catch(e){ $('#app').innerHTML='<p class="vazio">'+esc(e.message)+'</p>'; $('#rodape').hidden=true; }
}
function prepararLinhas(){
  const m=dados.missas.find(x=>x.chave===missaSel);
  linhas=m.musicas.length
    ? m.musicas.map(x=>({momento:x.momento,titulo:x.titulo,letra:x.letra||'',abrir:false}))
    : dados.momentos.map(mo=>({momento:mo,titulo:'',letra:'',abrir:false}));
}
function render(){
  const missas=dados.missas.map(m=>'<button class="missa'+(m.chave===missaSel?' sel':'')+(m.musicas.length?' ok':'')+'" data-missa="'+m.chave+'"><b>'+esc(m.rotulo)+'</b><small>'+(m.musicas.length?'✓ '+m.musicas.length+' música(s) enviada(s)':'aguardando músicas')+'</small></button>').join('');
  const opcoes=mo=>dados.momentos.concat(dados.momentos.indexOf(mo)<0&&mo?[mo]:[]).concat(['Outro']).map(x=>'<option'+(x===mo?' selected':'')+'>'+esc(x)+'</option>').join('');
  $('#app').innerHTML=
    '<span class="k">Pascom · Santuário Nossa Senhora de Fátima</span>'+
    '<h1>Músicas do fim de semana</h1><p class="sub">Sábado '+fmt(dados.sabado)+' e domingo '+fmt(dados.domingo)+'. Escolha a missa e preencha as músicas. A equipe do Holyrics recebe na hora pra montar os slides.</p>'+
    (msg?'<div class="msg '+msg.tipo+'">'+esc(msg.texto)+'</div>':'')+
    '<div class="card"><div class="missas">'+missas+'</div></div>'+
    '<div class="card"><label class="fld"><span>Seu nome ou do ministério de música</span><input id="nome" value="'+esc(nome)+'" maxlength="120" placeholder="Ex.: Ministério Santa Cecília" autocomplete="name"></label>'+
    linhas.map((l,i)=>'<div class="linha"><div class="linha-top"><select data-i="'+i+'" data-campo="momento" aria-label="Momento da missa">'+opcoes(l.momento)+'</select>'+
      '<input data-i="'+i+'" data-campo="titulo" value="'+esc(l.titulo)+'" placeholder="Nome da música" maxlength="200" aria-label="Nome da música">'+
      '<button class="rem" data-rem="'+i+'" aria-label="Tirar esta linha">×</button></div>'+
      (l.abrir?'<textarea data-i="'+i+'" data-campo="letra" placeholder="Cole a letra aqui (opcional, ajuda muito a montar os slides)">'+esc(l.letra)+'</textarea>'
        :'<button class="letra-btn" data-letra="'+i+'">'+(l.letra?'✓ Letra colada (editar)':'+ Colar a letra (opcional)')+'</button>')+'</div>').join('')+
    '<button class="btn" id="mais" style="width:100%;margin-top:6px">+ Adicionar música</button>'+
    '<p class="dica">Deixe em branco o que não tiver. Dá pra voltar aqui e corrigir até o fim de semana.</p></div>';
  $('#rodape').hidden=false;
}
function sincronizar(){
  document.querySelectorAll('[data-campo]').forEach(el=>{ linhas[Number(el.dataset.i)][el.dataset.campo]=el.value; });
  const n=$('#nome'); if(n) nome=n.value;
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.missa){ sincronizar(); missaSel=t.dataset.missa; msg=null; prepararLinhas(); render(); return; }
  if(t.dataset.letra!=null){ sincronizar(); linhas[Number(t.dataset.letra)].abrir=true; render(); return; }
  if(t.dataset.rem!=null){ sincronizar(); linhas.splice(Number(t.dataset.rem),1); render(); return; }
  if(t.id==='mais'){ sincronizar(); linhas.push({momento:'Outro',titulo:'',letra:'',abrir:false}); render(); return; }
  if(t.id==='salvar'){
    sincronizar();
    if(!nome.trim()){ msg={tipo:'erro',texto:'Coloque seu nome ou o do ministério de música.'}; render(); return; }
    const musicas=linhas.filter(l=>l.titulo.trim()).map(l=>({momento:l.momento,titulo:l.titulo.trim(),letra:l.letra.trim()}));
    if(!musicas.length){ msg={tipo:'erro',texto:'Preencha pelo menos uma música.'}; render(); return; }
    t.disabled=true; t.textContent='Enviando…';
    try{
      const r=await fetch(API+encodeURIComponent(token)+'/'+missaSel,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enviadoPor:nome.trim(),musicas:musicas})});
      const b=await r.json(); if(!r.ok) throw new Error(b.erro||'Não foi possível enviar.');
      try{ localStorage.setItem(NOME_KEY,nome.trim()); }catch(_){}
      dados=b; const rot=dados.missas.find(x=>x.chave===missaSel).rotulo;
      msg={tipo:'ok',texto:'Obrigado! As músicas da missa de '+rot+' foram enviadas. 🎵'}; prepararLinhas(); render(); window.scrollTo(0,0);
    }catch(err){ msg={tipo:'erro',texto:err.message}; render(); }
    t.disabled=false; t.textContent='Enviar músicas';
  }
});
carregar();
})();
</script>
</body>
</html>
