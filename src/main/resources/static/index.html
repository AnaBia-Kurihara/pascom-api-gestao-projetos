<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pascom Fátima – Organização da equipe</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F2456">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pascom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&family=Anton&family=Great+Vibes&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4FA; --panel:#FFFFFF; --tint:#E8EDF7; --ink:#14203D; --ink2:#465273; --ink3:#77829F; --line:#DBE2F0;
  --brand:#2B57B8; --brand-ink:#FFFFFF; --deep:#14306B; --deep-ink:#EAF0FF;
  --gold:#C79A2E; --gold-soft:#F8EED2; --gold-ink:#6E500B;
  --rose:#B4404A; --rose-soft:#FAE3E5; --green:#2C7A57; --green-soft:#DCF0E5;
  --f-reels:#7A4BC4; --f-carrossel:#2B57B8; --f-stories:#B85F30; --f-foto:#2C7A57;
  --side:#0F2456; --side-ink:#C9D5F2;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --panel:#161E36; --tint:#1D2745; --ink:#EBF0FF; --ink2:#B3BDDA; --ink3:#8792B2; --line:#28335A;
    --brand:#7FA4F2; --brand-ink:#0E1424; --deep:#1A2C5E; --deep-ink:#EAF0FF;
    --gold:#E2BA5C; --gold-soft:#3A311A; --gold-ink:#F0D48A;
    --rose:#F08C94; --rose-soft:#442228; --green:#6FCBA0; --green-soft:#1C3A2E;
    --f-reels:#B394F0; --f-carrossel:#7FA4F2; --f-stories:#F0A070; --f-foto:#6FCBA0;
    --side:#0A1020; --side-ink:#AEBBDD;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#161E36; --tint:#1D2745; --ink:#EBF0FF; --ink2:#B3BDDA; --ink3:#8792B2; --line:#28335A;
  --brand:#7FA4F2; --brand-ink:#0E1424; --deep:#1A2C5E; --deep-ink:#EAF0FF;
  --gold:#E2BA5C; --gold-soft:#3A311A; --gold-ink:#F0D48A;
  --rose:#F08C94; --rose-soft:#442228; --green:#6FCBA0; --green-soft:#1C3A2E;
  --f-reels:#B394F0; --f-carrossel:#7FA4F2; --f-stories:#F0A070; --f-foto:#6FCBA0;
  --side:#0A1020; --side-ink:#AEBBDD;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
p{margin:0}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.app[hidden]{display:none}
#authScreen{height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:20px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;color:#fff;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--side-ink);opacity:.85;line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--side-ink);text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.setor-switch{position:relative;margin:2px 0 16px}
.setor-btn{width:100%;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:9px 10px;color:#fff;text-align:left}
.setor-btn:hover{background:rgba(255,255,255,.1)}
.setor-btn .ico{width:30px;height:30px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none;color:#1B1400}
.setor-btn .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setor-btn .tx{flex:1;min-width:0}
.setor-btn .tx small{display:block;font-size:10.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em}
.setor-btn .tx b{display:block;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setor-btn .chev{width:14px;height:14px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2;flex:none;transition:transform .15s}
.setor-btn.open .chev{transform:rotate(180deg)}
.setor-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 16px 36px rgba(0,0,0,.35);padding:6px;z-index:30}
.setor-menu button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:8px 9px;border-radius:8px;background:none;border:0;color:var(--ink);font-size:13px}
.setor-menu button:hover{background:var(--tint)}
.setor-menu button.active{background:var(--tint);font-weight:600}
.setor-menu .ico{width:24px;height:24px;border-radius:7px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.setor-menu .ico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setor-menu .check{margin-left:auto;width:14px;height:14px;stroke:var(--brand);fill:none;stroke-width:2.4;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;font-size:12px;line-height:1.4;color:var(--side-ink)}
.side-foot button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.main{overflow-y:auto;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 32px 8px}
.top h1{font-size:28px}
.top p{color:var(--ink2);margin-top:4px;max-width:60ch}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.who select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.view{padding:16px 32px 40px}

/* ---------- Botões e pequenos elementos ---------- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:#1B1400;border-color:transparent;font-weight:600}
.btn.light{background:transparent;color:var(--deep-ink);border-color:rgba(255,255,255,.35)}
.btn.danger{color:var(--rose);border-color:var(--rose-soft);background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.lg{width:44px;height:44px;font-size:15px}
.av.xl{width:76px;height:76px;font-size:25px}
.av.xxl{width:120px;height:120px;font-size:38px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.has-foto{background:var(--tint)!important}
.av-empty{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.fmt{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.f-reels{--fc:var(--f-reels)} .f-carrossel{--fc:var(--f-carrossel)} .f-stories{--fc:var(--f-stories)} .f-foto{--fc:var(--f-foto)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--ink2);font-weight:500;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink)}
.pill.bad{background:var(--rose-soft);color:var(--rose)}
.muted{color:var(--ink3)}
.late{color:var(--rose);font-weight:600}
.empty{color:var(--ink3);padding:14px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;font-size:14px}

/* ---------- Painel ---------- */
.hero{background:var(--deep);color:var(--deep-ink);border-radius:16px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"13";position:absolute;right:18px;top:-38px;font-family:var(--serif);font-size:190px;line-height:1;color:rgba(255,255,255,.06);pointer-events:none}
.hero h2{font-size:26px;max-width:22ch}
.hero p{margin-top:8px;opacity:.85}
.hero-act{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.strip{display:flex;flex-wrap:wrap;margin:22px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{flex:1 1 130px;padding:14px 18px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.strip span{color:var(--ink2);font-size:13px}
.strip .alert b{color:var(--rose)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:24px}
.panel h2{font-size:18px;margin-bottom:10px}
.panel+.panel{margin-top:26px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover .rt{text-decoration:underline}
.row .rt{flex:1;min-width:0;font-weight:500}
.dbadge{width:46px;flex:none;text-align:center;line-height:1.1}
.dbadge b{display:block;font-family:var(--serif);font-weight:400;font-size:20px}
.dbadge span{font-size:12px;color:var(--ink3)}
.load{display:grid;grid-template-columns:110px 1fr 24px;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.hi{background:var(--rose)}
.part-lista{display:flex;flex-direction:column}
.part-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.part-row:first-child{border-top:0}
.part-nome{font-weight:600}
.part-sub{font-size:13px;color:var(--ink3);margin-top:2px}
.part-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.part-num{text-align:right;min-width:74px}
.part-num b{font-size:20px;display:block;line-height:1}
.part-num small{font-size:12px;color:var(--ink3)}
.part-row .bar{margin-top:8px;max-width:320px}
.pub-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sug-ev{border-top:1px solid var(--line);padding-top:10px}
.sug-ev:first-child{border-top:0;padding-top:0}
.sug-ev h4{font-size:14px;margin:0 0 6px;color:var(--ink2);font-weight:600}
.sug-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.sug-item input{width:20px;height:20px;flex:0 0 auto}
.sug-item small{color:var(--ink3);font-size:12.5px}
.sug-vazia{color:var(--ink3)}
.ev-cheio{margin:0 16px 12px;padding:10px 12px;border-radius:10px;background:var(--tint);color:var(--ink2);font-size:14px}
.note{font-size:13px;color:var(--ink3);margin-top:8px}

/* ---------- Quadro ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.filters input{min-width:220px}
.filters .tip{color:var(--ink3);font-size:13px;flex:1 1 260px}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.kcol{flex:0 0 262px;background:var(--tint);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.kcol-h h3{font-size:15px}
.kcol-h .cnt{font-size:12px;color:var(--ink2);margin-left:6px;font-family:var(--sans)}
.kcol-h button{border:0;background:none;color:var(--ink2);font-size:20px;line-height:1;border-radius:6px;width:28px;height:28px}
.kcol-h button:hover{background:var(--line)}
.kbody{display:flex;flex-direction:column;gap:8px;min-height:64px;border-radius:8px;transition:background .12s}
.kbody.over{background:color-mix(in srgb,var(--brand) 14%,transparent);outline:2px dashed var(--brand);outline-offset:-2px}
.kcard{background:var(--panel);border-radius:9px;padding:10px 11px;border-left:4px solid var(--fc);cursor:grab;box-shadow:0 1px 0 rgba(20,32,61,.08)}
.kcard.dragging{opacity:.45}
.kcard h4{font-family:var(--sans);font-weight:600;font-size:14px;line-height:1.35;margin:7px 0 8px}
.kc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kc-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.kc-meta .sp{flex:1}
.kc-mv{display:flex;gap:4px}
.kc-mv button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:24px;font-size:11px;color:var(--ink2);padding:0}
.kc-mv button:hover:not([disabled]){border-color:var(--ink3)}
.kc-mv button[disabled]{opacity:.3;cursor:default}

/* ---------- Calendário ---------- */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h2{font-size:22px;min-width:190px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-left:auto;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel);min-width:720px}
.cal .dow{padding:8px;font-size:13px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--tint)}
.cell{min-height:116px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:hover{background:var(--bg)}
.cell.out{background:var(--tint);opacity:.5;cursor:default}
.cell .dn{font-size:13px;font-weight:600;color:var(--ink2)}
.cell.today .dn{background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:1px 7px}
.lit{font-size:11px;line-height:1.25;color:var(--gold-ink);background:var(--gold-soft);border-radius:4px;padding:1px 5px}
.chip{display:block;width:100%;text-align:left;font-size:12px;line-height:1.3;padding:2px 6px;border-radius:4px;border:0;color:var(--fc);background:color-mix(in srgb,var(--fc) 15%,transparent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:color-mix(in srgb,var(--fc) 28%,transparent)}
.evt{font-size:11px;color:var(--ink2);padding:0 4px}
.evt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:5px}
.cal-list{display:none}
.lrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .ld{width:44px;text-align:center;flex:none;line-height:1.1}
.lrow .ld b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.lrow .ld span{font-size:12px;color:var(--ink3)}
.lrow .lc{flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}

/* ---------- Ideias, escalas, equipe, materiais ---------- */
.form-inline{display:grid;grid-template-columns:1.2fr 2fr 1fr auto;gap:10px;align-items:end;margin-bottom:20px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.fld[hidden]{display:none}
.fld input,.fld select,.fld textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px}
.fld textarea{resize:vertical}
.idea{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.idea-actions{display:flex;gap:6px;align-items:center}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 0;width:58px}
.vote b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1}
.vote span{font-size:11px;color:var(--ink3)}
.vote.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.idea h4{font-family:var(--sans);font-weight:600;font-size:16px}
.idea p{color:var(--ink2);font-size:14px;margin-top:2px}
.idea .by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.ev{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ev-h{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ev-h h3{font-size:17px}
.ev-h small{color:var(--ink2);display:block}
.ev-h-actions{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.ev.big .ev-h{background:var(--gold-soft)}
.slot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .sl{width:160px;flex:none;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.slot-tools{display:inline-flex;gap:2px;margin-left:auto;padding-right:6px}
.icon-btn{width:26px;height:26px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--ink3);padding:0}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slot-edit input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font-size:14px}
.slot .sw{flex:1;font-size:14px;display:flex;align-items:center;gap:8px}
.slot-grp{padding:8px 16px 4px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 26px}

.mbar .bell{margin-left:auto;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#fff}

.avisos-lista{gap:10px}

.hist{margin:18px 0 0}
.hist-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:360px;overflow-y:auto}

.hist-item small{color:var(--ink3);font-size:12px}
.aniv-campos{display:flex;gap:8px}

.aniv-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:14px;padding:16px 18px;margin:0 0 16px;background:linear-gradient(135deg,var(--gold-soft),var(--tint));border:1px solid var(--gold)}

.aniv-emoji{font-size:44px;line-height:1}
.aniv-faces{display:flex}.aniv-faces .av{margin-left:-8px;box-shadow:0 0 0 2px var(--gold)}.aniv-faces .av:first-child{margin-left:0}
.aniv-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.aniv-pedir{display:flex;align-items:flex-end;gap:10px 12px;flex-wrap:wrap;background:var(--panel);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.aniv-pedir>div:first-child{flex:1 1 220px;display:flex;flex-direction:column;gap:2px;font-size:14px}

.aniv-prox{margin:-6px 0 14px}
.aniv-pedir-geral{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}

.post-aniv{width:100%;max-width:420px;align-self:center;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);aspect-ratio:1080/1350;background:var(--tint)}
.mont-cab{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--deep);color:var(--deep-ink);border-radius:14px;padding:18px 20px;margin:0 0 18px}

.mont-prog{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;align-content:flex-start}
.mont-prog span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1)}
.mont-prog span.ok{background:var(--gold);color:#1B1400;font-weight:600}
.cor-lit{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:#888}
.cor-verde{background:#2E8B57}.cor-roxo{background:#6A3D9A}.cor-branco{background:#fff}.cor-vermelho{background:#C0392B}.cor-rosa{background:#E89BB5}
.sec-k{font-family:var(--sans);font-size:12.5px;color:var(--ink3);font-weight:500}
details.lit{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
details.lit summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none}
details.lit summary::-webkit-details-marker{display:none}
details.lit summary span{display:flex;flex-direction:column;font-size:14.5px}
details.lit summary span small{color:var(--ink3);font-size:12.5px}
details.lit summary em{font-style:normal;font-size:12.5px;color:var(--gold-ink);margin-top:2px}
details.lit summary>small{color:var(--ink3);font-size:12px;white-space:nowrap}
.lit-corpo{padding:0 14px 6px;display:flex;flex-direction:column;gap:6px}
.lit-corpo p{font-size:14px;color:var(--ink2);background:var(--tint);border-radius:8px;padding:8px 10px}
.lit-acoes{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.panel>.lit-acoes,.mus-pedir .lit-acoes,.panel .lit-acoes:last-child{padding-left:0;padding-right:0}
.mus{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mus-mom{flex:0 0 108px;font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.mus-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.mus-t small{color:var(--ink3);font-size:12.5px}
.mus-t pre{white-space:pre-wrap;font:inherit;font-size:13.5px;color:var(--ink2);background:var(--tint);border-radius:8px;padding:8px 10px;margin-top:6px}
.mus-t summary{font-size:13px;color:var(--brand);cursor:pointer}
.mus-pedir{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.mont-fim .chk b{font-size:15px}
.alerta-mud{background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:0 0 10px}
.sub-h{font-size:15px;margin:16px 0 6px}
.past{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.past>div{flex:1;min-width:0}.past p{font-size:14px}.past small{font-size:12.5px;color:var(--ink3)}
.past.novo p{font-weight:600}
.lembrete-pub{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.lembrete-pub>div{flex:1 1 240px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.lembrete-pub span{font-size:13px;opacity:.9}
.aviso-montagem{background:var(--tint);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px;color:var(--ink2)}
.eq-h{font-size:18px;margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
.eq-h:first-of-type{margin-top:6px}
.eq-h small{font-family:var(--sans);font-size:13px;color:var(--ink3);font-weight:500}
.aviso-equipe{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.aviso-equipe span{flex:1 1 260px}
.push-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 16px}
.push-banner .pb-ic{font-size:26px;line-height:1}
.push-banner .pb-tx{flex:1 1 220px;font-size:14px;color:var(--ink2)}
.push-banner .pb-tx b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.push-banner .pb-acts{display:flex;gap:8px;flex-wrap:wrap}
.push-linha{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.push-linha>p{flex:1 1 240px;margin:0;font-size:14px;color:var(--ink2)}
.push-linha .ok{color:var(--green);font-weight:600}
.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.time-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.time-chips{flex-wrap:wrap;margin-bottom:0}
.chip-n{opacity:.7;font-size:12px;margin-left:2px}
.time-busca{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--ink);min-width:0;flex:1 1 200px;max-width:280px}
.time-sec{margin-top:24px}
.time-sec h2{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:12px}
.time-sec h2 small{font-family:var(--sans);font-size:13px;color:var(--ink3);font-weight:500}
.time-sec h2 .ico{width:30px;height:30px;border-radius:8px;background:var(--tint);display:grid;place-items:center;color:var(--brand);flex:none}
.time-sec h2 .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pessoa{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:transform .15s,box-shadow .15s;min-width:0}
.pessoa:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,32,61,.10)}
.pessoa .av{margin-bottom:4px}
.pessoa b{font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.pessoa .fn{font-size:12.5px;color:var(--ink2);line-height:1.3;overflow-wrap:anywhere}
.pessoa.coord{border-color:var(--gold)}
.pessoa.eu{box-shadow:inset 0 0 0 2px var(--brand)}
.perfil{display:flex;flex-direction:column;gap:18px;max-width:640px}
.perfil-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.perfil-card h2{font-size:18px}
.perfil-foto{flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap}
.perfil-foto>div{flex:1 1 220px}
.side-foot .side-me{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 8px;border:0;background:rgba(255,255,255,.06);padding:8px;border-radius:10px;text-align:left;color:#fff}
.side-foot .side-me:hover,.side-foot .side-me.active{background:rgba(255,255,255,.13)}
.side-me>span:not(.av){min-width:0;flex:1}
.side-me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-me small{display:block;font-size:11px;color:var(--side-ink);opacity:.85}
.faces{display:flex;align-items:center;flex-wrap:wrap;padding-left:8px;margin:4px 0 12px}
.faces .av{margin-left:-8px;box-shadow:0 0 0 2px var(--bg)}
.faces .mais{margin-left:8px;font-size:13px;color:var(--ink3)}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 28px;margin-bottom:26px}
.mat{display:block;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;width:100%}
.mat:hover h4{text-decoration:underline}
.mat h4{font-family:var(--sans);font-weight:600;font-size:15px}
.mat p{color:var(--ink2);font-size:13px}
.tpl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tpl pre{margin:8px 0 12px;white-space:pre-wrap;font-family:var(--sans);font-size:14px;color:var(--ink2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.checklist li{margin-bottom:8px}
.checklist{padding-left:20px;margin:8px 0 0;color:var(--ink2);font-size:14px}
.checklist b{color:var(--ink)}

/* ---------- Modal e toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,14,32,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:50}
.overlay[hidden]{display:none}
.modal{background:var(--panel);width:min(640px,100%);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:20px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--ink2);width:34px;height:34px;border-radius:8px}
.x:hover{background:var(--tint)}
.m-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fset{border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;margin:0}
.fset legend{padding:0 6px;font-size:13px;color:var(--ink2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
.chk small{display:block;color:var(--ink3);font-size:12px}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cm b{font-weight:600}
.cm span{color:var(--ink3);font-size:12px;margin-left:6px}
.cm-new{display:flex;gap:8px;margin-top:8px}
.cm-new input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.m-foot .sp{flex:1}
.update-banner{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;background:var(--deep);color:var(--deep-ink);border:1px solid var(--gold);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:14px;width:max-content;max-width:calc(100vw - 32px)}
.update-banner[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;max-width:min(520px,92vw);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--gold);color:#1B1400}

/* ---------- Dashboard ---------- */
.dash-tabs{display:flex;gap:6px;margin-bottom:14px}
.dash-tab{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.dash-tab:hover{border-color:var(--ink3)}
.dash-tab.active{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.dash-post-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dash-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:4px}

/* ---------- Assistente (chat) ---------- */
.chat-wrap{display:flex;flex-direction:column;max-width:760px;margin:0 auto;min-height:calc(100vh - 220px)}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 10px}
.chat-empty .orb{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--deep));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(43,87,184,.35)}
.chat-empty .orb svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.6}
.chat-empty h3{font-size:21px}
.chat-empty p{color:var(--ink2);max-width:44ch}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chat-chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:13px;color:var(--ink2);cursor:pointer;text-align:left}
.chat-chip:hover{border-color:var(--brand);color:var(--ink)}
.chat-log{flex:1;display:flex;flex-direction:column;gap:18px;padding:10px 2px 20px}
.msg{display:flex;gap:10px;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.msg.user{flex-direction:row-reverse}
.msg.user .av{background:var(--tint);color:var(--ink2)}
.msg.agente .av{background:linear-gradient(135deg,var(--brand),var(--deep));color:#fff}
.msg.agente .av svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.bubble{border-radius:16px;padding:11px 15px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.msg.user .bubble{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.agente .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg-col{display:flex;flex-direction:column;gap:6px;max-width:min(560px,80%)}
.msg.user .msg-col{align-items:flex-end}
.chat-acoes{display:flex;flex-direction:column;gap:5px}
.chat-acao{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);background:var(--tint);border-radius:8px;padding:6px 10px}
.chat-acao svg{width:13px;height:13px;flex:none;stroke:#2a7d46;fill:none;stroke-width:3}
.chat-typing{display:inline-flex;gap:4px;padding:5px 3px}
.chat-typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);display:block;animation:chatDot 1.1s infinite ease-in-out}
.chat-typing i:nth-child(2){animation-delay:.15s}
.chat-typing i:nth-child(3){animation-delay:.3s}
@keyframes chatDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:auto}
.chat-inputwrap{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 18px;box-shadow:0 8px 28px rgba(20,32,61,.08)}
.chat-inputwrap textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:var(--ink);max-height:140px;padding:6px 0;line-height:1.4}
.chat-inputwrap textarea:focus{outline:none}

    '<select id="'+prefixo+'-aniv-mes" aria-label="Mês do aniversário"><option value="">Mês</option>'+MESES.map((m,i)=>'<option value="'+(i+1)+'"'+(i+1===mes?' selected':'')+'>'+m+'</option>').join('')+'</select>'+

function lerAniversario(prefixo){
  const d=Number(($('#'+prefixo+'-aniv-dia')||{}).value||0), m=Number(($('#'+prefixo+'-aniv-mes')||{}).value||0);
  if(!d&&!m) return {dia:null,mes:null,vazio:true};

  if(d>new Date(2024,m,0).getDate()) return {erro:'Esse dia não existe nesse mês.'};

}
const fmtAniv=(d,m)=>d+' de '+MESES[m-1];
// Aniversariantes de uma data (quem nasceu em 29/02 é lembrado no dia 28/02 em ano não bissexto).
function aniversariantesEm(data){
  const d=data.getDate(), m=data.getMonth()+1;
  const bissexto=new Date(data.getFullYear(),1,29).getMonth()===1;
  return MEMBERS.filter(x=>x.anivMes===m&&(x.anivDia===d||(!bissexto&&m===2&&d===28&&x.anivDia===29)));
}

const LIT={'05-13':'N. Sra. de Fátima','09-21':'São Mateus','09-27':'São Vicente de Paulo','09-29':'Santos Arcanjos','09-30':'São Jerônimo','10-01':'Santa Teresinha','10-02':'Santos Anjos da Guarda','10-04':'São Francisco de Assis','10-07':'N. Sra. do Rosário','10-12':'N. Sra. Aparecida','10-15':'Santa Teresa d’Ávila','10-28':'São Judas Tadeu','11-01':'Todos os Santos','11-02':'Finados','12-08':'Imaculada Conceição','12-13':'Santa Luzia','12-25':'Natal'};
const LIT_ABS={'2026-11-22':'Cristo Rei','2026-11-29':'1º domingo do Advento'};

  reels:{titulo:'Modelo de roteiro para Reels',texto:'Gancho (0 a 3 s): uma pergunta ou afirmação forte que prende a atenção.\nDesenvolvimento (3 a 25 s): uma única ideia, em frases curtas.\nFechamento (25 a 35 s): resumo em uma linha.\nChamada para ação: pedir para salvar, compartilhar ou comentar.\nLegenda: 2 a 3 linhas e até 5 hashtags.'},

};

/* =====================================================================
   2. FUNÇÕES DE DATA E UTILIDADES
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const TODAY=iso(new Date());
const addDays=n=>{const t=new Date();return iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+n));};
const diff=s=>Math.round((parse(s)-parse(TODAY))/86400000);
const fmtShort=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1);};
const fmtLong=s=>parse(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nextDow=dow=>{const add=(dow-new Date().getDay()+7)%7||7;return addDays(add);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function next13(){
  const n=new Date();
  let d=new Date(n.getFullYear(),n.getMonth(),13);
  if(iso(d)<TODAY) d=new Date(n.getFullYear(),n.getMonth()+1,13);
  return iso(d);
}
function litLabels(s){
  const out=[];
  if(LIT[s.slice(5)]) out.push(LIT[s.slice(5)]);
  if(LIT_ABS[s]) out.push(LIT_ABS[s]);
  if(s.slice(8)==='13' && s.slice(5)!=='05-13') out.push('Dia 13, Fátima');
  return out;
}

/* =====================================================================
   3. API, AUTENTICAÇÃO E MAPEAMENTO DE DADOS
   ===================================================================== */
const API_BASE='/api'; // relativo: funciona local e em produção, sem precisar trocar nada
const TOKEN_KEY='pascom-fatima-token';
let authToken=null;
try{ authToken=localStorage.getItem(TOKEN_KEY); }catch(e){}
let authMode='login'; // 'login' | 'cadastro' | 'esqueci' | 'redefinir' | 'completarGoogle'
let authError='';
let authOk='';
let resetToken=null;
const GOOGLE_CLIENT_ID='1022872652102-0lanmvkscnhajde1du4i4tq36sfnq92m.apps.googleusercontent.com'; // ID do cliente OAuth (não é secreto)
let pendingGoogle=null; // {idToken, nome, email} enquanto espera escolher papel/setor

async function api(path, options){
  options=options||{};
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(authToken) headers['Authorization']='Bearer '+authToken;
  let res;
  try{
    res=await fetch(API_BASE+path, Object.assign({}, options, {headers:headers}));
  }catch(netErr){
    throw new Error('Não foi possível conectar ao servidor em '+API_BASE+'. A API está rodando?');
  }
  const isAuthEndpoint = path.indexOf('/usuarios/login')===0 || path.indexOf('/usuarios/cadastro')===0;
  if(res.status===401 && !isAuthEndpoint){
    authToken=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
    state={cards:[],ideas:[],events:[],me:null};
    authMode='login'; authError='Sessão expirada. Faça login novamente.';
    renderAuth();
    throw new Error('Sessão expirada.');
  }
  const text=await res.text();
  let body=null;
  if(text){ try{ body=JSON.parse(text); }catch(e){} }
  if(!res.ok){
    const msg=(body && (body.erro || (body.erros && Object.values(body.erros).join(', ')))) || ('Erro '+res.status);
    throw new Error(msg);
  }
  return body;
}

function decodeJwt(token){
  try{
    const payload=token.split('.')[1];
    const norm=payload.replace(/-/g,'+').replace(/_/g,'/');
    const json=decodeURIComponent(atob(norm).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);

function renderGoogleButton(containerId,tentativa){
  tentativa=tentativa||0;

      // O script do Google carrega async e pode não estar pronto ainda no primeiro render —
      // tenta de novo por uns segundos antes de desistir (em vez de nunca mostrar o botão).
      if(tentativa<20) setTimeout(()=>renderGoogleButton(containerId,tentativa+1),250);

    const el=document.getElementById(containerId);

    if(el) google.accounts.id.renderButton(el,{theme:'outline',size:'large',width:Math.max(200,Math.min(320,el.clientWidth||280)),text:'continue_with',locale:'pt-BR'});
  }catch(e){}

const podeTirarDaEscala=whoId=>{const m=me(),w=mem(whoId);return !!m&&(whoId===state.me||gereEscalas()||(m.role==='coordenador'&&!!w&&!!m.setor&&pertenceSetor(w,m.setor)));};

/* Fotos de perfil: a API exige o token, então não dá pra usar <img src> direto na URL. Cada foto
   é baixada uma vez (por versão) e vira um blob: URL; quando chega, troca as iniciais de todos os
   avatares daquela pessoa que já estão na tela, sem re-renderizar a página inteira. */
const FOTO_URL={}, fotoPendente={};
function fotoUrl(m){
  if(!m||!m.foto) return null;
  const k=m.id+':'+m.foto;
  if(FOTO_URL[k]) return FOTO_URL[k];
  if(!fotoPendente[k]){ fotoPendente[k]=true; carregarFoto(m.id,k); }
  return null;
}
async function carregarFoto(id,k){
  try{
    const res=await fetch(API_BASE+'/usuarios/'+id+'/foto?v='+encodeURIComponent(k.split(':')[1]),{headers:authToken?{'Authorization':'Bearer '+authToken}:{}});
    if(!res.ok) return; // fica marcada como pendente: não tenta de novo até recarregar a página
    FOTO_URL[k]=URL.createObjectURL(await res.blob());
    const m=mem(id);
    if(!m||m.id+':'+m.foto!==k) return;
    $$('[data-av="'+id+'"]').forEach(el=>{ el.innerHTML='<img src="'+FOTO_URL[k]+'" alt="">'; el.classList.add('has-foto'); });
  }catch(e){}
}
const iniciais=nome=>String(nome||'?').replace('Pe. ','P').split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase();
// size: falsy = pequeno, true = 'lg', ou 'xl' / 'xxl'
function avatar(id,size){
  const cls='av'+(size===true?' lg':size?' '+size:'');
  if(!id) return '<span class="'+cls+' av-empty" title="Sem responsável">?</span>';
  const m=mem(id);
  if(!m) return '<span class="'+cls+' av-empty" title="Pessoa não encontrada">?</span>';
  const url=fotoUrl(m);
  return '<span class="'+cls+(url?' has-foto':'')+'" data-av="'+esc(m.id)+'" style="background:hsl('+m.h+' 48% 40%)" title="'+esc(m.nome)+'">'+(url?'<img src="'+url+'" alt="">':esc(iniciais(m.nome)))+'</span>';
}
const fmtChip=c=>'<span class="fmt f-'+c.fmt+'">'+FORMATS[c.fmt]+'</span>';
function stagePill(c){
  const k=c.stage==='publicado'?'ok':(c.stage==='agendado'?'ok':(c.stage==='revisao'?'warn':''));
  return '<span class="pill '+k+'">'+stageName(c.stage)+'</span>';
}
function dueText(c){
  if(!c.due) return '<span class="muted">sem prazo</span>';
  const d=diff(c.due);
  if(c.stage==='publicado') return '<span class="muted">entregue</span>';
  if(isLate(c)) return '<span class="late">atrasado '+Math.abs(d)+(Math.abs(d)===1?' dia':' dias')+'</span>';
  if(d===0) return '<b>prazo hoje</b>';
  return '<span>prazo '+fmtShort(c.due)+'</span>';
}

/* Escala no Painel: o que mais importa pra quem abre o app no celular é "quando eu sirvo" e
   "onde ainda falta gente no meu setor". */
const hojeISO=()=>{const a=new Date();return a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0')+'-'+String(a.getDate()).padStart(2,'0');};
const doSetorAtual=s=>s.setor===currentSetor||s.setor===null;
// Mês que já chegou: escala fechada pra equipe (só a coordenação mexe). Mesma regra do backend:
// vale de novembro/2026 em diante (outubro, quando o sistema começou, fica aberto até o fim).
const PRIMEIRO_MES_COM_FECHAMENTO='2026-11';
const mesFechado=iso=>{const m=iso.slice(0,7);return m>=PRIMEIRO_MES_COM_FECHAMENTO&&m<=hojeISO().slice(0,7);};
function proximoMesISO(){const a=new Date();const d=new Date(a.getFullYear(),a.getMonth()+1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
/* A partir do dia 25, quem coordena vê o que falta publicar do mês que vem. Se ninguém publicar,
   o servidor publica sozinho no dia 1º (EventoService.publicarMesQueChegou). */
function lembretePublicacaoHtml(){
  const m=me(); if(!m||new Date().getDate()<25) return '';
  const meus=gereEscalas()?SETORES.map(x=>x.id):(m.role==='coordenador'&&m.setor?[m.setor]:[]);
  const prox=proximoMesISO();
  const pend=meus.filter(st=>state.events.some(e=>e.date.slice(0,7)===prox&&e.slots.some(s=>s.setor===st&&!s.publicada)));
  if(!pend.length) return '';
  return '<div class="lembrete-pub"><div><b>Falta publicar a escala de '+esc(nomeMes(prox))+'</b><span>'+pend.map(st=>esc(SETOR_NAME[st])).join(', ')+'. Se ninguém publicar, ela é publicada sozinha no dia 1º, do jeito que estiver.</span></div>'+
    pend.map(st=>'<button class="btn small gold" data-action="irPublicar" data-setor="'+st+'">'+(pend.length>1?esc(SETOR_NAME[st]):'Revisar e publicar')+'</button>').join('')+'</div>';
}
function dbadgeHtml(iso){const d=parse(iso);return '<div class="dbadge"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div>';}
function minhasEscalas(){
  const h=hojeISO();
  return state.events.filter(e=>e.date>=h).flatMap(e=>e.slots.filter(s=>s.who===state.me).map(s=>({e:e,s:s})))
    .sort((a,b)=>(a.e.date+a.e.time).localeCompare(b.e.date+b.e.time));
}
function eventosComVagaNoSetor(){
  const h=hojeISO();
  const coord=coordenaEscala(currentSetor);
  return state.events.filter(e=>e.date>=h&&(coord||!mesFechado(e.date))&&e.slots.some(s=>doSetorAtual(s)&&!s.who&&!s.oculto))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

    '</div></section>';
  }else if(aniv.some(x=>x.id===m.id)&&podeGerarPostAniversario()){
    html+='<div class="aniv-acoes" style="margin:-8px 0 16px"><button class="btn small gold" data-action="postAniversario" data-id="'+m.id+'">Gerar o meu post de parabéns</button></div>';

      '<button class="btn small primary" data-action="salvarAniversarioPainel">Salvar</button></section>';

/* ---------- Post de aniversário (canvas 1080x1350, formato de feed/WhatsApp) ---------- */
function carregarImagem(src){ return new Promise((ok,erro)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=erro; i.src=src;}); }
async function fotoDoMembroBlobUrl(m){
  if(!m.foto) return null;
  const k=m.id+':'+m.foto; if(FOTO_URL[k]) return FOTO_URL[k];
  try{ const r=await fetch(API_BASE+'/usuarios/'+m.id+'/foto?v='+encodeURIComponent(m.foto),{headers:{Authorization:'Bearer '+authToken}}); if(!r.ok) return null;
    FOTO_URL[k]=URL.createObjectURL(await r.blob()); return FOTO_URL[k]; }catch(_){ return null; }
}
function estrela(ctx,cx,cy,r){
  const p=[[20,6],[23.4,16.6],[34,20],[23.4,23.4],[20,34],[16.6,23.4],[6,20],[16.6,16.6]];
  ctx.beginPath(); p.forEach((q,i)=>{const x=cx+(q[0]-20)*r/14,y=cy+(q[1]-20)*r/14; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.closePath(); ctx.fill();
}
/* Mesmo modelo do post que a Pascom já usa nos grupos: fundo claro, "FELIZ" dourado com brilho,
   "Aniversário"/"Parabéns!" em letra cursiva, foto em polaroide, data e nome em etiquetas marrons,
   balões de coração e a frase de bênção. Só muda a foto, o nome e a data. */
const MESES_ABREV=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MARROM='#8B6A3A';
function coracao(ctx,cx,cy,t){
  ctx.beginPath(); ctx.moveTo(cx,cy+t*0.35);
  ctx.bezierCurveTo(cx-t*0.05,cy+t*0.30,cx-t*0.62,cy+t*0.02,cx-t*0.55,cy-t*0.28);
  ctx.bezierCurveTo(cx-t*0.48,cy-t*0.60,cx-t*0.08,cy-t*0.62,cx,cy-t*0.30);
  ctx.bezierCurveTo(cx+t*0.08,cy-t*0.62,cx+t*0.48,cy-t*0.60,cx+t*0.55,cy-t*0.28);
  ctx.bezierCurveTo(cx+t*0.62,cy+t*0.02,cx+t*0.05,cy+t*0.30,cx,cy+t*0.35); ctx.closePath();
}
function balao(ctx,cx,cy,t,ang,c1,c2,fio){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
  if(fio){ ctx.strokeStyle='rgba(176,140,70,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,t*0.35); ctx.bezierCurveTo(t*0.15,t*0.8,-t*0.15,t*1.1,t*0.05,t*1.6); ctx.stroke(); }
  const g=ctx.createRadialGradient(-t*0.2,-t*0.25,t*0.05,0,0,t*0.75); g.addColorStop(0,'#FFFDF5'); g.addColorStop(0.35,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.shadowColor='rgba(120,90,40,.25)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10; coracao(ctx,0,0,t); ctx.fill();
  ctx.restore();
}
function texturaDourada(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,'#7A5A22'); g.addColorStop(0.35,'#B98E3E'); g.addColorStop(0.6,'#8C6A2C'); g.addColorStop(1,'#C9A04F');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  // brilho: pontinhos claros e escuros, determinísticos (o post sai sempre igual)
  let semente=7; const rnd=()=>{semente=(semente*16807)%2147483647; return semente/2147483647;};
  for(let i=0;i<w*h/22;i++){ const px=rnd()*w, py=rnd()*h, r=rnd()*1.8+0.4, claro=rnd()>0.5;
    x.fillStyle=claro?'rgba(255,236,170,'+(0.35+rnd()*0.5)+')':'rgba(60,40,10,'+(0.2+rnd()*0.4)+')'; x.fillRect(px,py,r,r); }
  return c;
}
function etiqueta(ctx,texto,x,y,tamanho){
  ctx.font=tamanho+'px Anton, Impact, sans-serif'; const w=ctx.measureText(texto).width+tamanho*0.9, h=tamanho*1.45;
  ctx.fillStyle=MARROM; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#FFFFFF'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(texto,x+tamanho*0.45,y+h/2+tamanho*0.04); ctx.textBaseline='alphabetic';
  return w;
}
function cursiva(ctx,texto,cx,cy,tamanho,ang){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang); ctx.textAlign='center';
  ctx.font=tamanho+'px "Great Vibes", "Brush Script MT", cursive';
  ctx.lineJoin='round'; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=tamanho*0.16; ctx.strokeText(texto,0,0);
  ctx.fillStyle=MARROM; ctx.fillText(texto,0,0); ctx.restore();
}
async function desenharPostAniversario(canvas,m){
  const W=1080,H=1350, ctx=canvas.getContext('2d'); canvas.width=W; canvas.height=H;
  try{ await Promise.all(['260px Anton','150px "Great Vibes"','700 40px "Open Sans"','600 24px "Open Sans"'].map(f=>document.fonts.load(f))); }catch(_){}
  // fundo claro e suave
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#F7F3EC'); g.addColorStop(1,'#ECE5D9'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  [[200,250,320],[900,600,380],[300,1150,300],[750,1250,260]].forEach(b=>{const r=ctx.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]); r.addColorStop(0,'rgba(255,255,255,.85)'); r.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);});
  // balões creme no canto de cima
  balao(ctx,660,250,300,-0.25,'#F2E6C6','#CDB98B',true);
  balao(ctx,960,370,300,0.3,'#F4E9CC','#D3BF92',true);
  balao(ctx,860,140,320,0.12,'#F6ECD2','#D6C397',true);
  // "FELIZ" x4 dourado com brilho
  const fel=document.createElement('canvas'); fel.width=W; fel.height=H; const f=fel.getContext('2d');
  f.font='262px Anton, Impact, sans-serif'; f.textBaseline='alphabetic'; f.fillStyle='#000';
  // Anton é mais condensada que a letra do modelo: alarga na horizontal pra ocupar o mesmo espaço.
  f.save(); f.scale(1.34,1); [385,580,775,970].forEach(y=>f.fillText('FELIZ',48/1.34,y)); f.restore();
  f.globalCompositeOperation='source-in'; f.drawImage(texturaDourada(W,H),0,0);
  ctx.drawImage(fel,0,0);
  // data
  const d=m.anivDia&&m.anivMes?String(m.anivDia).padStart(2,'0')+'.'+MESES_ABREV[m.anivMes-1]:'';
  if(d) etiqueta(ctx,d,700,185,58);
  // polaroide com a foto
  ctx.save(); ctx.translate(838,760); ctx.rotate(0.065);
  ctx.shadowColor='rgba(80,60,30,.28)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12; ctx.fillStyle='#FFFFFF'; ctx.fillRect(-235,-265,470,530);
  ctx.shadowColor='transparent'; ctx.fillStyle='#EDEDED'; ctx.fillRect(-205,-235,410,430);
  const r=200; ctx.save(); ctx.beginPath(); ctx.arc(0,-20,r,0,Math.PI*2); ctx.clip();
  const url=await fotoDoMembroBlobUrl(m);
  if(url){ const img=await carregarImagem(url); const lado=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-lado)/2,(img.height-lado)/2,lado,lado,-r,-20-r,2*r,2*r); }
  else{ ctx.fillStyle='hsl('+m.h+' 40% 55%)'; ctx.fillRect(-r,-20-r,2*r,2*r); ctx.fillStyle='#fff'; ctx.font='160px Anton, Impact, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(iniciais(m.nome),0,-12); ctx.textBaseline='alphabetic'; }
  ctx.restore(); ctx.restore();
  // "Aniversário" por cima do FELIZ
  cursiva(ctx,'Aniversário',530,440,168,-0.17);
  // balão dourado embaixo, à esquerda
  balao(ctx,165,820,250,-0.1,'#F1D27A','#A87E26',true);
  // "Parabéns!" por cima da polaroide
  cursiva(ctx,'Parabéns!',705,965,150,-0.13);
  // nome
  const nome=m.nome.split(' ')[0].toUpperCase();
  ctx.font='56px Anton, Impact, sans-serif'; const wn=ctx.measureText(nome).width+50;
  etiqueta(ctx,nome,Math.max(60,540-wn/2-60),1010,56);
  // bênção e assinatura
  ctx.textAlign='center'; ctx.fillStyle='#6E6650'; ctx.font='700 40px "Open Sans", sans-serif';
  ctx.fillText('Deus abençoe seu novo ciclo e que Nossa Senhora',W/2,1158);
  ctx.fillText('te cubra com seu manto.',W/2,1210);
  ctx.font='600 24px "Open Sans", sans-serif'; ctx.fillStyle='#7C7464'; ctx.fillText('Família Pascom',W/2,1290);
}

function viewCalendario(){
  const y=cal.y,m=cal.m;
  const first=new Date(y,m,1), start=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const title=cap(first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const byDate={},evDate={};
  visibleCards().forEach(c=>{if(c.pub)(byDate[c.pub]=byDate[c.pub]||[]).push(c);});
  state.events.forEach(e=>{(evDate[e.date]=evDate[e.date]||[]).push(e);});
  let cells='',list='';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d=>{cells+='<div class="dow">'+d+'</div>';});
  for(let i=0;i<start;i++) cells+='<div class="cell out"></div>';
  for(let d=1;d<=dim;d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d), cs=byDate[s]||[], es=evDate[s]||[], ls=litLabels(s);
    const chips=cs.map(c=>'<button class="chip f-'+c.fmt+'" data-action="open" data-id="'+c.id+'" title="'+esc(c.title)+'">'+esc(c.title)+'</button>').join('');
    cells+='<div class="cell'+(s===TODAY?' today':'')+'" data-action="newOn" data-date="'+s+'"><div><span class="dn">'+d+'</span></div>'+ls.map(l=>'<div class="lit">'+esc(l)+'</div>').join('')+chips+es.map(e=>'<div class="evt">'+esc(e.title)+'</div>').join('')+'</div>';
    if(cs.length||es.length||ls.length){
      const wd=new Date(y,m,d).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
      list+='<div class="lrow"><div class="ld"><b>'+d+'</b><span>'+wd+'</span></div><div class="lc">'+ls.map(l=>'<span class="lit">'+esc(l)+'</span>').join('')+cs.map(c=>'<button class="chip f-'+c.fmt+'" style="width:auto;max-width:100%" data-action="open" data-id="'+c.id+'">'+esc(c.title)+'</button>').join('')+es.map(e=>'<span class="evt">'+esc(e.title)+' às '+e.time+'</span>').join('')+'<button class="btn small" data-action="newOn" data-date="'+s+'">Planejar neste dia</button></div></div>';
    }
  }
  const tail=(7-(start+dim)%7)%7;
  for(let i=0;i<tail;i++) cells+='<div class="cell out"></div>';
  return '<div class="cal-bar"><button class="btn small" data-action="calPrev" aria-label="Mês anterior">◀</button><h2>'+title+'</h2><button class="btn small" data-action="calNext" aria-label="Próximo mês">▶</button><button class="btn small" data-action="calToday">Hoje</button>'+
    '<div class="legend"><span><i style="background:var(--f-reels)"></i>Reels</span><span><i style="background:var(--f-carrossel)"></i>Carrossel</span><span><i style="background:var(--f-stories)"></i>Stories</span><span><i style="background:var(--f-foto)"></i>Foto</span><span><i style="background:var(--gold)"></i>Cobertura</span></div></div>'+
    '<div class="cal-wrap"><div class="cal">'+cells+'</div></div>'+
    '<div class="cal-list">'+(list||'<div class="empty">Nada neste mês.</div>')+'</div>'+
    '<p class="note">Clique em um dia para planejar um conteúdo nessa data. Datas litúrgicas são exemplos e podem ser ajustadas à programação do santuário.</p>';
}

let partic={meses:3, ordem:'menos', chave:null, dados:null, carregando:false, erro:null};
const PARTIC_PERIODOS=[[1,'Último mês'],[3,'3 meses'],[6,'6 meses'],[0,'Desde o começo']];
async function carregarParticipacao(forcar){
  const k=currentSetor+'|'+partic.meses;
  if(!forcar&&(partic.chave===k&&(partic.dados||partic.carregando))) return;
  partic.chave=k; partic.carregando=true; partic.erro=null;
  try{ const d=await api('/escalas/participacao?setor='+currentSetor.toUpperCase()+'&meses='+partic.meses); if(partic.chave===k) partic.dados=d; }
  catch(e){ if(partic.chave===k){ partic.dados=null; partic.erro=e.message; } }
  finally{ if(partic.chave===k){ partic.carregando=false; if(view==='escalas') render(); } }
}

function vezesServidas(id){

        d.itens.filter(i=>!i.usuarioId).map(i=>{const x=parse(i.data);return x.getDate()+'/'+String(x.getMonth()+1).padStart(2,'0')+(i.horario?' '+i.horario.slice(0,5).replace(':00','h').replace(':','h'):'')+' · '+esc(i.funcao);}).join(' &nbsp;•&nbsp; ')+

async function aplicarSugestao(btn){
  const marcados=[...document.querySelectorAll('#overlay input[data-sug]:checked')].map(x=>Number(x.dataset.sug));
  const itens=sugestao.dados.itens.filter(i=>i.usuarioId&&marcados.indexOf(i.slotId)>-1).map(i=>({eventoId:i.eventoId,slotId:i.slotId,usuarioId:i.usuarioId}));
  if(!itens.length){ toast('Nada marcado.','warn'); return; }
  btn.disabled=true; btn.textContent='Escalando…';
  try{
    const r=await api('/escalas/sugestao/aplicar?setor='+sugestao.setor.toUpperCase(),{method:'POST',body:JSON.stringify({itens:itens})});
    closeModal(); partic.chave=null; await recarregarEventos(); render();
    toast(r.escalados+(r.escalados===1?' pessoa escalada.':' pessoas escaladas.')+(r.problemas.length?' '+r.problemas.length+' não deram certo: '+r.problemas[0]:' Confira e publique quando estiver pronta.'),r.problemas.length?'warn':undefined);
  }catch(e){ btn.disabled=false; btn.textContent='Escalar os marcados'; toast(e.message,'warn'); }
}
function viewParticipacao(){
  if(!coordenaEscala(currentSetor)){ escalaAba='setor'; return viewEscalas(); }
  if(partic.chave!==currentSetor+'|'+partic.meses) setTimeout(()=>carregarParticipacao(),0);
  const chips=(lista,atual,acao,campo)=>'<div class="dash-tabs chips-esc">'+lista.map(x=>'<button type="button" class="dash-tab'+(atual===x[0]?' active':'')+'" data-action="'+acao+'" data-'+campo+'="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  const filtros=chips(PARTIC_PERIODOS,partic.meses,'particPeriodo','meses')+
    chips([['menos','Quem menos serviu'],['mais','Quem mais serviu'],['tempo','Há mais tempo sem servir']],partic.ordem,'particOrdem','ordem');
  const d=partic.dados&&partic.chave===currentSetor+'|'+partic.meses?partic.dados:null;
  if(!d) return escalaTabsHtml()+filtros+'<div class="empty">'+(partic.erro?esc(partic.erro):'Carregando…')+'</div>';
  const alerta=d.diasAlerta, ps=d.pessoas.slice();
  if(partic.ordem==='mais') ps.sort((a,b)=>b.serviu-a.serviu||a.nome.localeCompare(b.nome));
  else if(partic.ordem==='tempo') ps.sort((a,b)=>(b.diasSemServir==null?1e9:b.diasSemServir)-(a.diasSemServir==null?1e9:a.diasSemServir)||a.nome.localeCompare(b.nome));
  const max=Math.max(1,...ps.map(p=>p.serviu));
  const nunca=ps.filter(p=>!p.ultimaVez).length, parados=ps.filter(p=>p.diasSemServir!=null&&p.diasSemServir>alerta).length;
  const fmtD=iso=>{const x=parse(iso);return x.getDate()+'/'+String(x.getMonth()+1).padStart(2,'0');};
  const resumo='<div class="strip"><div><b>'+d.totalServicos+'</b><span>vezes que alguém serviu</span></div><div><b>'+String(d.media).replace('.',',')+'</b><span>média por pessoa</span></div>'+
    '<div class="'+(nunca?'alert':'')+'"><b>'+nunca+'</b><span>ainda não serviram</span></div><div class="'+(parados?'alert':'')+'"><b>'+parados+'</b><span>há mais de '+alerta+' dias sem servir</span></div></div>';
  const linhas=ps.map(p=>{
    const sub=p.ultimaVez?'Última vez em '+fmtD(p.ultimaVez)+' ('+(p.diasSemServir===0?'hoje':'há '+p.diasSemServir+(p.diasSemServir===1?' dia':' dias'))+')':'Ainda não serviu em '+esc(SETOR_NAME[currentSetor]);
    const tags=(!p.ultimaVez?'<span class="pill warn">Nunca serviu</span>':p.diasSemServir>alerta?'<span class="pill warn">Há muito tempo sem servir</span>':'')+

      (p.candidaturas?'<span class="pill">'+p.candidaturas+(p.candidaturas>1?' candidaturas':' candidatura')+'</span>':'');
    return '<div class="part-row">'+avatar(String(p.id))+'<div><div class="part-nome">'+esc(p.nome)+'</div><div class="part-sub">'+sub+'</div>'+
      '<div class="bar"><i style="width:'+Math.round(p.serviu*100/max)+'%"></i></div>'+(tags?'<div class="part-tags">'+tags+'</div>':'')+'</div>'+
      '<div class="part-num"><b>'+p.serviu+'</b><small>'+(p.serviu===1?'vez':'vezes')+'</small></div></div>';
  }).join('');
  return escalaTabsHtml()+filtros+resumo+
    '<section class="panel"><h2>'+esc(SETOR_NAME[currentSetor])+' · '+esc(nomePeriodoPartic())+'</h2>'+

      '<p class="note">Conta as funções de '+esc(SETOR_NAME[currentSetor])+' em que a pessoa estava escalada, em celebrações que já aconteceram. "Próxima" é o que já está marcado; "candidaturas" são os "Quero servir" ainda abertos. O sistema começou em outubro de 2026, então antes disso não há histórico.</p></section>';
}
function viewEscalas(){
  if(escalaAba==='completa') return escalaTabsHtml()+viewEscalaCompleta();
  if(escalaAba==='participacao') return viewParticipacao();
  const agora=new Date(), hoje=agora.getFullYear()+'-'+String(agora.getMonth()+1).padStart(2,'0')+'-'+String(agora.getDate()).padStart(2,'0');
  const podeCriar=isApprover()||gereEscalas();
  const podeEditarSetor=coordenaEscala(currentSetor);
  if(podeEditarSetor&&partic.chave!==currentSetor+'|'+partic.meses) setTimeout(()=>carregarParticipacao(),0);
  const doSetor=s=>s.setor===currentSetor||s.setor===null;
  const evs=state.events
    .filter(e=>e.date>=hoje)
    // Coordenação também vê eventos extras sem funções do setor (pra poder acrescentar as dela), mas

  // Filtro rápido: todas / só onde ainda falta gente / só onde eu estou.
  const comVaga=e=>(podeEditarSetor||!mesFechado(e.date))&&e.slots.some(s=>doSetor(s)&&!s.who), minha=e=>e.slots.some(s=>s.who===state.me||s.euCand);
  const n={todas:evs.length,vagas:evs.filter(comVaga).length,minhas:evs.filter(minha).length};
  const filtrados=escalaFiltro==='vagas'?evs.filter(comVaga):escalaFiltro==='minhas'?evs.filter(minha):evs;

    (gereEscalas()?'<button class="btn" data-action="gerarEscalasMes">Gerar missas do mês</button>':'')+'</div>':'';
  const como='<details class="como"><summary>Como funciona a escala</summary><p>Todo mês a escala começa nova: as missas de domingo (e, pro Datashow, as das 8h, 18h30 e a de sábado às 16h30; pro Holyrics, a montagem de cada fim de semana) entram sozinhas, já com as funções de cada setor. '+
    (podeEditarSetor
      ?'Enquanto a escala do mês está <b>em montagem</b>, só a coordenação vê quem foi escalado: veja os candidatos de cada função, toque em <b>Escalar</b> ou <b>Trocar</b> e, quando estiver pronta, <b>publique</b>. Você também pode renomear, remover ou adicionar funções de '+esc(SETOR_NAME[currentSetor])+'.'
      :'Toque em <b>Quero servir</b> nas funções em que você pode servir. A coordenação escolhe quem fica em cada uma e, quando a escala for <b>publicada</b>, ela aparece aqui pra todo mundo. Quando o mês chega, a escala dele <b>fecha</b>: se precisar sair, fale com a coordenação do seu setor.')+
    (podeCriar?' Se tiver outro evento que precise de gente, marque como evento extra.':'')+'</p></details>';
  const naoFaz=me()&&!pertenceSetor(me(),currentSetor)&&!gereEscalas()?'<div class="aviso-equipe"><span>Você ainda não faz parte de <b>'+esc(SETOR_NAME[currentSetor])+'</b>, então não pode se inscrever nas vagas daqui. Se você também serve neste setor, adicione ele no seu perfil.</span><button class="btn small primary" data-action="abrirPerfil">Ir pro meu perfil</button></div>':'';
  // Status de cada mês da lista (em montagem / publicada) pro setor atual.
  const meses={};
  evs.forEach(e=>e.slots.filter(s=>s.setor===currentSetor).forEach(s=>{const m=e.date.slice(0,7); if(!(m in meses)) meses[m]=s.publicada;}));
  const mesesKeys=Object.keys(meses).sort();

    ?'<div class="pub-bar">'+mesesKeys.map(m=>{const fech=mesFechado(m+'-01');
        return '<div class="pub-row"><span><b>'+esc(nomeMes(m))+'</b> <span class="pill '+(fech?'':meses[m]?'ok':'warn')+'">'+(fech?'Fechada':meses[m]?'Publicada':'Em montagem')+'</span></span>'+
        '<span class="pub-acts"><button class="btn small" data-action="sugerirEscala" data-mes="'+m+'" data-publicada="'+(meses[m]?1:0)+'">Sugerir escala</button>'+
        (fech?'<span class="note" style="margin:0">Só a coordenação mexe</span>':meses[m]?'<button class="btn small" data-action="despublicarMes" data-mes="'+m+'">Voltar pra montagem</button>':'<button class="btn small primary" data-action="publicarMes" data-mes="'+m+'">Publicar escala</button>')+'</span></div>';}).join('')+
      '<p class="note" style="margin:6px 0 0">Em montagem, só a coordenação vê os nomes. Publicou, a equipe vê a escala final. Quando o mês chega, a escala dele fecha (e, se não tiver sido publicada, é publicada sozinha no dia 1º).</p></div>'
    :(mesesKeys.some(m=>!meses[m])?'<div class="aviso-montagem">A escala de <b>'+mesesKeys.filter(m=>!meses[m]).map(nomeMes).join(' e ')+'</b> está em montagem. Toque em <b>Quero servir</b> nas funções em que você pode; a coordenação escolhe e publica.</div>':'');
  const acoes=(podeEditarSetor?lembretePublicacaoHtml():'')+naoFaz+chips+coord+statusMeses+como;
  const rodape=(podeEditarSetor?historicoHtml():'')+pdfBarHtml(currentSetor);
  const vazio=escalaFiltro==='minhas'?'Você ainda não está em nenhuma escala de '+esc(SETOR_NAME[currentSetor])+'.':escalaFiltro==='vagas'?'Vagas ocupadas, tente servir outro dia. Se alguém sair da escala, a vaga volta a aparecer aqui.':'Nenhuma escala aberta pra '+esc(SETOR_NAME[currentSetor])+' por enquanto.';
  if(!filtrados.length) return escalaTabsHtml()+acoes+'<div class="empty">'+vazio+'</div>'+rodape;
  return escalaTabsHtml()+acoes+'<div class="evs">'+filtrados.map(e=>{
    const slots=e.slots.filter(doSetor);
    const open=slots.filter(s=>!s.who&&!s.oculto).length, d=parse(e.date);
    const montagem=slots.length&&slots.every(s=>s.oculto);
    const joined=e.slots.some(s=>s.who===state.me);
    const cheio=slots.length&&!montagem&&!open&&!joined&&!podeEditarSetor&&!slots.some(s=>s.euCand);
    const pillEv=!slots.length?'':montagem?'<span class="pill">Em montagem</span>':'<span class="pill '+(open?'warn':'ok')+'">'+(open?open+(open>1?' vagas':' vaga'):'Completa')+'</span>';
    return '<article class="ev'+(e.big?' big':'')+'"><div class="ev-h"><div class="dbadge"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div><div style="flex:1;min-width:120px"><h3>'+esc(e.title)+'</h3><small>'+cap(d.toLocaleDateString('pt-BR',{weekday:'long'}))+', '+e.time+' no '+esc(e.place)+'</small></div><div class="ev-h-actions">'+pillEv+

        let act='', extra='';
        const podeEntrar=!s.setor||pertenceSetor(me(),s.setor);
        const key=e.id+':'+s.id, editavel=podeEditarFuncao(s);
        const ds=' data-ev="'+e.id+'" data-slot="'+s.id+'"';
        const fechado=mesFechado(e.date);
        const candBtn=()=>!podeEntrar?'<span class="so-setor">Só pra '+esc(SETOR_NAME[s.setor])+'</span>'
          :s.euCand?'<button class="btn small cand-ok" data-action="desistir"'+ds+' title="Toque pra desistir">✓ Me candidatei</button>'
          :'<button class="btn small primary" data-action="candidatar"'+ds+'>Quero servir</button>';

        }else if(!s.setor){

          else if(podeTirarDaEscala(s.who)) act='<button class="btn small" data-action="leave"'+ds+'>'+(s.who===state.me?'Sair':'Tirar da escala')+'</button>';
        }else if(editavel){
          // Coordenação: escala, troca ou tira; vê quem se candidatou.
          act=s.who?'<button class="btn small" data-action="abrirEscalar"'+ds+'>Trocar</button><button class="btn small" data-action="leave"'+ds+'>Tirar</button>'
                   :'<button class="btn small primary" data-action="abrirEscalar"'+ds+'>Escalar</button>';
          const cands=(s.candidatos||[]).filter(id=>id!==s.who);
          if(cands.length) extra+='<div class="cands"><span class="cands-k">Candidatos:</span>'+cands.map(id=>{const m=mem(id);return m?'<button type="button" class="cand" data-action="escalarCand" data-usuario="'+id+'"'+ds+' title="Escalar '+esc(m.nome)+'">'+avatar(id)+'<span>'+esc(m.nome.split(' ').slice(0,2).join(' '))+'</span><b>Escalar</b></button>':'';}).join('')+'</div>';
          if(escalarKey===key){
            const candSet=s.candidatos||[];
            const ops=membrosDoSetor(s.setor).filter(m=>m.id!==s.who).sort((a,b)=>(candSet.indexOf(b.id)>-1)-(candSet.indexOf(a.id)>-1));
            const vezes=id=>{const n=vezesServidas(id);return n==null?'':' · serviu '+n+'×';};
            extra+='<div class="escalar-form"><select id="escalar-sel" aria-label="Quem vai servir">'+ops.map(m=>'<option value="'+m.id+'">'+(candSet.indexOf(m.id)>-1?'★ ':'')+esc(m.nome)+vezes(m.id)+'</option>').join('')+'</select>'+
              '<button class="btn small primary" data-action="confirmarEscalar"'+ds+'>Escalar</button><button class="btn small" data-action="fecharEscalar">Cancelar</button></div>';
          }
        }else if(s.oculto){
          // Voluntário com a escala em montagem: não vê nomes, só se candidata.
          act=candBtn();
        }else{
          // Escala publicada: vê quem está; ainda pode se candidatar a função livre.
          if(s.who===state.me) act='<button class="btn small" data-action="leave"'+ds+'>Sair</button>';
          else if(!s.who) act=candBtn();
        }
        const whoMem=s.who?mem(s.who):null;
        if(editavel&&editSlotKey===key){
          return '<div class="slot slot-edit"><input id="es-rename" value="'+esc(s.label)+'" maxlength="80" aria-label="Novo nome da função">'+
            '<button class="btn small primary" data-action="salvarRenomeSlot" data-ev="'+e.id+'" data-slot="'+s.id+'">Salvar</button>'+
            '<button class="btn small" data-action="cancelarRenomeSlot">Cancelar</button></div>';
        }
        const ferramentas=editavel?'<span class="slot-tools">'+
          '<button type="button" class="icon-btn" data-action="renomearSlot" data-ev="'+e.id+'" data-slot="'+s.id+'" title="Renomear função" aria-label="Renomear '+esc(s.label)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg></button>'+
          '<button type="button" class="icon-btn" data-action="removerSlot" data-ev="'+e.id+'" data-slot="'+s.id+'" title="Remover função" aria-label="Remover '+esc(s.label)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>':'';
        const quem=whoMem?avatar(s.who)+esc(whoMem.nome):s.oculto?'<span class="muted">Em montagem</span>':'<span class="muted">Vaga aberta</span>';
        return '<div class="slot'+(extra?' slot-mais':'')+'"><span class="sl">'+esc(s.label)+ferramentas+'</span><span class="sw">'+quem+'</span><span class="slot-acts">'+act+'</span>'+extra+'</div>';
      }).join(''):'<div class="slot"><span class="muted">Nenhuma função de '+esc(SETOR_NAME[currentSetor])+' neste evento ainda.</span></div>')+
      (podeEditarSetor?'<div style="padding:0 16px 12px"><button type="button" class="btn small" style="margin-top:8px" data-action="toggleAddSlot" data-ev="'+e.id+'">'+(addSlotEventoId===e.id?'Cancelar':'+ função de '+esc(SETOR_NAME[currentSetor]))+'</button></div>'+addSlotFormHtml(e.id):'')+
    '</article>';
  }).join('')+'</div>'+rodape;
}

function viewEscalaCompleta(){
  const dados=escalaCompletaCache[escalaMes];
  if(!dados&&!escalaCompletaLoading) setTimeout(()=>carregarEscalaCompleta(escalaMes),0);
  const cab=pdfBarHtml(null);
  if(!dados) return cab+'<div class="empty">Carregando escala...</div>';
  if(dados.erro) return cab+'<div class="empty">'+esc(dados.erro)+'</div>';
  const doms=(dados.domingos||[]).map(x=>Number(x.slice(8,10)));
  const resumo='<p class="note" style="margin-bottom:14px">'+doms.length+' domingos neste mês ('+doms.join(', ')+'). Aqui aparece todo mundo que vai servir, de todos os setores.</p>';
  if(!dados.eventos.length) return cab+resumo+'<div class="empty">Nenhuma escala cadastrada neste mês ainda.</div>';
  return cab+resumo+'<div class="evs">'+dados.eventos.map(e=>{
    const d=parse(e.data);
    return '<article class="ev'+(e.eventoGrande?' big':'')+'"><div class="ev-h"><div class="dbadge"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div><div style="flex:1;min-width:120px"><h3>'+esc(e.titulo)+'</h3><small>'+cap(d.toLocaleDateString('pt-BR',{weekday:'long'}))+', '+(e.horario||'').slice(0,5)+' no '+esc(e.local)+'</small></div><div class="ev-h-actions"><span class="pill '+(e.vagasAbertas?'warn':'ok')+'">'+(e.vagasAbertas?e.vagasAbertas+(e.vagasAbertas>1?' vagas':' vaga'):'Completa')+'</span></div></div>'+
      e.setores.map(g=>'<div class="slot-grp">'+esc(g.nomeSetor)+'</div>'+g.funcoes.map(f=>{
        const quem=f.voluntarioId!=null?String(f.voluntarioId):null;
        return '<div class="slot"><span class="sl">'+esc(f.rotulo)+'</span><span class="sw">'+(f.voluntarioNome?(mem(quem)?avatar(quem):'')+esc(f.voluntarioNome):'<span class="muted">'+(f.oculto?'Em montagem':'Vaga aberta')+'</span>')+'</span></div>';
      }).join('')).join('')+
    '</article>';
  }).join('')+'</div>';
}
async function carregarEscalaCompleta(mes){
  if(escalaCompletaLoading) return;
  escalaCompletaLoading=true;
  try{ escalaCompletaCache[mes]=await api('/escalas/completa?mes='+mes); }
  catch(e){ escalaCompletaCache[mes]={erro:e.message}; }
  escalaCompletaLoading=false;
  if(view==='escalas'&&escalaAba==='completa') render();
}
async function baixarEscalaPdf(setor){
  try{
    const headers={}; if(authToken) headers['Authorization']='Bearer '+authToken;
    const res=await fetch(API_BASE+'/escalas/completa/pdf?mes='+escalaMes+(setor?'&setor='+setor.toUpperCase():''),{headers:headers});
    if(!res.ok){ let msg='Não foi possível gerar o PDF.'; try{ const b=await res.json(); if(b&&b.erro) msg=b.erro; }catch(_){ } throw new Error(msg); }
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='escala-'+(setor?setor.replace(/_/g,'-'):'completa')+'-'+escalaMes+'.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ toast(e.message,'warn'); }
}

    ?[{rotulo:'Foto',tipo:'FOTO'},{rotulo:'Vídeo',tipo:'VIDEO'},{rotulo:'Stories ao vivo',tipo:'STORIES_AO_VIVO'}]
    :currentSetor==='transmissoes_videos'?[{rotulo:'Câmera 1',tipo:null},{rotulo:'Câmera 2',tipo:null},{rotulo:'Câmera 3',tipo:null},{rotulo:'Corte da transmissão',tipo:'TRANSMISSAO'},{rotulo:'Auxiliar de corte',tipo:null}]

function reabrirEscalaModal(){ $('#overlay').innerHTML=escalaModal(); }
async function salvarEscala(){
  sincronizarSlotFormDoDOM();
  const titulo=$('#es-titulo').value.trim();
  const data=$('#es-data').value;
  const horario=$('#es-horario').value;
  const local=$('#es-local').value.trim();
  const grande=$('#es-grande').checked;
  if(!titulo||!data||!horario||!local){toast('Preencha título, data, horário e local.','warn');return;}
  const slots=escalaFormSlots.filter(s=>s.rotulo.trim());
  try{
    const dto=await api('/eventos',{method:'POST',body:JSON.stringify({
      titulo:titulo,data:data,horario:horario,local:local,eventoGrande:grande,
      slots:slots.map(s=>({rotulo:s.rotulo.trim(),tipo:s.tipo||null,setor:currentSetor.toUpperCase()}))
    })});
    state.events.push(eventoFromApi(dto));
    invalidarEscalaCompleta();
    closeModal(); render(); toast('Evento criado na escala!');
  }catch(e){ toast(e.message,'warn'); }
}
async function gerarEscalasMes(){
  try{
    const r=await api('/eventos/gerar-escalas-mes',{method:'POST'});
    toast(r.eventosCriados>0?r.eventosCriados+(r.eventosCriados>1?' missas criadas na escala!':' missa criada na escala!'):'Já estava tudo criado esse mês.');
    const eventos=await api('/eventos');
    state.events=eventos.map(eventoFromApi);
    invalidarEscalaCompleta();
    render();
  }catch(e){ toast(e.message,'warn'); }
}
async function salvarRenomeSlot(eventoId,slotId){
  const rotulo=($('#es-rename')||{value:''}).value.trim();
  if(!rotulo){toast('Dê um nome pra função.','warn');return;}
  try{
    const dto=await api('/eventos/'+eventoId+'/slots/'+slotId,{method:'PATCH',body:JSON.stringify({rotulo:rotulo})});
    Object.assign(state.events.find(x=>x.id===eventoId),eventoFromApi(dto));
    invalidarEscalaCompleta(); editSlotKey=null; render(); toast('Função renomeada.');
  }catch(e){ toast(e.message,'warn'); }
}
async function removerSlot(eventoId,slotId){
  const ev=state.events.find(x=>x.id===eventoId), sl=ev&&ev.slots.find(x=>x.id===slotId);
  if(!sl) return;
  const quem=sl.who&&mem(sl.who)?' '+mem(sl.who).nome+' está escalado(a) nela e vai sair da escala.':'';
  if(!confirm('Remover a função "'+sl.label+'" desta missa?'+quem)) return;
  try{
    const dto=await api('/eventos/'+eventoId+'/slots/'+slotId,{method:'DELETE'});
    Object.assign(ev,eventoFromApi(dto));

   login) e os avisos valem pro fim de semana. */
let holy={lista:null,sel:null,det:null,carregando:false,missa:null,erro:null};
const podeMontagem=()=>{const m=me();return !!m&&(pertenceSetor(m,'holyrics')||coordenaEscala('holyrics'));};
async function carregarHolyrics(sabado){
