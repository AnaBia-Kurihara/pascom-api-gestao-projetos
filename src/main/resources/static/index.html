<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pascom Fátima – Organização da equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4FA; --panel:#FFFFFF; --tint:#E8EDF7; --ink:#14203D; --ink2:#465273; --ink3:#77829F; --line:#DBE2F0;
  --brand:#2B57B8; --brand-ink:#FFFFFF; --deep:#14306B; --deep-ink:#EAF0FF;
  --gold:#C79A2E; --gold-soft:#F8EED2; --gold-ink:#6E500B;
  --rose:#B4404A; --rose-soft:#FAE3E5; --green:#2C7A57; --green-soft:#DCF0E5;
  --f-reels:#7A4BC4; --f-carrossel:#2B57B8; --f-stories:#B85F30; --f-foto:#2C7A57;
  --side:#0F2456; --side-ink:#C9D5F2;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --panel:#161E36; --tint:#1D2745; --ink:#EBF0FF; --ink2:#B3BDDA; --ink3:#8792B2; --line:#28335A;
    --brand:#7FA4F2; --brand-ink:#0E1424; --deep:#1A2C5E; --deep-ink:#EAF0FF;
    --gold:#E2BA5C; --gold-soft:#3A311A; --gold-ink:#F0D48A;
    --rose:#F08C94; --rose-soft:#442228; --green:#6FCBA0; --green-soft:#1C3A2E;
    --f-reels:#B394F0; --f-carrossel:#7FA4F2; --f-stories:#F0A070; --f-foto:#6FCBA0;
    --side:#0A1020; --side-ink:#AEBBDD;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#161E36; --tint:#1D2745; --ink:#EBF0FF; --ink2:#B3BDDA; --ink3:#8792B2; --line:#28335A;
  --brand:#7FA4F2; --brand-ink:#0E1424; --deep:#1A2C5E; --deep-ink:#EAF0FF;
  --gold:#E2BA5C; --gold-soft:#3A311A; --gold-ink:#F0D48A;
  --rose:#F08C94; --rose-soft:#442228; --green:#6FCBA0; --green-soft:#1C3A2E;
  --f-reels:#B394F0; --f-carrossel:#7FA4F2; --f-stories:#F0A070; --f-foto:#6FCBA0;
  --side:#0A1020; --side-ink:#AEBBDD;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
p{margin:0}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.app[hidden]{display:none}
#authScreen{height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:20px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;color:#fff;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--side-ink);opacity:.85;line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--side-ink);text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.setor-switch{position:relative;margin:2px 0 16px}
.setor-btn{width:100%;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:9px 10px;color:#fff;text-align:left}
.setor-btn:hover{background:rgba(255,255,255,.1)}
.setor-btn .ico{width:30px;height:30px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none;color:#1B1400}
.setor-btn .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setor-btn .tx{flex:1;min-width:0}
.setor-btn .tx small{display:block;font-size:10.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em}
.setor-btn .tx b{display:block;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setor-btn .chev{width:14px;height:14px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2;flex:none;transition:transform .15s}
.setor-btn.open .chev{transform:rotate(180deg)}
.setor-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 16px 36px rgba(0,0,0,.35);padding:6px;z-index:30}
.setor-menu button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:8px 9px;border-radius:8px;background:none;border:0;color:var(--ink);font-size:13px}
.setor-menu button:hover{background:var(--tint)}
.setor-menu button.active{background:var(--tint);font-weight:600}
.setor-menu .ico{width:24px;height:24px;border-radius:7px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.setor-menu .ico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setor-menu .check{margin-left:auto;width:14px;height:14px;stroke:var(--brand);fill:none;stroke-width:2.4;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;font-size:12px;line-height:1.4;color:var(--side-ink)}
.side-foot button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.main{overflow-y:auto;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 32px 8px}
.top h1{font-size:28px}
.top p{color:var(--ink2);margin-top:4px;max-width:60ch}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.who select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.view{padding:16px 32px 40px}

/* ---------- Botões e pequenos elementos ---------- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:#1B1400;border-color:transparent;font-weight:600}
.btn.light{background:transparent;color:var(--deep-ink);border-color:rgba(255,255,255,.35)}
.btn.danger{color:var(--rose);border-color:var(--rose-soft);background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.lg{width:44px;height:44px;font-size:15px}
.av.xl{width:76px;height:76px;font-size:25px}
.av.xxl{width:120px;height:120px;font-size:38px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.has-foto{background:var(--tint)!important}
.av-empty{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.fmt{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.f-reels{--fc:var(--f-reels)} .f-carrossel{--fc:var(--f-carrossel)} .f-stories{--fc:var(--f-stories)} .f-foto{--fc:var(--f-foto)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--ink2);font-weight:500;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink)}
.pill.bad{background:var(--rose-soft);color:var(--rose)}
.muted{color:var(--ink3)}
.late{color:var(--rose);font-weight:600}
.empty{color:var(--ink3);padding:14px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;font-size:14px}

/* ---------- Painel ---------- */
.hero{background:var(--deep);color:var(--deep-ink);border-radius:16px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"13";position:absolute;right:18px;top:-38px;font-family:var(--serif);font-size:190px;line-height:1;color:rgba(255,255,255,.06);pointer-events:none}
.hero h2{font-size:26px;max-width:22ch}
.hero p{margin-top:8px;opacity:.85}
.hero-act{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.strip{display:flex;flex-wrap:wrap;margin:22px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{flex:1 1 130px;padding:14px 18px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.strip span{color:var(--ink2);font-size:13px}
.strip .alert b{color:var(--rose)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:24px}
.panel h2{font-size:18px;margin-bottom:10px}
.panel+.panel{margin-top:26px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover .rt{text-decoration:underline}
.row .rt{flex:1;min-width:0;font-weight:500}
.dbadge{width:46px;flex:none;text-align:center;line-height:1.1}
.dbadge b{display:block;font-family:var(--serif);font-weight:400;font-size:20px}
.dbadge span{font-size:12px;color:var(--ink3)}
.load{display:grid;grid-template-columns:110px 1fr 24px;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.hi{background:var(--rose)}
.note{font-size:13px;color:var(--ink3);margin-top:8px}

/* ---------- Quadro ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.filters input{min-width:220px}
.filters .tip{color:var(--ink3);font-size:13px;flex:1 1 260px}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.kcol{flex:0 0 262px;background:var(--tint);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.kcol-h h3{font-size:15px}
.kcol-h .cnt{font-size:12px;color:var(--ink2);margin-left:6px;font-family:var(--sans)}
.kcol-h button{border:0;background:none;color:var(--ink2);font-size:20px;line-height:1;border-radius:6px;width:28px;height:28px}
.kcol-h button:hover{background:var(--line)}
.kbody{display:flex;flex-direction:column;gap:8px;min-height:64px;border-radius:8px;transition:background .12s}
.kbody.over{background:color-mix(in srgb,var(--brand) 14%,transparent);outline:2px dashed var(--brand);outline-offset:-2px}
.kcard{background:var(--panel);border-radius:9px;padding:10px 11px;border-left:4px solid var(--fc);cursor:grab;box-shadow:0 1px 0 rgba(20,32,61,.08)}
.kcard.dragging{opacity:.45}
.kcard h4{font-family:var(--sans);font-weight:600;font-size:14px;line-height:1.35;margin:7px 0 8px}
.kc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kc-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.kc-meta .sp{flex:1}
.kc-mv{display:flex;gap:4px}
.kc-mv button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:24px;font-size:11px;color:var(--ink2);padding:0}
.kc-mv button:hover:not([disabled]){border-color:var(--ink3)}
.kc-mv button[disabled]{opacity:.3;cursor:default}

/* ---------- Calendário ---------- */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h2{font-size:22px;min-width:190px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-left:auto;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel);min-width:720px}
.cal .dow{padding:8px;font-size:13px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--tint)}
.cell{min-height:116px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:hover{background:var(--bg)}
.cell.out{background:var(--tint);opacity:.5;cursor:default}
.cell .dn{font-size:13px;font-weight:600;color:var(--ink2)}
.cell.today .dn{background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:1px 7px}
.lit{font-size:11px;line-height:1.25;color:var(--gold-ink);background:var(--gold-soft);border-radius:4px;padding:1px 5px}
.chip{display:block;width:100%;text-align:left;font-size:12px;line-height:1.3;padding:2px 6px;border-radius:4px;border:0;color:var(--fc);background:color-mix(in srgb,var(--fc) 15%,transparent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:color-mix(in srgb,var(--fc) 28%,transparent)}
.evt{font-size:11px;color:var(--ink2);padding:0 4px}
.evt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:5px}
.cal-list{display:none}
.lrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .ld{width:44px;text-align:center;flex:none;line-height:1.1}
.lrow .ld b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.lrow .ld span{font-size:12px;color:var(--ink3)}
.lrow .lc{flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}

/* ---------- Ideias, escalas, equipe, materiais ---------- */
.form-inline{display:grid;grid-template-columns:1.2fr 2fr 1fr auto;gap:10px;align-items:end;margin-bottom:20px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.fld[hidden]{display:none}
.fld input,.fld select,.fld textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px}
.fld textarea{resize:vertical}
.idea{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.idea-actions{display:flex;gap:6px;align-items:center}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 0;width:58px}
.vote b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1}
.vote span{font-size:11px;color:var(--ink3)}
.vote.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.idea h4{font-family:var(--sans);font-weight:600;font-size:16px}
.idea p{color:var(--ink2);font-size:14px;margin-top:2px}
.idea .by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.ev{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ev-h{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ev-h h3{font-size:17px}
.ev-h small{color:var(--ink2);display:block}
.ev-h-actions{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.ev.big .ev-h{background:var(--gold-soft)}
.slot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .sl{width:160px;flex:none;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.slot-tools{display:inline-flex;gap:2px;margin-left:auto;padding-right:6px}
.icon-btn{width:26px;height:26px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--ink3);padding:0}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slot-edit input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font-size:14px}
.slot .sw{flex:1;font-size:14px;display:flex;align-items:center;gap:8px}
.slot-grp{padding:8px 16px 4px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 26px}
.mem{display:flex;gap:14px}
.mem h3{font-size:17px}
.mem .fn{color:var(--ink2);font-size:14px}
.mem ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}
.mem h3 .pill{vertical-align:middle;font-size:11px}
.mem-link{display:inline-block;margin-top:8px;font-size:13px}
.so-setor{font-size:12px;color:var(--ink3);white-space:nowrap}
.eq-h{font-size:18px;margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
.eq-h:first-of-type{margin-top:6px}
.eq-h small{font-family:var(--sans);font-size:13px;color:var(--ink3);font-weight:500}
.aviso-equipe{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.aviso-equipe span{flex:1 1 260px}
.time-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.time-chips{flex-wrap:wrap;margin-bottom:0}
.chip-n{opacity:.7;font-size:12px;margin-left:2px}
.time-busca{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--ink);min-width:0;flex:1 1 200px;max-width:280px}
.time-sec{margin-top:24px}
.time-sec h2{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:12px}
.time-sec h2 small{font-family:var(--sans);font-size:13px;color:var(--ink3);font-weight:500}
.time-sec h2 .ico{width:30px;height:30px;border-radius:8px;background:var(--tint);display:grid;place-items:center;color:var(--brand);flex:none}
.time-sec h2 .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Modal e toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,14,32,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:50}

/* ---------- Dashboard ---------- */
.dash-tabs{display:flex;gap:6px;margin-bottom:14px}

/* ---------- Assistente (chat) ---------- */

.chat-acoes{display:flex;flex-direction:column;gap:5px}

.chat-acao svg{width:13px;height:13px;flex:none;stroke:#2a7d46;fill:none;stroke-width:3}
.chat-typing{display:inline-flex;gap:4px;padding:5px 3px}
.chat-typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);display:block;animation:chatDot 1.1s infinite ease-in-out}
.chat-typing i:nth-child(2){animation-delay:.15s}
.chat-typing i:nth-child(3){animation-delay:.3s}
@keyframes chatDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:auto}
.chat-inputwrap{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 18px;box-shadow:0 8px 28px rgba(20,32,61,.08)}
.chat-inputwrap textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:var(--ink);max-height:140px;padding:6px 0;line-height:1.4}
.chat-inputwrap textarea:focus{outline:none}
.chat-send{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:0;flex:none;display:flex;align-items:center;justify-content:center}
.chat-send:disabled{opacity:.4}
.chat-send svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.chat-hint{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:8px}

/* ---------- Autenticação ---------- */
.authwrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px}
.authbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 28px;box-shadow:0 10px 40px rgba(20,32,61,.08)}
.authbox h2{font-size:24px}
.link-btn{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font:inherit;text-decoration:underline}

/* ---------- Mobile ---------- */
.mbar{display:none}
.mbar-backdrop{display:none}
.tabbar{display:none}
.fgrid>*{min-width:0}
.fld input,.fld select,.fld textarea{width:100%;min-width:0}
.rt-sub{display:block;font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.hero-k{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-bottom:6px}
.hero-escala::after{content:none}
.hero-escala h2{max-width:none}
.pdf-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 0 16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pdf-bar-setor{margin:22px 0 0}
.pdf-k{font-weight:600;font-size:14px}
.mes-nav{display:flex;align-items:center;gap:6px}
.mes-nav b{min-width:136px;text-align:center;font-size:14.5px}
.pdf-acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pdf-acoes .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pdf-acoes svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chips-esc{flex-wrap:wrap}
/* Filtros (Todas / Com vaga / Minhas) mais discretos que as abas de cima */
.chips-esc .dash-tab{padding:6px 14px;font-size:13px;background:transparent}
.chips-esc .dash-tab.active{background:var(--tint);color:var(--brand);border-color:var(--brand)}
details.como{margin:0 0 14px;font-size:13.5px;color:var(--ink2)}
details.como summary{cursor:pointer;color:var(--brand);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
details.como summary::-webkit-details-marker{display:none}
details.como summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700}
details.como[open] summary{margin-bottom:6px}
details.como p{max-width:72ch;line-height:1.55}
@media (max-width:860px){
  /* Topo: espaço atual (toque pra trocar) + sua foto */
  .mbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:var(--side);z-index:40}
  .mbar-setor{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:5px 10px 5px 5px;color:#fff;min-width:0;max-width:calc(100% - 52px);text-align:left}
  .mbar-setor .ico{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:#1B1400;flex:none}
  .mbar-setor .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mbar-setor .tx{min-width:0}
  .mbar-setor small{display:block;font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.05em;line-height:1.2}
  .mbar-setor b{display:block;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar-setor .chev{width:14px;height:14px;stroke:rgba(255,255,255,.65);fill:none;stroke-width:2;flex:none}
  .mbar-me{margin-left:auto;background:none;border:0;padding:0;border-radius:50%;flex:none}
  .mbar-me .av{width:36px;height:36px;font-size:13px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}

  /* Barra de abas embaixo, ao alcance do polegar */
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink3);font-size:11px;font-weight:600;padding:5px 0 3px;min-width:0;border-radius:12px}

  .tabbar button[aria-current="page"]{color:var(--brand)}
  .tabbar button[aria-current="page"] svg{background:var(--tint)}

  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr}
  .main{padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}

  .side{position:fixed;top:0;bottom:0;left:0;width:min(82vw,300px);z-index:50;transform:translateX(-100%);transition:transform .2s ease-out;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;gap:4px;overflow-y:auto;border-top:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .side.open{transform:translateX(0)}
  .mbar-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}

  .nav{flex-direction:column;width:100%;gap:2px}
  .nav button{flex-direction:row;gap:12px;padding:11px 12px;font-size:15px;justify-content:flex-start;align-items:center;text-align:left;min-width:0}
  .nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button[aria-current="page"]::before{left:-14px;right:auto;top:8px;bottom:8px;width:4px;height:auto;border-radius:0 3px 3px 0}

  .top{padding:18px 16px 4px}
  .top h1{font-size:23px}
  .view{padding:12px 16px 28px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .form-inline{grid-template-columns:1fr}
  .hero h2{font-size:22px}
  .cal-wrap{display:none}
  .cal-list{display:block}
  .who span{display:none}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
  .update-banner{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}

  /* Ação principal da tela vira botão flutuante acima das abas */
  .top-actions .fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:35;border-radius:99px;padding:13px 20px;box-shadow:0 10px 26px rgba(20,32,61,.35)}

  /* Cabeçalho e Painel mais compactos */
  .top h1{font-size:22px}
  .top h1 .pill{display:none} /* o setor já aparece no topo */
  .top p{font-size:13.5px}
  .hero{padding:18px 18px;border-radius:14px}

  .strip b{font-size:22px}
  .cols{gap:22px;margin-top:18px}

  /* Toques mais fáceis */
  .btn{min-height:42px}
  .btn.small{min-height:36px;padding:6px 12px}

  /* Abas/filtros rolam de lado em vez de quebrar em várias linhas */
  .dash-tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 2px}
  .dash-tabs::-webkit-scrollbar{display:none}
  .dash-tab{flex:none}
  .time-chips{margin-left:0;margin-right:0;padding:0}

  /* PDF da escala: mês numa linha, botões ocupando a largura */
  .mes-nav{flex:1 1 100%;justify-content:space-between}
  .mes-nav b{min-width:0}
  .pdf-acoes{margin-left:0;flex:1 1 100%}

  /* Janelas viram painel que sobe de baixo, com rodapé sempre visível */
  .overlay{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:sobe .2s ease-out}

  .board{scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 14px;scroll-padding:0 16px}

  .authwrap{padding:16px;align-items:start;padding-top:calc(24px + env(safe-area-inset-top,0px))}

  .slot{flex-wrap:wrap}

  .idea .vote{grid-area:vote}
  .idea-content{grid-area:content}
  .idea-actions{grid-area:actions;justify-content:flex-end}
}
@keyframes sobe{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';

/* =====================================================================
   1. CONSTANTES
   ===================================================================== */
const STAGES=[
  {id:'ideia',name:'Ideia'},
  {id:'roteiro',name:'Roteiro'},
  {id:'gravacao',name:'Gravação'},
  {id:'edicao',name:'Edição'},
  {id:'revisao',name:'Revisão'},
  {id:'agendado',name:'Agendado'},
  {id:'publicado',name:'Publicado'}
];
const FORMATS={reels:'Reels',carrossel:'Carrossel',stories:'Stories',foto:'Post de foto'};
const DATASHOW_STAGES=[
  {id:'aguardando_musicas',name:'Aguardando músicas'},
  {id:'conferindo_momentos',name:'Conferindo momentos'},
  {id:'montado',name:'Montado'},

async function api(path, options){
  options=options||{};
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(authToken) headers['Authorization']='Bearer '+authToken;
  let res;
  try{
    res=await fetch(API_BASE+path, Object.assign({}, options, {headers:headers}));
  }catch(netErr){
    throw new Error('Não foi possível conectar ao servidor em '+API_BASE+'. A API está rodando?');
  }
  const isAuthEndpoint = path.indexOf('/usuarios/login')===0 || path.indexOf('/usuarios/cadastro')===0;
  if(res.status===401 && !isAuthEndpoint){
    authToken=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
    state={cards:[],ideas:[],events:[],me:null};
    authMode='login'; authError='Sessão expirada. Faça login novamente.';
    renderAuth();
    throw new Error('Sessão expirada.');
  }
  const text=await res.text();
  let body=null;
  if(text){ try{ body=JSON.parse(text); }catch(e){} }
  if(!res.ok){
    const msg=(body && (body.erro || (body.erros && Object.values(body.erros).join(', ')))) || ('Erro '+res.status);
    throw new Error(msg);
  }
  return body;
}

function decodeJwt(token){
  try{
    const payload=token.split('.')[1];
    const norm=payload.replace(/-/g,'+').replace(/_/g,'/');
    const json=decodeURIComponent(atob(norm).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

function moveRule(c,to){
  if(to==='agendado'||to==='publicado'){

/* Fotos de perfil: a API exige o token, então não dá pra usar <img src> direto na URL. Cada foto
   é baixada uma vez (por versão) e vira um blob: URL; quando chega, troca as iniciais de todos os
   avatares daquela pessoa que já estão na tela, sem re-renderizar a página inteira. */
const FOTO_URL={}, fotoPendente={};
function fotoUrl(m){
  if(!m||!m.foto) return null;
  const k=m.id+':'+m.foto;
  if(FOTO_URL[k]) return FOTO_URL[k];
  if(!fotoPendente[k]){ fotoPendente[k]=true; carregarFoto(m.id,k); }
  return null;
}
async function carregarFoto(id,k){
  try{
    const res=await fetch(API_BASE+'/usuarios/'+id+'/foto?v='+encodeURIComponent(k.split(':')[1]),{headers:authToken?{'Authorization':'Bearer '+authToken}:{}});
    if(!res.ok) return; // fica marcada como pendente: não tenta de novo até recarregar a página
    FOTO_URL[k]=URL.createObjectURL(await res.blob());
    const m=mem(id);
    if(!m||m.id+':'+m.foto!==k) return;
    $$('[data-av="'+id+'"]').forEach(el=>{ el.innerHTML='<img src="'+FOTO_URL[k]+'" alt="">'; el.classList.add('has-foto'); });
  }catch(e){}
}
const iniciais=nome=>String(nome||'?').replace('Pe. ','P').split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase();
// size: falsy = pequeno, true = 'lg', ou 'xl' / 'xxl'
function avatar(id,size){
  const cls='av'+(size===true?' lg':size?' '+size:'');
  if(!id) return '<span class="'+cls+' av-empty" title="Sem responsável">?</span>';
  const m=mem(id);
  if(!m) return '<span class="'+cls+' av-empty" title="Pessoa não encontrada">?</span>';
  const url=fotoUrl(m);
  return '<span class="'+cls+(url?' has-foto':'')+'" data-av="'+esc(m.id)+'" style="background:hsl('+m.h+' 48% 40%)" title="'+esc(m.nome)+'">'+(url?'<img src="'+url+'" alt="">':esc(iniciais(m.nome)))+'</span>';
}
const fmtChip=c=>'<span class="fmt f-'+c.fmt+'">'+FORMATS[c.fmt]+'</span>';
function stagePill(c){
  const k=c.stage==='publicado'?'ok':(c.stage==='agendado'?'ok':(c.stage==='revisao'?'warn':''));
  return '<span class="pill '+k+'">'+stageName(c.stage)+'</span>';
}
function dueText(c){
  if(!c.due) return '<span class="muted">sem prazo</span>';
  const d=diff(c.due);
  if(c.stage==='publicado') return '<span class="muted">entregue</span>';
  if(isLate(c)) return '<span class="late">atrasado '+Math.abs(d)+(Math.abs(d)===1?' dia':' dias')+'</span>';
  if(d===0) return '<b>prazo hoje</b>';
  return '<span>prazo '+fmtShort(c.due)+'</span>';
}

const hojeISO=()=>{const a=new Date();return a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0')+'-'+String(a.getDate()).padStart(2,'0');};
const doSetorAtual=s=>s.setor===currentSetor||s.setor===null;
function dbadgeHtml(iso){const d=parse(iso);return '<div class="dbadge"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div>';}
function minhasEscalas(){
  const h=hojeISO();
  return state.events.filter(e=>e.date>=h).flatMap(e=>e.slots.filter(s=>s.who===state.me).map(s=>({e:e,s:s})))
    .sort((a,b)=>(a.e.date+a.e.time).localeCompare(b.e.date+b.e.time));
}
function eventosComVagaNoSetor(){
  const h=hojeISO();
  return state.events.filter(e=>e.date>=h&&e.slots.some(s=>doSetorAtual(s)&&!s.who))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

function transmissaoBoardHtml(){
  const lista=transmissaoCache||[];
  return '<div class="board">'+TRANSMISSAO_STAGES.map(s=>{
    const list=lista.filter(t=>t.etapa===s.id).sort((a,b)=>(a.data||'9').localeCompare(b.data||'9'));
    return '<section class="kcol" aria-label="'+s.name+'"><div class="kcol-h"><h3>'+s.name+'<span class="cnt">'+list.length+'</span></h3><button data-action="newTransmissao" aria-label="Nova transmissão" title="Nova transmissão">+</button></div>'+

  }).join('')+'</div>';

function transmissaoCard(t){
  const i=transmissaoStageIdx(t.etapa);
  const respMem=t.responsavel?mem(t.responsavel):null;
  const dataFmt=t.data?fmtShort(t.data):'sem data';
  return '<article class="kcard" data-id="'+t.id+'" data-action="openTransmissao">'+
    '<div class="kc-top"><span class="pill">'+esc(dataFmt)+(t.horario?' · '+esc(t.horario):'')+'</span><span class="pill">'+TIPO_TRANSMISSAO_NOME[t.tipo]+'</span></div>'+
    '<h4>'+esc(t.titulo||'Transmissão')+'</h4>'+
    (t.tema?'<p class="note">Tema: '+esc(t.tema)+'</p>':'<p class="note muted">Tema litúrgico ainda não definido.</p>')+
    '<div class="kc-meta"><span class="note">Responsável:</span>'+(respMem?avatar(t.responsavel)+esc(respMem.nome):'<span class="muted">ninguém ainda</span>')+'</div>'+
    '<div class="kc-meta" style="margin-top:2px">'+(t.link?'<span title="Link pronto">Link ok</span>':'<span class="muted">Sem link</span>')+'<span class="sp"></span>'+(t.capa?'<span title="Capa pronta">Capa ok</span>':'<span class="muted">Sem capa</span>')+'</div>'+
    '<div class="kc-mv" style="margin-top:8px"><button data-action="transmissaoPrev" data-id="'+t.id+'" '+(i===0?'disabled':'')+' aria-label="Voltar etapa">◀</button><button data-action="transmissaoNext" data-id="'+t.id+'" '+(i===TRANSMISSAO_STAGES.length-1?'disabled':'')+' aria-label="Avançar etapa">▶</button></div>'+
  '</article>';
}
function boardHtml(){
  const q=filters.q.trim().toLowerCase();
  const ok=c=>(!q||c.title.toLowerCase().indexOf(q)>-1)&&(filters.owner==='all'||(filters.owner==='none'?!c.owner:c.owner===filters.owner));
  const cards=visibleCards();
  return '<div class="board">'+STAGES.map(s=>{
    const list=cards.filter(c=>c.stage===s.id&&ok(c)).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
    return '<section class="kcol" aria-label="'+s.name+'"><div class="kcol-h"><h3>'+s.name+'<span class="cnt">'+list.length+'</span></h3><button data-action="newIn" data-stage="'+s.id+'" aria-label="Novo cartão em '+s.name+'" title="Novo cartão">+</button></div>'+
      '<div class="kbody" data-stage="'+s.id+'">'+(list.length?list.map(kcard).join(''):'<div class="empty" style="padding:10px;font-size:13px">Solte um cartão aqui</div>')+'</div></section>';
  }).join('')+'</div>';
}
function kcard(c){
  const i=stageIdx(c.stage), dc=doneCount(c);
  return '<article class="kcard f-'+c.fmt+'" draggable="true" data-id="'+c.id+'" data-action="open">'+
    '<div class="kc-top">'+fmtChip(c)+'<span class="pill">'+esc(c.theme)+'</span></div>'+
    '<h4>'+esc(c.title)+'</h4>'+
    '<div class="kc-meta">'+avatar(c.owner)+'<span>'+dueText(c)+'</span><span class="sp"></span>'+
      (c.comments.length?'<span title="Comentários">'+c.comments.length+' com.</span>':'')+
      '<span title="Checklist" class="'+(dc===CHECKS.length?'':'muted')+'">'+dc+'/'+CHECKS.length+'</span></div>'+
    '<div class="kc-mv" style="margin-top:8px"><button data-action="prev" data-id="'+c.id+'" '+(i===0?'disabled':'')+' aria-label="Voltar etapa">◀</button><button data-action="next" data-id="'+c.id+'" '+(i===STAGES.length-1?'disabled':'')+' aria-label="Avançar etapa">▶</button></div>'+
  '</article>';
}
function refreshBoard(){
  const b=$('.board'), sc=b?b.scrollLeft:0;
  const area=$('#boardArea'); if(!area) return;
  area.innerHTML=boardHtml();
  const nb=$('.board'); if(nb) nb.scrollLeft=sc;
}

/* ---------- Calendário ---------- */
function viewCalendario(){
  const y=cal.y,m=cal.m;
  const first=new Date(y,m,1), start=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const title=cap(first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const byDate={},evDate={};
  visibleCards().forEach(c=>{if(c.pub)(byDate[c.pub]=byDate[c.pub]||[]).push(c);});
  state.events.forEach(e=>{(evDate[e.date]=evDate[e.date]||[]).push(e);});
  let cells='',list='';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d=>{cells+='<div class="dow">'+d+'</div>';});
  for(let i=0;i<start;i++) cells+='<div class="cell out"></div>';
  for(let d=1;d<=dim;d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d), cs=byDate[s]||[], es=evDate[s]||[], ls=litLabels(s);
    const chips=cs.map(c=>'<button class="chip f-'+c.fmt+'" data-action="open" data-id="'+c.id+'" title="'+esc(c.title)+'">'+esc(c.title)+'</button>').join('');
    cells+='<div class="cell'+(s===TODAY?' today':'')+'" data-action="newOn" data-date="'+s+'"><div><span class="dn">'+d+'</span></div>'+ls.map(l=>'<div class="lit">'+esc(l)+'</div>').join('')+chips+es.map(e=>'<div class="evt">'+esc(e.title)+'</div>').join('')+'</div>';
    if(cs.length||es.length||ls.length){
      const wd=new Date(y,m,d).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
      list+='<div class="lrow"><div class="ld"><b>'+d+'</b><span>'+wd+'</span></div><div class="lc">'+ls.map(l=>'<span class="lit">'+esc(l)+'</span>').join('')+cs.map(c=>'<button class="chip f-'+c.fmt+'" style="width:auto;max-width:100%" data-action="open" data-id="'+c.id+'">'+esc(c.title)+'</button>').join('')+es.map(e=>'<span class="evt">'+esc(e.title)+' às '+e.time+'</span>').join('')+'<button class="btn small" data-action="newOn" data-date="'+s+'">Planejar neste dia</button></div></div>';
    }
  }
  const tail=(7-(start+dim)%7)%7;
  for(let i=0;i<tail;i++) cells+='<div class="cell out"></div>';
  return '<div class="cal-bar"><button class="btn small" data-action="calPrev" aria-label="Mês anterior">◀</button><h2>'+title+'</h2><button class="btn small" data-action="calNext" aria-label="Próximo mês">▶</button><button class="btn small" data-action="calToday">Hoje</button>'+
    '<div class="legend"><span><i style="background:var(--f-reels)"></i>Reels</span><span><i style="background:var(--f-carrossel)"></i>Carrossel</span><span><i style="background:var(--f-stories)"></i>Stories</span><span><i style="background:var(--f-foto)"></i>Foto</span><span><i style="background:var(--gold)"></i>Cobertura</span></div></div>'+
    '<div class="cal-wrap"><div class="cal">'+cells+'</div></div>'+
    '<div class="cal-list">'+(list||'<div class="empty">Nada neste mês.</div>')+'</div>'+
    '<p class="note">Clique em um dia para planejar um conteúdo nessa data. Datas litúrgicas são exemplos e podem ser ajustadas à programação do santuário.</p>';
}

/* ---------- Dashboard (leitura automática do Instagram) ---------- */
let dashboardCache={}; // chave = periodo -> DashboardAutoResumoDTO já carregado
let dashboardPeriodo='SEMANAL';
let dashboardLoading=false;
let dashboardSincronizando=false;
let metasCache=null;
let metasLoading=false;
let metaFormOpen=false;
const DASH_PERIODOS=[['SEMANAL','Semana'],['MENSAL','Mês'],['ANUAL','Ano']];
const META_TIPOS=[
  ['CURTIDAS_MEDIA','Média de curtidas por post (30 dias)'],
  ['ALCANCE_MENSAL','Alcance total no mês'],
  ['POSTS_POR_SEMANA','Posts por semana'],
  ['ENGAJAMENTO_MEDIO','Engajamento médio por post (30 dias)']
];
const META_TIPO_NOME=Object.fromEntries(META_TIPOS);
async function carregarDashboard(){
  dashboardLoading=true; render();
  try{
    dashboardCache[dashboardPeriodo]=await api('/instagram/resumo?periodo='+dashboardPeriodo);
  }catch(e){ toast(e.message,'warn'); }
  dashboardLoading=false; render();
}
async function carregarMetas(){
  metasLoading=true; render();
  try{ metasCache=await api('/instagram/metas'); }
  catch(e){ metasCache=[]; }
  metasLoading=false; render();
}
async function sincronizarInstagram(){
  dashboardSincronizando=true; render();
  try{
    const r=await api('/instagram/sincronizar',{method:'POST'});
    toast(r.postsNovos>0?r.postsNovos+' post(s) novo(s) encontrado(s)!':'Tudo já estava em dia.');
    dashboardCache={};
    await carregarDashboard();
  }catch(e){ toast(e.message,'warn'); }
  dashboardSincronizando=false; render();
}
function dashboardStatHtml(dados){
  const stats=[
    ['Posts no período',dados.totalPosts],
    ['Curtidas',dados.totalCurtidas],
    ['Média de curtidas',Math.round(dados.mediaCurtidas*10)/10],
    ['Comentários',dados.totalComentarios],
    ['Salvamentos',dados.totalSalvamentos],
    ['Compartilhamentos',dados.totalCompartilhamentos],
    ['Alcance',dados.totalAlcance]
  ];
  return '<div class="strip">'+stats.map(s=>'<div><b>'+s[1]+'</b><span>'+s[0]+'</span></div>').join('')+'</div>';
}
function dashboardPostHtml(p,maxCurtidas){
  const pct=p.curtidas?Math.max(4,Math.round((p.curtidas/maxCurtidas)*100)):0;
  return '<a class="row" style="display:block;text-align:left" href="'+esc(p.permalink||'#')+'" target="_blank" rel="noopener">'+
    '<div class="dash-post-h"><b>'+esc((p.legenda||'(sem legenda)').slice(0,70))+'</b><span class="note">'+esc((p.publicadoEm||'').slice(0,10))+'</span></div>'+
    '<div class="bar" style="margin:8px 0"><i style="width:'+pct+'%"></i></div>'+
    '<div class="dash-stats"><span>'+(p.curtidas??'—')+' curtidas</span><span>'+(p.comentarios??'—')+' comentários</span><span>'+(p.salvamentos??'—')+' salvamentos</span><span>'+(p.compartilhamentos??'—')+' compart.</span><span>'+(p.alcance??'—')+' alcance</span></div>'+
  '</a>';
}
function metaFormHtml(){
  if(!metaFormOpen) return '<button type="button" class="btn small" data-action="toggleMetaForm">+ Nova meta</button>';
  return '<div class="form-inline" style="margin-top:8px">'+
    '<label class="fld"><span>Título</span><input id="mt-titulo" placeholder="Ex.: Crescer o alcance"></label>'+
    '<label class="fld"><span>Métrica</span><select id="mt-metrica">'+META_TIPOS.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('')+'</select></label>'+
    '<label class="fld"><span>Valor alvo</span><input id="mt-valor" type="number" min="1" placeholder="Ex.: 500"></label>'+
    '<label class="fld"><span>Data alvo (opcional)</span><input id="mt-data" type="date"></label>'+
    '<button class="btn primary" data-action="salvarMeta">Salvar meta</button></div>';
}
function metaHtml(m){
  return '<div class="row" style="display:block">'+
    '<div class="dash-post-h"><b>'+esc(m.titulo)+'</b><span class="pill">'+META_TIPO_NOME[m.metrica]+'</span>'+
      (m.concluida?'<span class="pill ok">Concluída</span>':'')+
      '<button type="button" class="link-btn" style="margin-left:auto;font-size:12px" data-action="excluirMeta" data-id="'+m.id+'">excluir</button></div>'+
    (m.descricao?'<p class="note">'+esc(m.descricao)+'</p>':'')+
    '<div class="bar" style="margin:8px 0"><i style="width:'+Math.min(100,m.progresso)+'%"></i></div>'+
    '<div class="dash-stats"><span>'+Math.round(m.valorAtual*10)/10+' de '+m.valorAlvo+' ('+m.progresso+'%)</span>'+
    (m.dataAlvo?'<span>até '+esc(m.dataAlvo)+'</span>':'')+'</div>'+
  '</div>';
}
function viewDashboard(){
  const tabs='<div class="dash-tabs">'+DASH_PERIODOS.map(t=>
    '<button type="button" class="dash-tab'+(dashboardPeriodo===t[0]?' active':'')+'" data-action="dashPeriodo" data-periodo="'+t[0]+'">'+t[1]+'</button>'
  ).join('')+(isApprover()?'<button type="button" class="btn small" style="margin-left:auto" data-action="sincronizarInstagram" title="Atualiza sozinho a cada 6h; manualmente, no máximo 1 vez a cada 30 min."'+(dashboardSincronizando?' disabled':'')+'>'+(dashboardSincronizando?'Sincronizando...':'Sincronizar agora')+'</button>':'')+'</div>';

  const dados=dashboardCache[dashboardPeriodo];
  const corpoDash=!dados
    ? '<div class="empty" style="margin-top:16px">'+(dashboardLoading?'Carregando...':'Sem dados ainda.')+'</div>'
    : (()=>{
        const maxCurtidas=Math.max(1,...dados.posts.map(p=>p.curtidas||0));
        const lista=dados.posts.length
          ? '<div class="rows">'+dados.posts.map(p=>dashboardPostHtml(p,maxCurtidas)).join('')+'</div>'
          : '<div class="empty">Nenhum post detectado nesse período. Clique em "Sincronizar agora" ou confira se o Instagram está conectado.</div>';
        return dashboardStatHtml(dados)+'<section class="panel" style="margin-top:18px"><h2>Posts do período</h2>'+lista+'</section>';
      })();

  const metas=metasCache;
  const corpoMetas='<section class="panel" style="margin-top:18px"><h2>Metas de crescimento</h2>'+
    (metas===null?'<div class="empty">Carregando metas...</div>'
      :(metas.length?'<div class="rows">'+metas.map(metaHtml).join('')+'</div>':'<div class="empty">Nenhuma meta cadastrada ainda.</div>'))+
    metaFormHtml()+'</section>';

  return tabs+corpoDash+corpoMetas;
}
async function salvarMeta(){
  const titulo=$('#mt-titulo').value.trim();
  const metrica=$('#mt-metrica').value;
  const valor=Number($('#mt-valor').value);
  const dataAlvo=$('#mt-data').value||null;
  if(!titulo){toast('Dê um título à meta.','warn');return;}
  if(!valor||valor<=0){toast('Defina um valor alvo maior que zero.','warn');return;}
  try{
    await api('/instagram/metas',{method:'POST',body:JSON.stringify({titulo:titulo,metrica:metrica,valorAlvo:valor,dataAlvo:dataAlvo})});
    metaFormOpen=false;
    toast('Meta criada!');
    await carregarMetas();
  }catch(e){ toast(e.message,'warn'); }
}
async function excluirMeta(id){
  try{
    await api('/instagram/metas/'+id,{method:'DELETE'});
    metasCache=metasCache.filter(m=>String(m.id)!==String(id));
    render();
    toast('Meta excluída.');
  }catch(e){ toast(e.message,'warn'); }
}

async function carregarEscalaCompleta(mes){
  if(escalaCompletaLoading) return;
  escalaCompletaLoading=true;
  try{ escalaCompletaCache[mes]=await api('/escalas/completa?mes='+mes); }
  catch(e){ escalaCompletaCache[mes]={erro:e.message}; }
  escalaCompletaLoading=false;
  if(view==='escalas'&&escalaAba==='completa') render();
}
async function baixarEscalaPdf(setor){
  try{
    const headers={}; if(authToken) headers['Authorization']='Bearer '+authToken;
    const res=await fetch(API_BASE+'/escalas/completa/pdf?mes='+escalaMes+(setor?'&setor='+setor.toUpperCase():''),{headers:headers});
    if(!res.ok){ let msg='Não foi possível gerar o PDF.'; try{ const b=await res.json(); if(b&&b.erro) msg=b.erro; }catch(_){ } throw new Error(msg); }
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='escala-'+(setor?setor.replace(/_/g,'-'):'completa')+'-'+escalaMes+'.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ toast(e.message,'warn'); }
}

async function salvarEscala(){
  sincronizarSlotFormDoDOM();
  const titulo=$('#es-titulo').value.trim();
  const data=$('#es-data').value;
  const horario=$('#es-horario').value;
  const local=$('#es-local').value.trim();
  const grande=$('#es-grande').checked;
  if(!titulo||!data||!horario||!local){toast('Preencha título, data, horário e local.','warn');return;}
  const slots=escalaFormSlots.filter(s=>s.rotulo.trim());
  try{
    const dto=await api('/eventos',{method:'POST',body:JSON.stringify({
      titulo:titulo,data:data,horario:horario,local:local,eventoGrande:grande,
      slots:slots.map(s=>({rotulo:s.rotulo.trim(),tipo:s.tipo||null,setor:currentSetor.toUpperCase()}))
    })});
    state.events.push(eventoFromApi(dto));
    invalidarEscalaCompleta();
    closeModal(); render(); toast('Evento criado na escala!');
  }catch(e){ toast(e.message,'warn'); }
}
async function gerarEscalasMes(){
  try{
    const r=await api('/eventos/gerar-escalas-mes',{method:'POST'});
    toast(r.eventosCriados>0?r.eventosCriados+(r.eventosCriados>1?' missas criadas na escala!':' missa criada na escala!'):'Já estava tudo criado esse mês.');
    const eventos=await api('/eventos');
    state.events=eventos.map(eventoFromApi);
    invalidarEscalaCompleta();
    render();
  }catch(e){ toast(e.message,'warn'); }
}
async function salvarRenomeSlot(eventoId,slotId){
  const rotulo=($('#es-rename')||{value:''}).value.trim();
  if(!rotulo){toast('Dê um nome pra função.','warn');return;}
  try{
    const dto=await api('/eventos/'+eventoId+'/slots/'+slotId,{method:'PATCH',body:JSON.stringify({rotulo:rotulo})});
    Object.assign(state.events.find(x=>x.id===eventoId),eventoFromApi(dto));
    invalidarEscalaCompleta(); editSlotKey=null; render(); toast('Função renomeada.');
  }catch(e){ toast(e.message,'warn'); }
}
async function removerSlot(eventoId,slotId){
  const ev=state.events.find(x=>x.id===eventoId), sl=ev&&ev.slots.find(x=>x.id===slotId);
  if(!sl) return;
  const quem=sl.who&&mem(sl.who)?' '+mem(sl.who).nome+' está escalado(a) nela e vai sair da escala.':'';
  if(!confirm('Remover a função "'+sl.label+'" desta missa?'+quem)) return;
  try{
    const dto=await api('/eventos/'+eventoId+'/slots/'+slotId,{method:'DELETE'});
    Object.assign(ev,eventoFromApi(dto));
    invalidarEscalaCompleta(); render(); toast('Função removida.');
  }catch(e){ toast(e.message,'warn'); }
}
async function salvarSlotExistente(eventoId){
  const rotulo=$('#as-rotulo').value.trim();
  if(!rotulo){toast('Dê um nome pra função.','warn');return;}
  try{
    const dto=await api('/eventos/'+eventoId+'/slots',{method:'POST',body:JSON.stringify({rotulo:rotulo,tipo:null,setor:currentSetor.toUpperCase()})});
    Object.assign(state.events.find(x=>x.id===eventoId),eventoFromApi(dto));
    invalidarEscalaCompleta();
    addSlotEventoId=null;
    render(); toast('Função adicionada!');
  }catch(e){ toast(e.message,'warn'); }
}

function rankNoSetor(m,s){ return m.role==='coordenador_geral'?0:(m.role==='coordenador'&&m.setor===s?1:2); }
function membrosDoSetor(s){
  return MEMBERS.filter(m=>pertenceSetor(m,s))
    .sort((a,b)=>rankNoSetor(a,s)-rankNoSetor(b,s)||a.nome.localeCompare(b.nome,'pt-BR'));

function papelNoSetor(m,s){
  if(m.role==='coordenador_geral') return 'Coordenação Geral';

  return (m.role==='coordenador'?'Coordena '+SETOR_NAME[m.setor]:'Voluntário(a) de '+(SETOR_NAME[m.setor]||'outro setor'))+', também está aqui';

// Reduz no navegador pra um quadrado de até 400px em JPEG antes de enviar (foto de celular tem vários MB).
function reduzirFoto(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const lado=Math.min(img.naturalWidth,img.naturalHeight), alvo=Math.min(400,lado);
      const c=document.createElement('canvas'); c.width=c.height=alvo;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,alvo,alvo);
      ctx.drawImage(img,(img.naturalWidth-lado)/2,(img.naturalHeight-lado)/2,lado,lado,0,0,alvo,alvo);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('Não foi possível processar a imagem.')),'image/jpeg',0.86);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Não consegui abrir essa imagem. Tente uma foto JPG ou PNG.')); };
    img.src=url;
  });
}
async function enviarFoto(file){
  if(!file) return;
  if(file.type&&file.type.indexOf('image/')!==0){ toast('Escolha um arquivo de imagem.','warn'); return; }
  toast('Enviando foto...');
  try{
    const blob=await reduzirFoto(file);
    const res=await fetch(API_BASE+'/usuarios/me/foto',{method:'PUT',headers:{'Content-Type':'image/jpeg','Authorization':'Bearer '+authToken},body:blob});
    let body=null; try{ body=await res.json(); }catch(_){}
    if(!res.ok) throw new Error((body&&body.erro)||'Não foi possível salvar a foto.');
    capturarRascunhoPerfil(); atualizarMembro(body); render(); toast('Foto atualizada.');
  }catch(e){ toast(e.message,'warn'); }
}
async function removerFoto(){
  try{
    const u=await api('/usuarios/me/foto',{method:'DELETE'});
    capturarRascunhoPerfil(); atualizarMembro(u); render(); toast('Foto removida.');
  }catch(e){ toast(e.message,'warn'); }
}

async function saveModal(){
  const checks={}; $$('input[name=chk]').forEach(i=>{checks[i.value]=i.checked;});
  const data={title:$('#f-title').value.trim(),fmt:$('#f-fmt').value,theme:$('#f-theme').value,owner:$('#f-owner').value||null,stage:$('#f-stage').value,due:$('#f-due').value,pub:$('#f-pub').value,notes:$('#f-notes').value,checks:checks};
  if(!data.title){toast('Dê um título ao cartão antes de salvar.','warn');return;}
  try{
    if(modalId){
      const c=card(modalId);
      if(data.stage!==c.stage){const err=moveRule(Object.assign({},c,data),data.stage);if(err){toast(err,'warn');return;}}
      const dto=await api('/cartoes/'+modalId,{method:'PUT',body:JSON.stringify(cartaoToApi(data))});
      let atualizado=cartaoFromApi(dto);
      if(data.stage!==c.stage){
        const dto2=await api('/cartoes/'+modalId+'/etapa?novaEtapa='+data.stage.toUpperCase(),{method:'PATCH'});
        atualizado=cartaoFromApi(dto2);
      }
      Object.assign(c,atualizado);
    }else{
      const err=moveRule(data,data.stage); if(err){toast(err,'warn');return;}
      const dto=await api('/cartoes',{method:'POST',body:JSON.stringify(cartaoToApi(data))});
      let novo=cartaoFromApi(dto);
      if(data.stage&&data.stage!=='ideia'){
        const dto2=await api('/cartoes/'+novo.id+'/etapa?novaEtapa='+data.stage.toUpperCase(),{method:'PATCH'});
        novo=cartaoFromApi(dto2);
      }
      state.cards.push(novo);
    }
    closeModal(); render(); toast('Cartão salvo.');
  }catch(e){ toast(e.message,'warn'); }
}

  exclusaoAlvo={tipo:tipo,id:id,titulo:titulo};
  const o=$('#overlay');
  o.innerHTML=motivoExclusaoModal(titulo); o.hidden=false;

async function confirmarExclusao(){
  if(!exclusaoAlvo) return;
  const checked=$('input[name=motivo-exclusao]:checked');
  const motivo=checked?checked.value:'OUTRO';
  const detalhe=($('#f-motivo-detalhe').value||'').trim()||null;
  const {tipo,id}=exclusaoAlvo;
  try{
    if(tipo==='cartao'){
      await api('/cartoes/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.cards=state.cards.filter(c=>c.id!==id);
      toast('Cartão movido para a lixeira.');
    }else if(tipo==='ideia'){
      await api('/ideias/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.ideas=state.ideas.filter(i=>i.id!==id);
      toast('Ideia movida para a lixeira.');
    }else if(tipo==='evento'){
      await api('/eventos/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.events=state.events.filter(e=>e.id!==id);
      toast('Escala movida para a lixeira.');
    }
    exclusaoAlvo=null;
    lixeira={cartoes:null,ideias:null,eventos:null,loading:false,setor:null};
    closeModal(); render();
  }catch(e){ toast(e.message,'warn'); }
}
async function carregarLixeira(){
  lixeira.loading=true; lixeira.setor=currentSetor; render();
  try{
    const [cartoes,ideias,eventos]=await Promise.all([
      api('/cartoes/lixeira?setor='+currentSetor.toUpperCase()),
      api('/ideias/lixeira?setor='+currentSetor.toUpperCase()),
      api('/eventos/lixeira')
    ]);
    lixeira.cartoes=cartoes.map(cartaoFromApi);
    lixeira.ideias=ideias.map(ideiaFromApi);
    lixeira.eventos=eventos.map(eventoFromApi);
  }catch(e){ lixeira.cartoes=[]; lixeira.ideias=[]; lixeira.eventos=[]; toast(e.message,'warn'); }
  lixeira.loading=false; render();
}

let toastTimer=null;
function toast(msg,type){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(type==='warn'?' warn':'');

async function moveCard(id,to){
  const c=card(id); if(!c||c.stage===to) return;
  const err=moveRule(c,to); if(err){toast(err,'warn');return;}
  try{
    const dto=await api('/cartoes/'+id+'/etapa?novaEtapa='+to.toUpperCase(),{method:'PATCH'});
    Object.assign(c,cartaoFromApi(dto));
    render(); toast('“'+c.title+'” foi para '+stageName(to)+'.');
  }catch(e){ toast(e.message,'warn'); }
}
async function voteIdeia(id){
  try{
    const dto=await api('/ideias/'+id+'/votar',{method:'POST'});
    const i=state.ideas.find(x=>x.id===id);
    Object.assign(i,ideiaFromApi(dto));
    render();
  }catch(e){ toast(e.message,'warn'); }
}
async function adoptIdeia(id){
  try{
    const cartaoDto=await api('/ideias/'+id+'/adotar',{method:'POST'});
    const i=state.ideas.find(x=>x.id===id); if(i) i.adopted=true;
    state.cards.push(cartaoFromApi(cartaoDto));
    render(); toast('A ideia virou um cartão na coluna Ideia do quadro.');
  }catch(e){ toast(e.message,'warn'); }
}
async function addIdea(){
  const ti=$('#i-title').value.trim(); if(!ti){toast('Escreva o título da ideia.','warn');return;}
  try{
    const dto=await api('/ideias',{method:'POST',body:JSON.stringify({titulo:ti,descricao:$('#i-desc').value.trim()||null,tema:$('#i-theme').value,setor:currentSetor.toUpperCase()})});
    state.ideas.push(ideiaFromApi(dto));
    render(); toast('Ideia enviada. Agora a equipe pode votar.');
  }catch(e){ toast(e.message,'warn'); }
}
async function joinSlot(evId,slotId){
  const ev=state.events.find(x=>x.id===evId);
  if(ev.slots.some(x=>x.who===state.me)){toast('Você já está nesta escala.','warn');return;}
  try{
    const dto=await api('/eventos/'+evId+'/slots/'+slotId+'/inscrever',{method:'POST'});
    Object.assign(ev,eventoFromApi(dto));
    invalidarEscalaCompleta();
    render(); toast('Presença confirmada em '+ev.title+'.');
  }catch(e){
    toast(e.message,'warn');
    // Provavelmente outra pessoa pegou a vaga antes: recarrega pra mostrar quem está nela agora.
    await recarregarEventos();
  }
}
async function recarregarEventos(){
  try{
    state.events=(await api('/eventos')).map(eventoFromApi);
    invalidarEscalaCompleta();
    if(view==='escalas'&&!editSlotKey&&!addSlotEventoId&&$('#overlay').hidden) render();
  }catch(_){}
}
async function leaveSlot(evId,slotId){
  const ev=state.events.find(x=>x.id===evId);
  try{
    const dto=await api('/eventos/'+evId+'/slots/'+slotId+'/desinscrever',{method:'POST'});
    Object.assign(ev,eventoFromApi(dto));
    invalidarEscalaCompleta();
    render(); toast('Vaga liberada.');
  }catch(e){ toast(e.message,'warn'); }
}

/* Atualizações com gente usando: o login continua valendo depois do deploy (o token não depende
   do servidor que o emitiu), mas a página aberta fica com o front antigo até recarregar. Então o
   front confere /api/versao de tempos em tempos e, quando muda, mostra um aviso pra atualizar
   (sem recarregar à força, pra ninguém perder o que estava digitando). */
let versaoCarregada=null;
async function conferirVersao(){
  try{
    const r=await fetch(API_BASE+'/versao',{cache:'no-store'});
    if(!r.ok) return;
    const v=(await r.json()).versao;
    if(!versaoCarregada){ versaoCarregada=v; return; }
    if(v!==versaoCarregada) $('#updateBanner').hidden=false;
  }catch(_){}
}
setInterval(conferirVersao,2*60*1000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  conferirVersao();
  // Voltou pra aba: traz a escala atualizada (outras pessoas podem ter se inscrito nesse meio tempo).
  if(authToken&&state.me) recarregarEventos();
});

async function init(){
  conferirVersao();
  try{
    const params=new URLSearchParams(window.location.search);
    const tk=params.get('resetToken');
    if(tk){
      resetToken=tk; authMode='redefinir'; authError=''; authOk='';
      history.replaceState(null,'',window.location.pathname);
      render();
      return;
    }
  }catch(e){}
  if(authToken){
    const claims=decodeJwt(authToken);
    if(claims&&claims.exp&&claims.exp*1000>Date.now()&&claims.id){
      try{ await carregarTudo(claims.id); render(); return; }catch(e){}
    }
    authToken=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
  }
  render();
}
init();
})();
</script>
</body>
</html>
