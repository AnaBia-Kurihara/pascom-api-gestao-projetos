// Tira os números de versículo grudados no texto ("15os fariseus" -> "os fariseus") e quebra em
// blocos do tamanho de um slide, sem cortar no meio da frase.
function semVersiculos(t){ return String(t||'').replace(/(^|[\s“"(—–-])\d{1,3}(?=[A-Za-zÀ-ÿ“"])/g,'$1').replace(/\s+/g,' ').trim(); }
function emSlides(t,max){
  max=max||240; const frases=semVersiculos(t).split(/(?<=[.!?;:])\s+/); const out=[]; let atual='';
  frases.forEach(f=>{ if((atual+' '+f).trim().length>max&&atual){ out.push(atual.trim()); atual=f; } else atual=(atual+' '+f).trim(); });
  if(atual) out.push(atual.trim()); return out;
}
function copiarTexto(t,msg){
  const ok=()=>toast(msg||'Copiado!');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,()=>copiaAntiga(t,ok)); else copiaAntiga(t,ok);
}
function copiaAntiga(t,ok){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');ok();}catch(_){} a.remove(); }
const liturgiaCopias={}; // id -> texto (pra não pôr textos longos em atributos HTML)
function blocoLiturgia(id,titulo,ref,texto,extra){
  if(!texto) return '';
  const slides=emSlides(texto);
  liturgiaCopias[id]=(titulo?titulo+(ref?' ('+ref+')':'')+'\n\n':'')+semVersiculos(texto);
  liturgiaCopias[id+'-s']=(titulo?titulo+(ref?' ('+ref+')':'')+'\n\n':'')+slides.join('\n\n');
  return '<details class="lit"><summary><span><b>'+esc(titulo)+'</b>'+(ref?' <small>'+esc(ref)+'</small>':'')+(extra?'<em>'+esc(extra)+'</em>':'')+'</span><small>'+slides.length+' slide'+(slides.length>1?'s':'')+'</small></summary>'+
    '<div class="lit-corpo">'+slides.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'+
    '<div class="lit-acoes"><button class="btn small" data-action="copiarLit" data-k="'+id+'">Copiar texto</button><button class="btn small primary" data-action="copiarLit" data-k="'+id+'-s">Copiar em slides</button></div></details>';
}
function liturgiaHtml(l){
  if(!l) return '';
  const L=l.leituras||{}, um=a=>a&&a[0];
  const p1=um(L.primeiraLeitura), sl=um(L.salmo), p2=um(L.segundaLeitura), ev=um(L.evangelho), o=l.oracoes||{}, an=l.antifonas||{};
  let tudo=[];
  const bloco=(id,t,r,x,e)=>{ const h=blocoLiturgia(id,t,r,x,e); if(h) tudo.push(id+'-s'); return h; };
  const html=
    bloco('l-p1',p1&&p1.titulo||'Primeira leitura',p1&&p1.referencia,p1&&p1.texto)+
    bloco('l-sl','Salmo responsorial',sl&&sl.referencia,sl&&((sl.refrao?'R. '+sl.refrao+' ':'')+sl.texto),sl&&sl.refrao?'R. '+sl.refrao:'')+
    bloco('l-p2',p2&&p2.titulo||'Segunda leitura',p2&&p2.referencia,p2&&p2.texto)+
    bloco('l-acl','Aclamação ao Evangelho','',ev&&ev.aclamacao)+
    bloco('l-ev',ev&&ev.titulo||'Evangelho',ev&&ev.referencia,ev&&ev.texto)+
    bloco('l-ae','Antífona de entrada','',an.entrada)+
    bloco('l-co','Oração do dia (coleta)','',o.coleta)+
    bloco('l-of','Oração sobre as oferendas','',o.oferendas)+
    bloco('l-ac','Antífona da comunhão','',an.comunhao)+
    bloco('l-pc','Oração depois da comunhão','',o.comunhao);
  liturgiaCopias['l-tudo']=tudo.map(k=>liturgiaCopias[k]).join('\n\n\n');
  return html;
}

// Reduz no navegador pra um quadrado de até 400px em JPEG antes de enviar (foto de celular tem vários MB).
function reduzirFoto(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const lado=Math.min(img.naturalWidth,img.naturalHeight), alvo=Math.min(400,lado);
      const c=document.createElement('canvas'); c.width=c.height=alvo;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,alvo,alvo);
      ctx.drawImage(img,(img.naturalWidth-lado)/2,(img.naturalHeight-lado)/2,lado,lado,0,0,alvo,alvo);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('Não foi possível processar a imagem.')),'image/jpeg',0.86);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Não consegui abrir essa imagem. Tente uma foto JPG ou PNG.')); };
    img.src=url;
  });
}
async function enviarFoto(file){
  if(!file) return;
  if(file.type&&file.type.indexOf('image/')!==0){ toast('Escolha um arquivo de imagem.','warn'); return; }
  toast('Enviando foto...');
  try{
    const blob=await reduzirFoto(file);
    const res=await fetch(API_BASE+'/usuarios/me/foto',{method:'PUT',headers:{'Content-Type':'image/jpeg','Authorization':'Bearer '+authToken},body:blob});
    let body=null; try{ body=await res.json(); }catch(_){}
    if(!res.ok) throw new Error((body&&body.erro)||'Não foi possível salvar a foto.');
    capturarRascunhoPerfil(); atualizarMembro(body); render(); toast('Foto atualizada.');
  }catch(e){ toast(e.message,'warn'); }
}

async function saveModal(){

  const data={title:$('#f-title').value.trim(),fmt:$('#f-fmt').value,theme:$('#f-theme').value,owner:$('#f-owner').value||null,stage:$('#f-stage').value,due:$('#f-due').value,pub:$('#f-pub').value,notes:$('#f-notes').value,checks:checks};

      const dto=await api('/cartoes/'+modalId,{method:'PUT',body:JSON.stringify(cartaoToApi(data))});

      const dto=await api('/cartoes',{method:'POST',body:JSON.stringify(cartaoToApi(data))});

async function confirmarExclusao(){
  if(!exclusaoAlvo) return;

  const motivo=checked?checked.value:'OUTRO';
  const detalhe=($('#f-motivo-detalhe').value||'').trim()||null;
  const {tipo,id}=exclusaoAlvo;
  try{
    if(tipo==='cartao'){
      await api('/cartoes/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.cards=state.cards.filter(c=>c.id!==id);
      toast('Cartão movido para a lixeira.');
    }else if(tipo==='ideia'){
      await api('/ideias/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.ideas=state.ideas.filter(i=>i.id!==id);

      await api('/eventos/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.events=state.events.filter(e=>e.id!==id);

    exclusaoAlvo=null;
    lixeira={cartoes:null,ideias:null,eventos:null,loading:false,setor:null};

function quandoFoi(iso){
  const d=new Date(iso), min=Math.round((Date.now()-d.getTime())/60000);
  if(min<1) return 'agora'; if(min<60) return 'há '+min+' min'; if(min<1440) return 'há '+Math.round(min/60)+'h';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
// ---------------------------------------------------------------- app instalado + notificações no celular
// Estado deste aparelho: '?' conferindo · 'ligado' · 'desligado' · 'negado' (bloqueou no navegador) ·
// 'ios-instalar' (iPhone fora da Tela de Início: lá só dá notificação com o app instalado) · 'sem-suporte'.
let pushEstado='?', pushOcupado=false, pushReinscrito=false, instalarPrompt=null, swRegistro=null;
const PUSH_BANNER_KEY='pascom-push-banner-fechado';
const ehStandalone=()=>{ try{ return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }catch(e){ return false; } };
const ehIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushSuportado=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function chaveParaBytes(b64){
  const s=(b64+'='.repeat((4-b64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'), bin=atob(s), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function registroSw(){
  if(!('serviceWorker' in navigator)) return null;
  if(!swRegistro) swRegistro=navigator.serviceWorker.register('/sw.js').catch(()=>null);
  return swRegistro;
}
async function inscricaoAtual(){
  const reg=await registroSw(); if(!reg||!reg.pushManager) return null;
  try{ return await reg.pushManager.getSubscription(); }catch(e){ return null; }
}
/** Confere o estado deste aparelho; ao entrar, reenvia a inscrição (o aparelho pode ter trocado de pessoa). */
async function atualizarPush(aoEntrar){
  let novo;
  if(!pushSuportado()) novo=ehIOS()&&!ehStandalone()?'ios-instalar':'sem-suporte';
  else if(Notification.permission==='denied') novo='negado';
  else{
    const sub=Notification.permission==='granted'?await inscricaoAtual():null;
    novo=sub?'ligado':'desligado';
    if(sub&&aoEntrar&&!pushReinscrito&&authToken){
      pushReinscrito=true;
      try{ await api('/push/inscricao',{method:'POST',body:JSON.stringify(sub.toJSON())}); }catch(e){}
    }
  }
  if(novo!==pushEstado){ pushEstado=novo; if(state.me&&['painel','perfil'].indexOf(view)>-1) render(); }
}
async function ativarPush(){
  if(pushOcupado) return;
  if(pushEstado==='ios-instalar'){ comoInstalar(); return; }
  if(!pushSuportado()){ toast('Este navegador não recebe notificações.','warn'); return; }
  pushOcupado=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ await atualizarPush(); toast(perm==='denied'?'As notificações ficaram bloqueadas. Veja no seu perfil como liberar.':'Tudo bem, dá pra ativar depois no seu perfil.','warn'); return; }
    const reg=await registroSw(); if(!reg) throw new Error('Não consegui preparar as notificações neste navegador.');
    const {chave}=await api('/push/chave');
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:chaveParaBytes(chave)});
    await api('/push/inscricao',{method:'POST',body:JSON.stringify(sub.toJSON())});
    pushReinscrito=true;
    try{ localStorage.setItem(PUSH_BANNER_KEY,'1'); }catch(e){}
    pushEstado='ligado'; render(); toast('Notificações ativadas! 🙌');
  }catch(e){ toast(e.message||'Não foi possível ativar as notificações.','warn'); }
  finally{ pushOcupado=false; }
}
async function desativarPush(){
  const sub=await inscricaoAtual();
  if(sub){
    try{ await api('/push/desinscrever',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})}); }catch(e){}
    try{ await sub.unsubscribe(); }catch(e){}
  }
  pushEstado='desligado'; render(); toast('Notificações desativadas neste aparelho.');
}
async function testePush(){
  try{ await api('/push/teste',{method:'POST'}); toast('Enviado! Deve chegar em alguns segundos.'); }
  catch(e){ toast(e.message,'warn'); }
}
/** Ao sair da conta, este aparelho para de receber as notificações dessa pessoa. */
function sairDoPush(token){
  inscricaoAtual().then(sub=>{
    if(!sub) return;
    if(token) fetch(API_BASE+'/push/desinscrever',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});
    sub.unsubscribe().catch(()=>{});
    pushEstado='desligado'; pushReinscrito=false;
  }).catch(()=>{});
}

  }catch(e){
    toast(e.message,'warn');
    // Provavelmente outra pessoa pegou a vaga antes: recarrega pra mostrar quem está nela agora.
    await recarregarEventos();
  }
}
async function recarregarEventos(){
  try{
    state.events=(await api('/eventos')).map(eventoFromApi);
    invalidarEscalaCompleta();
    if(view==='escalas'&&!editSlotKey&&!addSlotEventoId&&!escalarKey&&$('#overlay').hidden) render();
  }catch(_){}
}
// Histórico da escala do setor (só coordenação): carrega ao abrir, recarrega depois de cada mudança.
let historico={setor:null,itens:null,aberto:false,carregando:false};
function historicoHtml(){
  const aberto=historico.aberto&&historico.setor===currentSetor;
  let corpo='';
  if(aberto) corpo=historico.carregando?'<div class="empty">Carregando...</div>'
    :!historico.itens||!historico.itens.length?'<div class="empty">Nenhuma alteração registrada ainda.</div>'
    :'<div class="hist-lista">'+historico.itens.slice(0,60).map(h=>'<div class="hist-item"><span>'+esc(h.texto)+'</span><small>'+esc(quandoFoi(h.criadoEm))+'</small></div>').join('')+'</div>';
  return '<div class="hist"><button type="button" class="btn small" data-action="toggleHistorico">'+(aberto?'Esconder histórico':'Histórico de alterações')+'</button>'+
    (aberto?'<p class="note" style="margin:8px 0">Só a coordenação vê: quem escalou, trocou, tirou ou publicou.</p>'+corpo:'')+'</div>';
}
async function toggleHistorico(){
  if(historico.aberto&&historico.setor===currentSetor){ historico.aberto=false; render(); return; }
  historico={setor:currentSetor,itens:null,aberto:true,carregando:true}; render();
  await carregarHistorico();
}
async function carregarHistorico(){
  if(!historico.aberto) return;
  try{ historico.itens=await api('/escalas/historico?setor='+historico.setor.toUpperCase()); }
  catch(e){ historico.itens=[]; toast(e.message,'warn'); }
  historico.carregando=false;
  if(view==='escalas') render();
}
async function acaoEscala(evId,caminho,metodo,corpo,msg){
  const ev=state.events.find(x=>x.id===evId);
  try{
    const dto=await api('/eventos/'+evId+'/slots/'+caminho,{method:metodo,body:corpo?JSON.stringify(corpo):undefined});
    Object.assign(ev,eventoFromApi(dto)); invalidarEscalaCompleta(); escalarKey=null; render(); if(msg) toast(msg);
    carregarHistorico();
  }catch(e){ toast(e.message,'warn'); escalarKey=null; await recarregarEventos(); }
}
async function publicarMes(mes,publicar){
  const nome=nomeMes(mes);
  if(publicar&&!confirm('Publicar a escala de '+SETOR_NAME[currentSetor]+' de '+nome+'? A equipe passa a ver quem foi escalado.')) return;
  try{
    await api('/escalas/'+(publicar?'publicar':'despublicar')+'?mes='+mes+'&setor='+currentSetor.toUpperCase(),{method:'POST'});
    await recarregarEventos(); render();
    toast(publicar?'Escala de '+nome+' publicada!':'Escala de '+nome+' voltou pra montagem.');
  }catch(e){ toast(e.message,'warn'); }
}
async function leaveSlot(evId,slotId){
  const ev=state.events.find(x=>x.id===evId);
  try{
    const dto=await api('/eventos/'+evId+'/slots/'+slotId+'/desinscrever',{method:'POST'});
    Object.assign(ev,eventoFromApi(dto));
    invalidarEscalaCompleta();
    render(); toast('Vaga liberada.');
  }catch(e){ toast(e.message,'warn'); }
}

/* =====================================================================
   10. INICIALIZAÇÃO
   ===================================================================== */
/* Atualizações com gente usando: o login continua valendo depois do deploy (o token não depende
   do servidor que o emitiu), mas a página aberta fica com o front antigo até recarregar. Então o
   front confere /api/versao de tempos em tempos e, quando muda, mostra um aviso pra atualizar
   (sem recarregar à força, pra ninguém perder o que estava digitando). */
let versaoCarregada=null;
async function conferirVersao(){
  try{
    const r=await fetch(API_BASE+'/versao',{cache:'no-store'});
    if(!r.ok) return;
    const v=(await r.json()).versao;
    if(!versaoCarregada){ versaoCarregada=v; return; }
    if(v!==versaoCarregada) $('#updateBanner').hidden=false;
  }catch(_){}
}
setInterval(conferirVersao,2*60*1000);
setInterval(()=>{ if(authToken&&state.me&&document.visibilityState==='visible') carregarAvisos(); },2*60*1000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  conferirVersao();
  // Voltou pra aba: traz a escala atualizada (outras pessoas podem ter se inscrito nesse meio tempo).
  if(authToken&&state.me){ recarregarEventos(); carregarAvisos(); }
});

async function init(){
  conferirVersao();
  registroSw();
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); instalarPrompt=e; if(state.me&&view==='perfil') render(); });
  window.addEventListener('appinstalled',()=>{ instalarPrompt=null; if(state.me) render(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.tipo==='abrirAvisos'&&state.me) abrirAvisos(); });
  let abrirAvisosAoEntrar=false;
  try{
    const p=new URLSearchParams(window.location.search);
    if(p.get('abrir')==='avisos'){ abrirAvisosAoEntrar=true; history.replaceState(null,'',window.location.pathname); }
  }catch(e){}
  try{
    const params=new URLSearchParams(window.location.search);
    const tk=params.get('resetToken');
    if(tk){
      resetToken=tk; authMode='redefinir'; authError=''; authOk='';
      history.replaceState(null,'',window.location.pathname);
      render();
      return;
    }
  }catch(e){}
  if(authToken){
    const claims=decodeJwt(authToken);
    if(claims&&claims.exp&&claims.exp*1000>Date.now()&&claims.id){
      try{ await carregarTudo(claims.id); render(); if(abrirAvisosAoEntrar) abrirAvisos(); return; }catch(e){}
    }
    authToken=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
  }
  render();
}
init();
})();
