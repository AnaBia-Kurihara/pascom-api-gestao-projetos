<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pascom Fátima – Organização da equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4FA; --panel:#FFFFFF; --tint:#E8EDF7; --ink:#14203D; --ink2:#465273; --ink3:#77829F; --line:#DBE2F0;
  --brand:#2B57B8; --brand-ink:#FFFFFF; --deep:#14306B; --deep-ink:#EAF0FF;
  --gold:#C79A2E; --gold-soft:#F8EED2; --gold-ink:#6E500B;
  --rose:#B4404A; --rose-soft:#FAE3E5; --green:#2C7A57; --green-soft:#DCF0E5;
  --f-reels:#7A4BC4; --f-carrossel:#2B57B8; --f-stories:#B85F30; --f-foto:#2C7A57;
  --side:#0F2456; --side-ink:#C9D5F2;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --panel:#161E36; --tint:#1D2745; --ink:#EBF0FF; --ink2:#B3BDDA; --ink3:#8792B2; --line:#28335A;
    --brand:#7FA4F2; --brand-ink:#0E1424; --deep:#1A2C5E; --deep-ink:#EAF0FF;
    --gold:#E2BA5C; --gold-soft:#3A311A; --gold-ink:#F0D48A;
    --rose:#F08C94; --rose-soft:#442228; --green:#6FCBA0; --green-soft:#1C3A2E;
    --f-reels:#B394F0; --f-carrossel:#7FA4F2; --f-stories:#F0A070; --f-foto:#6FCBA0;
    --side:#0A1020; --side-ink:#AEBBDD;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#161E36; --tint:#1D2745; --ink:#EBF0FF; --ink2:#B3BDDA; --ink3:#8792B2; --line:#28335A;
  --brand:#7FA4F2; --brand-ink:#0E1424; --deep:#1A2C5E; --deep-ink:#EAF0FF;
  --gold:#E2BA5C; --gold-soft:#3A311A; --gold-ink:#F0D48A;
  --rose:#F08C94; --rose-soft:#442228; --green:#6FCBA0; --green-soft:#1C3A2E;
  --f-reels:#B394F0; --f-carrossel:#7FA4F2; --f-stories:#F0A070; --f-foto:#6FCBA0;
  --side:#0A1020; --side-ink:#AEBBDD;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
p{margin:0}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.app[hidden]{display:none}
#authScreen{height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:20px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;color:#fff;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--side-ink);opacity:.85;line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--side-ink);text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.setor-switch{position:relative;margin:2px 0 16px}
.setor-btn{width:100%;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:9px 10px;color:#fff;text-align:left}
.setor-btn:hover{background:rgba(255,255,255,.1)}
.setor-btn .ico{width:30px;height:30px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none;color:#1B1400}
.setor-btn .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setor-btn .tx{flex:1;min-width:0}
.setor-btn .tx small{display:block;font-size:10.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em}
.setor-btn .tx b{display:block;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setor-btn .chev{width:14px;height:14px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2;flex:none;transition:transform .15s}
.setor-btn.open .chev{transform:rotate(180deg)}
.setor-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 16px 36px rgba(0,0,0,.35);padding:6px;z-index:30}
.setor-menu button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:8px 9px;border-radius:8px;background:none;border:0;color:var(--ink);font-size:13px}
.setor-menu button:hover{background:var(--tint)}
.setor-menu button.active{background:var(--tint);font-weight:600}
.setor-menu .ico{width:24px;height:24px;border-radius:7px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.setor-menu .ico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setor-menu .check{margin-left:auto;width:14px;height:14px;stroke:var(--brand);fill:none;stroke-width:2.4;flex:none}
.side-foot{margin-top:auto;padding:14px 8px 0;font-size:12px;line-height:1.4;color:var(--side-ink)}
.side-foot button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.main{overflow-y:auto;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 32px 8px}
.top h1{font-size:28px}
.top p{color:var(--ink2);margin-top:4px;max-width:60ch}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.who select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.view{padding:16px 32px 40px}

/* ---------- Botões e pequenos elementos ---------- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:#1B1400;border-color:transparent;font-weight:600}
.btn.light{background:transparent;color:var(--deep-ink);border-color:rgba(255,255,255,.35)}
.btn.danger{color:var(--rose);border-color:var(--rose-soft);background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.lg{width:44px;height:44px;font-size:15px}
.av-empty{background:transparent;border:1.5px dashed var(--ink3);color:var(--ink3)}
.fmt{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.f-reels{--fc:var(--f-reels)} .f-carrossel{--fc:var(--f-carrossel)} .f-stories{--fc:var(--f-stories)} .f-foto{--fc:var(--f-foto)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--ink2);font-weight:500;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink)}
.pill.bad{background:var(--rose-soft);color:var(--rose)}
.muted{color:var(--ink3)}
.late{color:var(--rose);font-weight:600}
.empty{color:var(--ink3);padding:14px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;font-size:14px}

/* ---------- Painel ---------- */
.hero{background:var(--deep);color:var(--deep-ink);border-radius:16px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"13";position:absolute;right:18px;top:-38px;font-family:var(--serif);font-size:190px;line-height:1;color:rgba(255,255,255,.06);pointer-events:none}
.hero h2{font-size:26px;max-width:22ch}
.hero p{margin-top:8px;opacity:.85}
.hero-act{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.strip{display:flex;flex-wrap:wrap;margin:22px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{flex:1 1 130px;padding:14px 18px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.strip span{color:var(--ink2);font-size:13px}
.strip .alert b{color:var(--rose)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:24px}
.panel h2{font-size:18px;margin-bottom:10px}
.panel+.panel{margin-top:26px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover .rt{text-decoration:underline}
.row .rt{flex:1;min-width:0;font-weight:500}
.dbadge{width:46px;flex:none;text-align:center;line-height:1.1}
.dbadge b{display:block;font-family:var(--serif);font-weight:400;font-size:20px}
.dbadge span{font-size:12px;color:var(--ink3)}
.load{display:grid;grid-template-columns:110px 1fr 24px;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.hi{background:var(--rose)}
.note{font-size:13px;color:var(--ink3);margin-top:8px}

/* ---------- Quadro ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.filters input{min-width:220px}
.filters .tip{color:var(--ink3);font-size:13px;flex:1 1 260px}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.kcol{flex:0 0 262px;background:var(--tint);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.kcol-h h3{font-size:15px}
.kcol-h .cnt{font-size:12px;color:var(--ink2);margin-left:6px;font-family:var(--sans)}
.kcol-h button{border:0;background:none;color:var(--ink2);font-size:20px;line-height:1;border-radius:6px;width:28px;height:28px}
.kcol-h button:hover{background:var(--line)}
.kbody{display:flex;flex-direction:column;gap:8px;min-height:64px;border-radius:8px;transition:background .12s}
.kbody.over{background:color-mix(in srgb,var(--brand) 14%,transparent);outline:2px dashed var(--brand);outline-offset:-2px}
.kcard{background:var(--panel);border-radius:9px;padding:10px 11px;border-left:4px solid var(--fc);cursor:grab;box-shadow:0 1px 0 rgba(20,32,61,.08)}
.kcard.dragging{opacity:.45}
.kcard h4{font-family:var(--sans);font-weight:600;font-size:14px;line-height:1.35;margin:7px 0 8px}
.kc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kc-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.kc-meta .sp{flex:1}
.kc-mv{display:flex;gap:4px}
.kc-mv button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:24px;font-size:11px;color:var(--ink2);padding:0}
.kc-mv button:hover:not([disabled]){border-color:var(--ink3)}
.kc-mv button[disabled]{opacity:.3;cursor:default}

/* ---------- Calendário ---------- */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h2{font-size:22px;min-width:190px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-left:auto;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel);min-width:720px}
.cal .dow{padding:8px;font-size:13px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--tint)}
.cell{min-height:116px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:hover{background:var(--bg)}
.cell.out{background:var(--tint);opacity:.5;cursor:default}
.cell .dn{font-size:13px;font-weight:600;color:var(--ink2)}
.cell.today .dn{background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:1px 7px}
.lit{font-size:11px;line-height:1.25;color:var(--gold-ink);background:var(--gold-soft);border-radius:4px;padding:1px 5px}
.chip{display:block;width:100%;text-align:left;font-size:12px;line-height:1.3;padding:2px 6px;border-radius:4px;border:0;color:var(--fc);background:color-mix(in srgb,var(--fc) 15%,transparent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:color-mix(in srgb,var(--fc) 28%,transparent)}
.evt{font-size:11px;color:var(--ink2);padding:0 4px}
.evt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:5px}
.cal-list{display:none}
.lrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow .ld{width:44px;text-align:center;flex:none;line-height:1.1}
.lrow .ld b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.lrow .ld span{font-size:12px;color:var(--ink3)}
.lrow .lc{flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}

/* ---------- Ideias, escalas, equipe, materiais ---------- */
.form-inline{display:grid;grid-template-columns:1.2fr 2fr 1fr auto;gap:10px;align-items:end;margin-bottom:20px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.fld[hidden]{display:none}
.fld input,.fld select,.fld textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px}
.fld textarea{resize:vertical}
.idea{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.idea-actions{display:flex;gap:6px;align-items:center}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 0;width:58px}
.vote b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1}
.vote span{font-size:11px;color:var(--ink3)}
.vote.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.idea h4{font-family:var(--sans);font-weight:600;font-size:16px}
.idea p{color:var(--ink2);font-size:14px;margin-top:2px}
.idea .by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.ev{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ev-h{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ev-h h3{font-size:17px}
.ev-h small{color:var(--ink2);display:block}
.ev-h-actions{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.ev.big .ev-h{background:var(--gold-soft)}
.slot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .sl{width:110px;font-weight:600;font-size:14px}
.slot .sw{flex:1;font-size:14px;display:flex;align-items:center;gap:8px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 26px}
.mem{display:flex;gap:14px}
.mem h3{font-size:17px}
.mem .fn{color:var(--ink2);font-size:14px}
.mem ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 28px;margin-bottom:26px}
.mat{display:block;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;width:100%}
.mat:hover h4{text-decoration:underline}
.mat h4{font-family:var(--sans);font-weight:600;font-size:15px}
.mat p{color:var(--ink2);font-size:13px}
.tpl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tpl pre{margin:8px 0 12px;white-space:pre-wrap;font-family:var(--sans);font-size:14px;color:var(--ink2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.checklist li{margin-bottom:8px}
.checklist{padding-left:20px;margin:8px 0 0;color:var(--ink2);font-size:14px}
.checklist b{color:var(--ink)}

/* ---------- Modal e toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,14,32,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:50}
.overlay[hidden]{display:none}
.modal{background:var(--panel);width:min(640px,100%);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:20px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--ink2);width:34px;height:34px;border-radius:8px}
.x:hover{background:var(--tint)}
.m-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fset{border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;margin:0}
.fset legend{padding:0 6px;font-size:13px;color:var(--ink2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
.chk small{display:block;color:var(--ink3);font-size:12px}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cm b{font-weight:600}
.cm span{color:var(--ink3);font-size:12px;margin-left:6px}
.cm-new{display:flex;gap:8px;margin-top:8px}
.cm-new input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.m-foot .sp{flex:1}

const addDays=n=>{const t=new Date();return iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+n));};

async function api(path, options){
  options=options||{};
  const headers=Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(authToken) headers['Authorization']='Bearer '+authToken;
  let res;
  try{
    res=await fetch(API_BASE+path, Object.assign({}, options, {headers:headers}));
  }catch(netErr){
    throw new Error('Não foi possível conectar ao servidor em '+API_BASE+'. A API está rodando?');
  }
  const isAuthEndpoint = path.indexOf('/usuarios/login')===0 || path.indexOf('/usuarios/cadastro')===0;
  if(res.status===401 && !isAuthEndpoint){
    authToken=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
    state={cards:[],ideas:[],events:[],me:null};
    authMode='login'; authError='Sessão expirada. Faça login novamente.';
    renderAuth();
    throw new Error('Sessão expirada.');
  }
  const text=await res.text();
  let body=null;
  if(text){ try{ body=JSON.parse(text); }catch(e){} }
  if(!res.ok){
    const msg=(body && (body.erro || (body.erros && Object.values(body.erros).join(', ')))) || ('Erro '+res.status);
    throw new Error(msg);
  }
  return body;
}

function decodeJwt(token){
  try{
    const payload=token.split('.')[1];
    const norm=payload.replace(/-/g,'+').replace(/_/g,'/');
    const json=decodeURIComponent(atob(norm).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

async function carregarTudo(meId){
  const [usuarios, cartoes, ideias, eventos]=await Promise.all([
    api('/usuarios'), api('/cartoes'), api('/ideias'), api('/eventos')
  ]);
  MEMBERS=usuarios.map(memberFromApi);

async function doLogin(){
  const email=$('#au-email').value.trim(), senha=$('#au-senha').value;
  if(!email||!senha){ authError='Preencha e-mail e senha.'; renderAuth(); return; }
  try{
    const data=await api('/usuarios/login',{method:'POST',body:JSON.stringify({email:email,senha:senha})});
    authToken=data.token; try{localStorage.setItem(TOKEN_KEY,authToken);}catch(e){}

async function doCadastro(){
  const nome=$('#au-nome').value.trim(), email=$('#au-email').value.trim(), senha=$('#au-senha').value;
  const funcao=$('#au-funcao').value.trim();

async function entrarComResultadoGoogle(login){
  authToken=login.token; try{localStorage.setItem(TOKEN_KEY,authToken);}catch(e){}

  view='painel'; authError=''; authOk=''; pendingGoogle=null; render();

async function onGoogleCredential(resp){
  try{
    const dto=await api('/usuarios/google',{method:'POST',body:JSON.stringify({idToken:resp.credential})});
    if(dto.precisaCompletarCadastro){
      pendingGoogle={idToken:resp.credential,nome:dto.nome,email:dto.email};
      authMode='completarGoogle'; authError=''; authOk=''; renderAuth();
    }else{
      await entrarComResultadoGoogle(dto.login);
    }
  }catch(e){ authError=e.message||'Não foi possível entrar com o Google.'; renderAuth(); }
}
async function doCompletarGoogle(){
  if(!pendingGoogle){ authMode='login'; renderAuth(); return; }
  const role=$('#au-role').value, setor=$('#au-setor').value;
  if(role!=='coordenador_geral'&&!setor){ authError='Selecione o setor.'; renderAuth(); return; }
  try{
    const dto=await api('/usuarios/google',{method:'POST',body:JSON.stringify({
      idToken:pendingGoogle.idToken, role:role.toUpperCase(),
      setor: role==='coordenador_geral' ? null : setor.toUpperCase(),
      funcao: $('#au-funcao').value.trim()||null
    })});
    await entrarComResultadoGoogle(dto.login);

}
function renderGoogleButton(containerId,tentativa){
  tentativa=tentativa||0;
  try{
    if(!window.google||!google.accounts||!google.accounts.id){
      // O script do Google carrega async e pode não estar pronto ainda no primeiro render —
      // tenta de novo por uns segundos antes de desistir (em vez de nunca mostrar o botão).
      if(tentativa<20) setTimeout(()=>renderGoogleButton(containerId,tentativa+1),250);
      return;
    }
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:onGoogleCredential});
    const el=document.getElementById(containerId);
    if(el) google.accounts.id.renderButton(el,{theme:'outline',size:'large',width:320,text:'continue_with',locale:'pt-BR'});
  }catch(e){}
}

}

const fmtChip=c=>'<span class="fmt f-'+c.fmt+'">'+FORMATS[c.fmt]+'</span>';
function stagePill(c){
  const k=c.stage==='publicado'?'ok':(c.stage==='agendado'?'ok':(c.stage==='revisao'?'warn':''));
  return '<span class="pill '+k+'">'+stageName(c.stage)+'</span>';

function dueText(c){
  if(!c.due) return '<span class="muted">sem prazo</span>';
  const d=diff(c.due);
  if(c.stage==='publicado') return '<span class="muted">entregue</span>';
  if(isLate(c)) return '<span class="late">atrasado '+Math.abs(d)+(Math.abs(d)===1?' dia':' dias')+'</span>';
  if(d===0) return '<b>prazo hoje</b>';
  return '<span>prazo '+fmtShort(c.due)+'</span>';
}

function missaCard(m){
  const i=datashowStageIdx(m.etapa);
  const montagemMem=m.montagem?mem(m.montagem):null;

  const dataFmt=m.data?fmtShort(m.data):'sem data';
  return '<article class="kcard" data-id="'+m.id+'" data-action="openDatashow">'+
    '<div class="kc-top"><span class="pill">'+esc(dataFmt)+(m.horario?' · '+esc(m.horario):'')+'</span></div>'+
    '<h4>'+esc(m.local||'Missa')+'</h4>'+
    '<div class="kc-meta"><span class="note">Monta:</span>'+(montagemMem?avatar(m.montagem)+esc(montagemMem.nome):'<span class="muted">ninguém ainda</span>')+'</div>'+

/* ---------- Calendário ---------- */
function viewCalendario(){
  const y=cal.y,m=cal.m;
  const first=new Date(y,m,1), start=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const title=cap(first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const byDate={},evDate={};
  visibleCards().forEach(c=>{if(c.pub)(byDate[c.pub]=byDate[c.pub]||[]).push(c);});
  state.events.forEach(e=>{(evDate[e.date]=evDate[e.date]||[]).push(e);});
  let cells='',list='';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d=>{cells+='<div class="dow">'+d+'</div>';});
  for(let i=0;i<start;i++) cells+='<div class="cell out"></div>';
  for(let d=1;d<=dim;d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d), cs=byDate[s]||[], es=evDate[s]||[], ls=litLabels(s);
    const chips=cs.map(c=>'<button class="chip f-'+c.fmt+'" data-action="open" data-id="'+c.id+'" title="'+esc(c.title)+'">'+esc(c.title)+'</button>').join('');
    cells+='<div class="cell'+(s===TODAY?' today':'')+'" data-action="newOn" data-date="'+s+'"><div><span class="dn">'+d+'</span></div>'+ls.map(l=>'<div class="lit">'+esc(l)+'</div>').join('')+chips+es.map(e=>'<div class="evt">'+esc(e.title)+'</div>').join('')+'</div>';
    if(cs.length||es.length||ls.length){
      const wd=new Date(y,m,d).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
      list+='<div class="lrow"><div class="ld"><b>'+d+'</b><span>'+wd+'</span></div><div class="lc">'+ls.map(l=>'<span class="lit">'+esc(l)+'</span>').join('')+cs.map(c=>'<button class="chip f-'+c.fmt+'" style="width:auto;max-width:100%" data-action="open" data-id="'+c.id+'">'+esc(c.title)+'</button>').join('')+es.map(e=>'<span class="evt">'+esc(e.title)+' às '+e.time+'</span>').join('')+'<button class="btn small" data-action="newOn" data-date="'+s+'">Planejar neste dia</button></div></div>';
    }
  }
  const tail=(7-(start+dim)%7)%7;
  for(let i=0;i<tail;i++) cells+='<div class="cell out"></div>';
  return '<div class="cal-bar"><button class="btn small" data-action="calPrev" aria-label="Mês anterior">◀</button><h2>'+title+'</h2><button class="btn small" data-action="calNext" aria-label="Próximo mês">▶</button><button class="btn small" data-action="calToday">Hoje</button>'+
    '<div class="legend"><span><i style="background:var(--f-reels)"></i>Reels</span><span><i style="background:var(--f-carrossel)"></i>Carrossel</span><span><i style="background:var(--f-stories)"></i>Stories</span><span><i style="background:var(--f-foto)"></i>Foto</span><span><i style="background:var(--gold)"></i>Cobertura</span></div></div>'+
    '<div class="cal-wrap"><div class="cal">'+cells+'</div></div>'+
    '<div class="cal-list">'+(list||'<div class="empty">Nada neste mês.</div>')+'</div>'+
    '<p class="note">Clique em um dia para planejar um conteúdo nessa data. Datas litúrgicas são exemplos e podem ser ajustadas à programação do santuário.</p>';
}

function dashboardStatHtml(dados){

function dashboardPostHtml(p,maxCurtidas){
  const pct=p.curtidas?Math.max(4,Math.round((p.curtidas/maxCurtidas)*100)):0;

function viewDashboard(){
  const tabs='<div class="dash-tabs">'+DASH_PERIODOS.map(t=>
    '<button type="button" class="dash-tab'+(dashboardPeriodo===t[0]?' active':'')+'" data-action="dashPeriodo" data-periodo="'+t[0]+'">'+t[1]+'</button>'
  ).join('')+'<button type="button" class="btn small" style="margin-left:auto" data-action="sincronizarInstagram"'+(dashboardSincronizando?' disabled':'')+'>'+(dashboardSincronizando?'Sincronizando...':'Sincronizar agora')+'</button></div>';

  const dados=dashboardCache[dashboardPeriodo];
  const corpoDash=!dados
    ? '<div class="empty" style="margin-top:16px">'+(dashboardLoading?'Carregando...':'Sem dados ainda.')+'</div>'
    : (()=>{
        const maxCurtidas=Math.max(1,...dados.posts.map(p=>p.curtidas||0));
        const lista=dados.posts.length
          ? '<div class="rows">'+dados.posts.map(p=>dashboardPostHtml(p,maxCurtidas)).join('')+'</div>'
          : '<div class="empty">Nenhum post detectado nesse período. Clique em "Sincronizar agora" ou confira se o Instagram está conectado.</div>';
        return dashboardStatHtml(dados)+'<section class="panel" style="margin-top:18px"><h2>Posts do período</h2>'+lista+'</section>';
      })();

  const metas=metasCache;
  const corpoMetas='<section class="panel" style="margin-top:18px"><h2>Metas de crescimento</h2>'+

  return tabs+corpoDash+corpoMetas;

async function salvarMeta(){
  const titulo=$('#mt-titulo').value.trim();
  const metrica=$('#mt-metrica').value;
  const valor=Number($('#mt-valor').value);
  const dataAlvo=$('#mt-data').value||null;
  if(!titulo){toast('Dê um título à meta.','warn');return;}
  if(!valor||valor<=0){toast('Defina um valor alvo maior que zero.','warn');return;}
  try{
    await api('/instagram/metas',{method:'POST',body:JSON.stringify({titulo:titulo,metrica:metrica,valorAlvo:valor,dataAlvo:dataAlvo})});
    metaFormOpen=false;
    toast('Meta criada!');
    await carregarMetas();
  }catch(e){ toast(e.message,'warn'); }
}
async function excluirMeta(id){
  try{
    await api('/instagram/metas/'+id,{method:'DELETE'});
    metasCache=metasCache.filter(m=>String(m.id)!==String(id));
    render();
    toast('Meta excluída.');
  }catch(e){ toast(e.message,'warn'); }
}

function viewEscalas(){
  const evs=state.events.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const podeGerir=isCoordenadorGeral();
  const acoes=podeGerir?'<div class="filters" style="margin-bottom:16px"><button class="btn primary" data-action="novaEscala">+ Nova escala</button><button class="btn" data-action="gerarEscalasMes">Gerar domingos do mês</button><span class="tip">"Gerar domingos do mês" cria (sem duplicar) uma Missa das 10h pra cada domingo, já com Foto/Vídeo/Stories.</span></div>':'';
  if(!evs.length) return acoes+'<div class="empty">Nenhum evento cadastrado ainda.'+(podeGerir?' Crie uma escala ou gere os domingos do mês acima.':' Fale com a Coordenação.')+'</div>';
  return acoes+'<div class="evs">'+evs.map(e=>{
    const open=e.slots.filter(s=>!s.who).length, d=parse(e.date);
    const joined=e.slots.some(s=>s.who===state.me);
    return '<article class="ev'+(e.big?' big':'')+'"><div class="ev-h"><div class="dbadge"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div><div style="flex:1;min-width:120px"><h3>'+esc(e.title)+'</h3><small>'+cap(d.toLocaleDateString('pt-BR',{weekday:'long'}))+', '+e.time+' no '+esc(e.place)+'</small></div><div class="ev-h-actions"><span class="pill '+(open?'warn':'ok')+'">'+(open?open+(open>1?' vagas':' vaga'):'Completa')+'</span>'+
      (podeGerir?'<button class="btn small danger" data-action="excluirEvento" data-id="'+e.id+'" title="Excluir escala">Excluir</button>':'')+'</div></div>'+
      e.slots.map(s=>{
        let act='';
        if(!s.who) act=joined?'':'<button class="btn small primary" data-action="join" data-ev="'+e.id+'" data-slot="'+s.id+'">Eu vou</button>';
        else if(s.who===state.me||isApprover()) act='<button class="btn small" data-action="leave" data-ev="'+e.id+'" data-slot="'+s.id+'">'+(s.who===state.me?'Sair':'Liberar')+'</button>';
        const whoMem=s.who?mem(s.who):null;
        return '<div class="slot"><span class="sl">'+esc(s.label)+'</span><span class="sw">'+(whoMem?avatar(s.who)+esc(whoMem.nome):'<span class="muted">Vaga aberta</span>')+'</span>'+act+'</div>';
      }).join('')+
      (podeGerir?'<button type="button" class="btn small" style="margin-top:8px" data-action="toggleAddSlot" data-ev="'+e.id+'">'+(addSlotEventoId===e.id?'Cancelar':'+ função pra essa missa')+'</button>'+addSlotFormHtml(e.id):'')+
    '</article>';
  }).join('')+'</div>';
}

function abrirNovaEscala(){
  escalaFormSlots=[{rotulo:'Foto',tipo:'FOTO'},{rotulo:'Vídeo',tipo:'VIDEO'},{rotulo:'Stories ao vivo',tipo:'STORIES_AO_VIVO'}];
  const o=$('#overlay'); o.innerHTML=escalaModal(); o.hidden=false;
}
function reabrirEscalaModal(){ $('#overlay').innerHTML=escalaModal(); }
async function salvarEscala(){
  sincronizarSlotFormDoDOM();
  const titulo=$('#es-titulo').value.trim();
  const data=$('#es-data').value;
  const horario=$('#es-horario').value;
  const local=$('#es-local').value.trim();
  const grande=$('#es-grande').checked;
  if(!titulo||!data||!horario||!local){toast('Preencha título, data, horário e local.','warn');return;}
  const slots=escalaFormSlots.filter(s=>s.rotulo.trim());
  try{
    const dto=await api('/eventos',{method:'POST',body:JSON.stringify({
      titulo:titulo,data:data,horario:horario,local:local,eventoGrande:grande,
      slots:slots.map(s=>({rotulo:s.rotulo.trim(),tipo:s.tipo}))
    })});
    state.events.push(eventoFromApi(dto));
    closeModal(); render(); toast('Escala criada!');
  }catch(e){ toast(e.message,'warn'); }
}
async function gerarEscalasMes(){
  try{
    const r=await api('/eventos/gerar-escalas-mes',{method:'POST'});
    toast(r.eventosCriados>0?r.eventosCriados+' escala(s) de domingo criada(s)!':'Já estava tudo criado esse mês.');
    const eventos=await api('/eventos');
    state.events=eventos.map(eventoFromApi);
    render();
  }catch(e){ toast(e.message,'warn'); }
}
async function salvarSlotExistente(eventoId){
  const rotulo=$('#as-rotulo').value.trim();
  const tipo=$('#as-tipo').value;
  if(!rotulo){toast('Dê um nome pra função.','warn');return;}
  try{
    const dto=await api('/eventos/'+eventoId+'/slots',{method:'POST',body:JSON.stringify({rotulo:rotulo,tipo:tipo})});
    Object.assign(state.events.find(x=>x.id===eventoId),eventoFromApi(dto));
    addSlotEventoId=null;
    render(); toast('Função adicionada!');
  }catch(e){ toast(e.message,'warn'); }
}

let chatLog=[]; // {papel:'usuario'|'agente', texto, acoes}

  const isUser=msg.papel==='usuario';
  const av=isUser?avatar(state.me):'<span class="av"><svg viewBox="0 0 24 24">'+ICONS.spark+'</svg></span>';
  const acoesHtml=(msg.acoes&&msg.acoes.length)?'<div class="chat-acoes">'+msg.acoes.map(a=>'<div class="chat-acao"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>'+esc(a)+'</div>').join('')+'</div>':'';
  return '<div class="msg '+(isUser?'user':'agente')+'">'+av+'<div class="msg-col"><div class="bubble">'+esc(msg.texto)+'</div>'+acoesHtml+'</div></div>';

function chatBarHtml(){
  return '<div class="chat-bar"><div class="chat-inputwrap">'+
    '<textarea id="chat-input" rows="1" placeholder="Escreva pro assistente... (ex.: crie um evento pro bazar dia 15 às 14h)"'+(chatLoading?' disabled':'')+'></textarea>'+
    '<button class="chat-send" type="button" data-action="chatEnviar"'+(chatLoading?' disabled':'')+' aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'+

      '<h3>No que posso ajudar, '+esc(greetName())+'?</h3>'+

      '</div>'+chatBarHtml()+'</div>';
  }
  const typingHtml=chatLoading?'<div class="msg agente"><span class="av"><svg viewBox="0 0 24 24">'+ICONS.spark+'</svg></span><div class="msg-col"><div class="bubble"><span class="chat-typing"><i></i><i></i><i></i></span></div></div></div>':'';

function scrollChatToBottom(){
  setTimeout(()=>{const m=$('.main'); if(m) m.scrollTop=m.scrollHeight;},20);
}
async function sendChatMessage(texto){
  texto=(texto||'').trim();
  if(!texto||chatLoading) return;
  const historico=chatLog.map(m=>({papel:m.papel,texto:m.texto}));
  chatLog.push({papel:'usuario',texto:texto});
  chatLoading=true;
  render(); scrollChatToBottom();
  try{
    const dto=await api('/agente/mensagem',{method:'POST',body:JSON.stringify({mensagem:texto,historico:historico,setor:currentSetor.toUpperCase()})});
    chatLog.push({papel:'agente',texto:dto.resposta,acoes:dto.acoes||[]});
  }catch(e){
    chatLog.push({papel:'agente',texto:'Deu ruim aqui: '+(e.message||'não consegui responder agora.'),acoes:[]});
  }
  chatLoading=false;
  render(); scrollChatToBottom();
}

function closeModal(){const o=$('#overlay');o.hidden=true;o.innerHTML='';modalId=null;}
function openDatashow(id){
  modalId=id||null;
  const m=id?datashowCache.find(x=>x.id===id):{id:null,data:'',horario:'',local:'Igreja Matriz',etapa:'aguardando_musicas',musicas:'',avisos:'',montagem:null,passar:null};
  const o=$('#overlay'); o.innerHTML=datashowModal(m); o.hidden=false;
}
async function saveDatashow(){
  const data={
    data:$('#dm-data').value, horario:$('#dm-horario').value, local:$('#dm-local').value.trim(),
    musicas:$('#dm-musicas').value.trim(), avisos:$('#dm-avisos').value.trim(),
    montagem:$('#dm-montagem').value||null, passar:$('#dm-passar').value||null
  };
  const etapaEscolhida=$('#dm-etapa').value;
  if(!data.data){toast('Escolha a data da missa.','warn');return;}
  try{
    let atualizado;
    if(modalId){
      const dto=await api('/datashow/missas/'+modalId,{method:'PUT',body:JSON.stringify(missaToApi(data))});
      atualizado=missaFromApi(dto);
      if(etapaEscolhida!==atualizado.etapa){
        const dto2=await api('/datashow/missas/'+modalId+'/etapa?novaEtapa='+etapaEscolhida.toUpperCase(),{method:'PATCH'});
        atualizado=missaFromApi(dto2);
      }
      Object.assign(datashowCache.find(x=>x.id===modalId),atualizado);
    }else{
      const dto=await api('/datashow/missas',{method:'POST',body:JSON.stringify(missaToApi(data))});
      atualizado=missaFromApi(dto);
      if(etapaEscolhida!==atualizado.etapa){
        const dto2=await api('/datashow/missas/'+atualizado.id+'/etapa?novaEtapa='+etapaEscolhida.toUpperCase(),{method:'PATCH'});
        atualizado=missaFromApi(dto2);
      }
      datashowCache.push(atualizado);
    }
    closeModal(); render(); toast('Missa salva.');
  }catch(e){ toast(e.message,'warn'); }
}
async function delDatashow(){
  try{
    await api('/datashow/missas/'+modalId,{method:'DELETE'});
    datashowCache=datashowCache.filter(x=>x.id!==modalId);
    closeModal(); render(); toast('Missa excluída.');
  }catch(e){ toast(e.message,'warn'); }
}
async function moveDatashow(id,to){
  try{
    const dto=await api('/datashow/missas/'+id+'/etapa?novaEtapa='+to.toUpperCase(),{method:'PATCH'});
    Object.assign(datashowCache.find(x=>x.id===id),missaFromApi(dto));
    render(); toast('Etapa atualizada.');
  }catch(e){ toast(e.message,'warn'); }
}

async function saveTransmissao(){
  const data={
    tipo:$('#tm-tipo').value, titulo:$('#tm-titulo').value.trim(), data:$('#tm-data').value, horario:$('#tm-horario').value,
    tema:$('#tm-tema').value.trim(), link:$('#tm-link').value.trim(), capa:$('#tm-capa').value.trim(),
    responsavel:$('#tm-resp').value||null
  };
  const etapaEscolhida=$('#tm-etapa').value;
  if(!data.data||!data.titulo){toast('Preencha pelo menos o título e a data.','warn');return;}
  try{
    let atualizado;
    if(modalId){
      const dto=await api('/transmissoes/'+modalId,{method:'PUT',body:JSON.stringify(transmissaoToApi(data))});
      atualizado=transmissaoFromApi(dto);
      if(etapaEscolhida!==atualizado.etapa){
        const dto2=await api('/transmissoes/'+modalId+'/etapa?novaEtapa='+etapaEscolhida.toUpperCase(),{method:'PATCH'});
        atualizado=transmissaoFromApi(dto2);
      }
      Object.assign(transmissaoCache.find(x=>x.id===modalId),atualizado);
    }else{
      const dto=await api('/transmissoes',{method:'POST',body:JSON.stringify(transmissaoToApi(data))});
      atualizado=transmissaoFromApi(dto);
      if(etapaEscolhida!==atualizado.etapa){
        const dto2=await api('/transmissoes/'+atualizado.id+'/etapa?novaEtapa='+etapaEscolhida.toUpperCase(),{method:'PATCH'});
        atualizado=transmissaoFromApi(dto2);
      }
      transmissaoCache.push(atualizado);
    }
    closeModal(); render(); toast('Transmissão salva.');
  }catch(e){ toast(e.message,'warn'); }
}
async function delTransmissao(){
  try{
    await api('/transmissoes/'+modalId,{method:'DELETE'});
    transmissaoCache=transmissaoCache.filter(x=>x.id!==modalId);
    closeModal(); render(); toast('Transmissão excluída.');

async function saveModal(){
  const checks={}; $$('input[name=chk]').forEach(i=>{checks[i.value]=i.checked;});
  const data={title:$('#f-title').value.trim(),fmt:$('#f-fmt').value,theme:$('#f-theme').value,owner:$('#f-owner').value||null,stage:$('#f-stage').value,due:$('#f-due').value,pub:$('#f-pub').value,notes:$('#f-notes').value,checks:checks};
  if(!data.title){toast('Dê um título ao cartão antes de salvar.','warn');return;}
  try{
    if(modalId){
      const c=card(modalId);
      if(data.stage!==c.stage){const err=moveRule(Object.assign({},c,data),data.stage);if(err){toast(err,'warn');return;}}
      const dto=await api('/cartoes/'+modalId,{method:'PUT',body:JSON.stringify(cartaoToApi(data))});
      let atualizado=cartaoFromApi(dto);
      if(data.stage!==c.stage){
        const dto2=await api('/cartoes/'+modalId+'/etapa?novaEtapa='+data.stage.toUpperCase(),{method:'PATCH'});
        atualizado=cartaoFromApi(dto2);
      }
      Object.assign(c,atualizado);
    }else{
      const err=moveRule(data,data.stage); if(err){toast(err,'warn');return;}
      const dto=await api('/cartoes',{method:'POST',body:JSON.stringify(cartaoToApi(data))});
      let novo=cartaoFromApi(dto);
      if(data.stage&&data.stage!=='ideia'){
        const dto2=await api('/cartoes/'+novo.id+'/etapa?novaEtapa='+data.stage.toUpperCase(),{method:'PATCH'});
        novo=cartaoFromApi(dto2);
      }
      state.cards.push(novo);
    }
    closeModal(); render(); toast('Cartão salvo.');
  }catch(e){ toast(e.message,'warn'); }
}

function abrirExclusao(tipo,id,titulo){
  exclusaoAlvo={tipo:tipo,id:id,titulo:titulo};
  const o=$('#overlay');
  o.innerHTML=motivoExclusaoModal(titulo); o.hidden=false;
}
async function confirmarExclusao(){
  if(!exclusaoAlvo) return;
  const checked=$('input[name=motivo-exclusao]:checked');
  const motivo=checked?checked.value:'OUTRO';
  const detalhe=($('#f-motivo-detalhe').value||'').trim()||null;
  const {tipo,id}=exclusaoAlvo;
  try{
    if(tipo==='cartao'){
      await api('/cartoes/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.cards=state.cards.filter(c=>c.id!==id);
      toast('Cartão movido para a lixeira.');
    }else if(tipo==='ideia'){
      await api('/ideias/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.ideas=state.ideas.filter(i=>i.id!==id);
      toast('Ideia movida para a lixeira.');
    }else if(tipo==='evento'){
      await api('/eventos/'+id+'/lixeira',{method:'POST',body:JSON.stringify({motivo:motivo,detalhe:detalhe})});
      state.events=state.events.filter(e=>e.id!==id);
      toast('Escala movida para a lixeira.');
    }
    exclusaoAlvo=null;
    lixeira={cartoes:null,ideias:null,eventos:null,loading:false,setor:null};
    closeModal(); render();
  }catch(e){ toast(e.message,'warn'); }
}
async function carregarLixeira(){
  lixeira.loading=true; lixeira.setor=currentSetor; render();
  try{
    const [cartoes,ideias,eventos]=await Promise.all([
      api('/cartoes/lixeira?setor='+currentSetor.toUpperCase()),
      api('/ideias/lixeira?setor='+currentSetor.toUpperCase()),
      api('/eventos/lixeira')
    ]);
    lixeira.cartoes=cartoes.map(cartaoFromApi);
    lixeira.ideias=ideias.map(ideiaFromApi);
    lixeira.eventos=eventos.map(eventoFromApi);
  }catch(e){ lixeira.cartoes=[]; lixeira.ideias=[]; lixeira.eventos=[]; toast(e.message,'warn'); }
  lixeira.loading=false; render();
}
async function restaurarItem(tipo,id){
  try{
    if(tipo==='cartao'){
      const dto=await api('/cartoes/'+id+'/restaurar',{method:'POST'});
      state.cards.push(cartaoFromApi(dto));
      lixeira.cartoes=lixeira.cartoes.filter(c=>c.id!==id);
      toast('Cartão restaurado.');
    }else if(tipo==='ideia'){
      const dto=await api('/ideias/'+id+'/restaurar',{method:'POST'});
      state.ideas.push(ideiaFromApi(dto));
      lixeira.ideias=lixeira.ideias.filter(i=>i.id!==id);
      toast('Ideia restaurada.');
    }else if(tipo==='evento'){
      const dto=await api('/eventos/'+id+'/restaurar',{method:'POST'});
      state.events.push(eventoFromApi(dto));
      lixeira.eventos=lixeira.eventos.filter(e=>e.id!==id);
      toast('Escala restaurada.');
    }
    render();
  }catch(e){ toast(e.message,'warn'); }
}

    '<label class="fld" style="margin-top:10px"><span>E-mail</span><input type="text" value="'+esc(g.email)+'" disabled></label>'+
    '<label class="fld" style="margin-top:10px"><span>Você é...</span><select id="au-role">'+ROLES.map(r=>'<option value="'+r.id+'">'+r.nome+'</option>').join('')+'</select></label>'+
    '<label class="fld" id="au-setor-wrap" style="margin-top:10px"><span>Setor</span><select id="au-setor">'+SETORES.map(s=>'<option value="'+s.id+'">'+s.nome+'</option>').join('')+'</select></label>'+
    '<label class="fld" style="margin-top:10px"><span>Função (opcional)</span><input id="au-funcao" type="text" placeholder="Ex.: Edição de vídeo"></label>'+
    '<button class="btn primary" style="width:100%;margin-top:18px" data-action="doCompletarGoogle">Concluir cadastro</button>'+
    '<p class="note" style="margin-top:16px;text-align:center"><button type="button" class="link-btn" data-action="toLogin">Cancelar</button></p>'+
    '</div></div>';
}
function renderAuth(){
  $('#app').hidden=true;
  const el=$('#authScreen');
  el.hidden=false;
  el.innerHTML = authMode==='cadastro' ? cadastroHtml()
    : authMode==='esqueci' ? esqueciSenhaHtml()
    : authMode==='redefinir' ? redefinirSenhaHtml()
    : authMode==='completarGoogle' ? completarGoogleHtml()
    : loginHtml();
  if(authMode==='login') renderGoogleButton('google-btn-login');
  if(authMode==='cadastro') renderGoogleButton('google-btn-cadastro');
  setTimeout(()=>{const f=$('#au-email')||$('#au-senha-nova');if(f)f.focus();},30);
}
let toastTimer=null;
function toast(msg,type){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(type==='warn'?' warn':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.className='toast';},3600);
}
async function moveCard(id,to){
  const c=card(id); if(!c||c.stage===to) return;
  const err=moveRule(c,to); if(err){toast(err,'warn');return;}
  try{
    const dto=await api('/cartoes/'+id+'/etapa?novaEtapa='+to.toUpperCase(),{method:'PATCH'});
    Object.assign(c,cartaoFromApi(dto));
    render(); toast('“'+c.title+'” foi para '+stageName(to)+'.');
  }catch(e){ toast(e.message,'warn'); }
}
async function voteIdeia(id){
  try{
    const dto=await api('/ideias/'+id+'/votar',{method:'POST'});
    const i=state.ideas.find(x=>x.id===id);
    Object.assign(i,ideiaFromApi(dto));
    render();
  }catch(e){ toast(e.message,'warn'); }
}
async function adoptIdeia(id){
  try{
    const cartaoDto=await api('/ideias/'+id+'/adotar',{method:'POST'});
    const i=state.ideas.find(x=>x.id===id); if(i) i.adopted=true;
    state.cards.push(cartaoFromApi(cartaoDto));
    render(); toast('A ideia virou um cartão na coluna Ideia do quadro.');
  }catch(e){ toast(e.message,'warn'); }
}
async function addIdea(){
  const ti=$('#i-title').value.trim(); if(!ti){toast('Escreva o título da ideia.','warn');return;}
  try{
    const dto=await api('/ideias',{method:'POST',body:JSON.stringify({titulo:ti,descricao:$('#i-desc').value.trim()||null,tema:$('#i-theme').value,setor:currentSetor.toUpperCase()})});
    state.ideas.push(ideiaFromApi(dto));
    render(); toast('Ideia enviada. Agora a equipe pode votar.');
  }catch(e){ toast(e.message,'warn'); }
}
async function joinSlot(evId,slotId){
  const ev=state.events.find(x=>x.id===evId);
  if(ev.slots.some(x=>x.who===state.me)){toast('Você já está nesta escala.','warn');return;}
  try{
    const dto=await api('/eventos/'+evId+'/slots/'+slotId+'/inscrever',{method:'POST'});
    Object.assign(ev,eventoFromApi(dto));
    render(); toast('Presença confirmada em '+ev.title+'.');
  }catch(e){ toast(e.message,'warn'); }
}
async function leaveSlot(evId,slotId){
  const ev=state.events.find(x=>x.id===evId);
  try{
    const dto=await api('/eventos/'+evId+'/slots/'+slotId+'/desinscrever',{method:'POST'});
    Object.assign(ev,eventoFromApi(dto));
    render(); toast('Vaga liberada.');
  }catch(e){ toast(e.message,'warn'); }
}

/* =====================================================================
   9. EVENTOS
   ===================================================================== */
document.addEventListener('click',e=>{
  if(e.target.id==='overlay'){closeModal();return;}
  if(setorMenuOpen&&!e.target.closest('.setor-switch')){setorMenuOpen=false;renderSide();}
  const t=e.target.closest('[data-action]'); if(!t) return;
  const a=t.dataset.action, id=t.dataset.id;
  switch(a){
    case 'nav': view=t.dataset.view; mobileNavOpen=false; render(); if(view==='assistente'&&chatLog.length) scrollChatToBottom(); else $('.main').scrollTop=0; if(view==='dashboard'){ if(!dashboardCache[dashboardPeriodo]) carregarDashboard(); if(metasCache===null) carregarMetas(); } if(view==='quadro'&&currentSetor==='datashow'&&datashowCache===null) carregarDatashow(); if(view==='quadro'&&currentSetor==='transmissoes_videos'&&transmissaoCache===null) carregarTransmissoes(); if(view==='lixeira'&&(lixeira.cartoes===null||lixeira.setor!==currentSetor)) carregarLixeira(); break;
    case 'toggleMobileNav': mobileNavOpen=!mobileNavOpen; render(); break;
    case 'closeMobileNav': mobileNavOpen=false; render(); break;
    case 'dashPeriodo': dashboardPeriodo=t.dataset.periodo; render(); if(!dashboardCache[dashboardPeriodo]) carregarDashboard(); break;
    case 'sincronizarInstagram': sincronizarInstagram(); break;
    case 'toggleMetaForm': metaFormOpen=!metaFormOpen; render(); break;
    case 'salvarMeta': salvarMeta(); break;
    case 'excluirMeta': excluirMeta(t.dataset.id); break;
    case 'toggleSetorMenu': setorMenuOpen=!setorMenuOpen; renderSide(); break;
    case 'setSetor': currentSetor=t.dataset.setor; setorMenuOpen=false; mobileNavOpen=false; render(); $('.main').scrollTop=0; if(view==='quadro'&&currentSetor==='datashow'&&datashowCache===null) carregarDatashow(); if(view==='quadro'&&currentSetor==='transmissoes_videos'&&transmissaoCache===null) carregarTransmissoes(); if(view==='lixeira'&&(lixeira.cartoes===null||lixeira.setor!==currentSetor)) carregarLixeira(); break;
    case 'chatEnviar': {
      const inp=$('#chat-input'); if(!inp) break;
      const texto=inp.value; inp.value='';
      sendChatMessage(texto);
      break;}
    case 'chatSugestao': sendChatMessage(t.dataset.texto); break;
    case 'open': openCard(id); break;
    case 'new': openCard(null,{}); break;
    case 'newOn': openCard(null,{pub:t.dataset.date}); break;
    case 'newIn': openCard(null,{stage:t.dataset.stage}); break;
    case 'prev': {const c=card(id);moveCard(id,STAGES[stageIdx(c.stage)-1].id);break;}
    case 'next': {const c=card(id);moveCard(id,STAGES[stageIdx(c.stage)+1].id);break;}
    case 'close': closeModal(); break;
    case 'save': saveModal(); break;
    case 'excluirCartao': {const c=card(modalId); abrirExclusao('cartao',modalId,c?c.title:'Este cartão'); break;}
    case 'excluirIdeia': {const i=state.ideas.find(x=>x.id===id); abrirExclusao('ideia',id,i?i.title:'Esta ideia'); break;}
    case 'excluirEvento': {const e=state.events.find(x=>x.id===id); abrirExclusao('evento',id,e?e.title:'Esta escala'); break;}
    case 'confirmarExclusao': confirmarExclusao(); break;
    case 'restaurar': restaurarItem(t.dataset.tipo,t.dataset.id); break;
    case 'openDatashow': openDatashow(id); break;
    case 'novaEscala': abrirNovaEscala(); break;
    case 'adicionarSlotForm': sincronizarSlotFormDoDOM(); escalaFormSlots.push({rotulo:'',tipo:'FOTO'}); reabrirEscalaModal(); break;
    case 'removerSlotForm': sincronizarSlotFormDoDOM(); escalaFormSlots.splice(Number(t.dataset.i),1); reabrirEscalaModal(); break;
    case 'salvarEscala': salvarEscala(); break;
    case 'gerarEscalasMes': gerarEscalasMes(); break;
    case 'toggleAddSlot': addSlotEventoId=(addSlotEventoId===id?null:id); render(); break;
    case 'salvarSlotExistente': salvarSlotExistente(t.dataset.ev); break;
    case 'newDatashow': openDatashow(null); break;
    case 'saveDatashow': saveDatashow(); break;
    case 'delDatashow':
      if(t.dataset.sure){ delDatashow(); }
      else{t.dataset.sure='1';t.textContent='Confirmar exclusão';}
      break;
    case 'datashowPrev': {const m=datashowCache.find(x=>x.id===id);moveDatashow(id,DATASHOW_STAGES[datashowStageIdx(m.etapa)-1].id);break;}
    case 'datashowNext': {const m=datashowCache.find(x=>x.id===id);moveDatashow(id,DATASHOW_STAGES[datashowStageIdx(m.etapa)+1].id);break;}
    case 'openTransmissao': openTransmissao(id); break;
    case 'newTransmissao': openTransmissao(null); break;
    case 'saveTransmissao': saveTransmissao(); break;
    case 'delTransmissao':
      if(t.dataset.sure){ delTransmissao(); }
      else{t.dataset.sure='1';t.textContent='Confirmar exclusão';}
      break;
    case 'gerarTransmissoesMes': gerarTransmissoesMes(); break;
    case 'transmissaoAba': transmissaoAba=t.dataset.aba; render(); break;
    case 'transmissaoPrev': {const tr=transmissaoCache.find(x=>x.id===id);moveTransmissao(id,TRANSMISSAO_STAGES[transmissaoStageIdx(tr.etapa)-1].id);break;}
    case 'transmissaoNext': {const tr=transmissaoCache.find(x=>x.id===id);moveTransmissao(id,TRANSMISSAO_STAGES[transmissaoStageIdx(tr.etapa)+1].id);break;}
    case 'comment': {
      const inp=$('#f-comment'); const txt=inp.value.trim(); if(!txt||!modalId) return;
      inp.value='';
      addComment(modalId,txt);
      break;}
    case 'calPrev': cal.m--; if(cal.m<0){cal.m=11;cal.y--;} render(); break;
    case 'calNext': cal.m++; if(cal.m>11){cal.m=0;cal.y++;} render(); break;
    case 'calToday': cal={y:new Date().getFullYear(),m:new Date().getMonth()}; render(); break;
    case 'goDate': {const d=parse(t.dataset.date);cal={y:d.getFullYear(),m:d.getMonth()};view='calendario';render();$('.main').scrollTop=0;break;}
    case 'vote': voteIdeia(id); break;
    case 'adopt': adoptIdeia(id); break;
    case 'addIdea': addIdea(); break;
    case 'join': joinSlot(t.dataset.ev,t.dataset.slot); break;
    case 'leave': leaveSlot(t.dataset.ev,t.dataset.slot); break;
    case 'copy': {
      const txt=TEMPLATES[t.dataset.key].texto;
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Modelo copiado.')).catch(()=>toast('Não foi possível copiar aqui. Selecione o texto manualmente.','warn'));}
      else toast('Não foi possível copiar aqui. Selecione o texto manualmente.','warn');
      break;}
    case 'pasta': toast('Na versão real, esta pasta abriria o Google Drive da Pascom.'); break;
    case 'doLogin': doLogin(); break;
    case 'doCadastro': doCadastro(); break;
    case 'doEsqueciSenha': doEsqueciSenha(); break;
    case 'doRedefinirSenha': doRedefinirSenha(); break;
    case 'doCompletarGoogle': doCompletarGoogle(); break;
    case 'toCadastro': authMode='cadastro'; authError=''; authOk=''; pendingGoogle=null; renderAuth(); break;
    case 'toLogin': authMode='login'; authError=''; authOk=''; pendingGoogle=null; renderAuth(); break;
    case 'toEsqueciSenha': authMode='esqueci'; authError=''; authOk=''; renderAuth(); break;
    case 'logout': logout(); break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fo'){filters.owner=e.target.value;refreshBoard();}
  if(e.target.id==='au-role'){
    const wrap=$('#au-setor-wrap');
    if(wrap) wrap.hidden=(e.target.value==='coordenador_geral');
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){filters.q=e.target.value;refreshBoard();}
  if(e.target.id==='chat-input') chatAutoGrow(e.target);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#overlay').hidden) closeModal();
  if(e.key==='Escape'&&mobileNavOpen){ mobileNavOpen=false; render(); }
  if(e.key==='Enter'){
    const idAtt=e.target.id;
    if(idAtt==='au-email'||idAtt==='au-senha'||idAtt==='au-nome'||idAtt==='au-funcao'){
      e.preventDefault();
      if(authMode==='cadastro') doCadastro();
      else if(authMode==='esqueci') doEsqueciSenha();
      else if(authMode==='completarGoogle') doCompletarGoogle();
      else doLogin();
    }
    if(idAtt==='au-senha-nova'||idAtt==='au-senha-confirma'){
      e.preventDefault();
      doRedefinirSenha();
    }
    if(idAtt==='chat-input'&&!e.shiftKey){
      e.preventDefault();
      const texto=e.target.value; e.target.value=''; chatAutoGrow(e.target);
      sendChatMessage(texto);
    }
  }
});

/* Arrastar e soltar entre colunas */
let dragId=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('.kcard');if(!k)return;dragId=k.dataset.id;k.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(x){}});
document.addEventListener('dragend',e=>{dragId=null;$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.kbody.over').forEach(x=>x.classList.remove('over'));});
document.addEventListener('dragover',e=>{const b=e.target.closest&&e.target.closest('.kbody');if(!b||!dragId)return;e.preventDefault();$$('.kbody.over').forEach(x=>{if(x!==b)x.classList.remove('over');});b.classList.add('over');});
document.addEventListener('drop',e=>{const b=e.target.closest&&e.target.closest('.kbody');if(!b||!dragId)return;e.preventDefault();const id=dragId;dragId=null;moveCard(id,b.dataset.stage);});

/* =====================================================================
   10. INICIALIZAÇÃO
   ===================================================================== */
async function init(){
  try{
    const params=new URLSearchParams(window.location.search);
    const tk=params.get('resetToken');
    if(tk){
      resetToken=tk; authMode='redefinir'; authError=''; authOk='';
      history.replaceState(null,'',window.location.pathname);
      render();
      return;
    }
  }catch(e){}
  if(authToken){
    const claims=decodeJwt(authToken);
    if(claims&&claims.exp&&claims.exp*1000>Date.now()&&claims.id){
      try{ await carregarTudo(claims.id); render(); return; }catch(e){}
    }
    authToken=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
  }
  render();
}
init();
})();
